<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>امسح للبحث عن مكان امتحانك</title>
<style>
  :root {
    --gold: #b8935f;
    --gold-dark: #8a6d42;
    --navy: #1a2a3d;
    --navy-light: #24384f;
    --bg: #f4f1ea;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    font-family: 'Segoe UI', Tahoma, Geneva, Arial, sans-serif;
  }
  body {
    background: linear-gradient(160deg, var(--navy) 0%, var(--navy-light) 55%, #2c4a63 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .poster {
    position: relative;
    background: #fffdf8;
    width: 100%;
    max-width: 520px;
    border-radius: 26px;
    padding: 40px 34px 34px;
    text-align: center;
    box-shadow: 0 24px 60px rgba(0,0,0,0.35);
    overflow: hidden;
    border: 1px solid rgba(184,147,95,0.35);
  }
  .poster::before {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(45deg, rgba(184,147,95,0.045) 0 2px, transparent 2px 40px);
    pointer-events: none;
  }
  .corner {
    position: absolute;
    width: 46px; height: 46px;
    border: 2.5px solid var(--gold);
  }
  .corner.tl { top: 14px; left: 14px; border-width: 2.5px 0 0 2.5px; border-radius: 10px 0 0 0; }
  .corner.tr { top: 14px; right: 14px; border-width: 2.5px 2.5px 0 0; border-radius: 0 10px 0 0; }
  .corner.bl { bottom: 14px; left: 14px; border-width: 0 0 2.5px 2.5px; border-radius: 0 0 0 10px; }
  .corner.br { bottom: 14px; right: 14px; border-width: 0 2.5px 2.5px 0; border-radius: 0 0 10px 0; }

  .inst-name {
    position: relative;
    font-size: 15px;
    font-weight: 700;
    color: var(--navy);
    letter-spacing: .2px;
  }
  .prog-name {
    position: relative;
    font-size: 12.5px;
    color: var(--gold-dark);
    margin-top: 3px;
    font-weight: 600;
  }
  .divider {
    width: 60px;
    height: 3px;
    background: var(--gold);
    margin: 14px auto 16px;
    border-radius: 3px;
    position: relative;
  }

  .exam-tag {
    position: relative;
    display: inline-block;
    font-size: 13px;
    font-weight: 700;
    color: var(--navy);
    background: rgba(184,147,95,0.14);
    border: 1px solid rgba(184,147,95,0.4);
    padding: 6px 20px;
    border-radius: 30px;
    margin-bottom: 26px;
  }

  .qr-frame {
    position: relative;
    width: 260px;
    height: 260px;
    margin: 0 auto 26px;
    background: #fff;
    border-radius: 20px;
    padding: 16px;
    box-shadow: 0 10px 30px rgba(26,42,61,0.15);
    border: 3px solid var(--navy);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .qr-frame img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    image-rendering: pixelated;
  }
  .qr-frame::before,
  .qr-frame::after {
    content: "";
    position: absolute;
    width: 22px; height: 22px;
    border: 3px solid var(--gold);
  }
  .qr-frame::before { top: -8px; left: -8px; border-width: 3px 0 0 3px; border-radius: 6px 0 0 0; }
  .qr-frame::after { bottom: -8px; right: -8px; border-width: 0 3px 3px 0; border-radius: 0 0 6px 0; }

  .cta {
    position: relative;
    font-size: 22px;
    font-weight: 800;
    color: var(--navy);
    line-height: 1.5;
    margin-bottom: 10px;
  }
  .cta .highlight {
    color: var(--gold-dark);
  }
  .sub-cta {
    position: relative;
    font-size: 13.5px;
    color: #6b7686;
    margin-bottom: 24px;
    line-height: 1.6;
  }

  .link-box {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--bg);
    border: 1px solid #e3ddd0;
    border-radius: 10px;
    padding: 9px 16px;
    font-size: 12px;
    color: var(--navy-light);
    direction: ltr;
    font-family: 'Consolas', monospace;
    word-break: break-all;
  }

  footer {
    position: relative;
    margin-top: 26px;
    font-size: 11px;
    color: #a3aab5;
  }

  @media print {
    body { background: #fff; padding: 0; }
    .poster { box-shadow: none; border: 1px solid #ccc; max-width: 100%; }
    @page { margin: 12mm; }
  }
</style>
</head>
