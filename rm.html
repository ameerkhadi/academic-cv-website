<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نتائج توزيع القاعات - قادة المستقبل</title>
<style>
  :root {
    --gold: #b8935f;
    --gold-dark: #8a6d42;
    --navy: #1a2a3d;
    --navy-light: #24384f;
    --bg: #f4f1ea;
    --card: #ffffff;
    --text: #23303f;
    --muted: #6b7686;
    --border: #e3ddd0;
    --room1: #1a5f4a;
    --room1-bg: #e6f2ee;
    --room2: #8a3b1f;
    --room2-bg: #f5e9e2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Arial, sans-serif;
    background: linear-gradient(180deg, var(--bg) 0%, #ece7db 100%);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 55%, #2c4a63 100%);
    color: #fff;
    padding: 36px 20px 30px;
    text-align: center;
    position: relative;
    overflow: hidden;
    box-shadow: 0 4px 18px rgba(0,0,0,0.18);
  }
  header::before {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(45deg, rgba(184,147,95,0.06) 0 2px, transparent 2px 40px);
    pointer-events: none;
  }
  .crest {
    width: 64px; height: 64px;
    margin: 0 auto 12px;
    border: 2px solid var(--gold);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
    background: rgba(184,147,95,0.12);
    color: var(--gold);
  }
  header h1 {
    margin: 0 0 6px;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: .3px;
  }
  header h2 {
    margin: 0 0 4px;
    font-size: 15px;
    font-weight: 400;
    color: #d8c9a9;
  }
  .divider {
    width: 70px;
    height: 3px;
    background: var(--gold);
    margin: 14px auto;
    border-radius: 3px;
  }
  header .exam-title {
    font-size: 19px;
    font-weight: 700;
    color: #fff;
    background: rgba(184,147,95,0.18);
    display: inline-block;
    padding: 8px 22px;
    border-radius: 30px;
    border: 1px solid rgba(184,147,95,0.5);
    margin-top: 6px;
  }

  main {
    max-width: 1000px;
    margin: -22px auto 40px;
    padding: 0 16px;
  }

  .search-card {
    background: var(--card);
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 8px 28px rgba(26,42,61,0.12);
    border: 1px solid var(--border);
    position: relative;
    z-index: 2;
  }
  .search-box {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 10px 16px;
    transition: border-color .2s, box-shadow .2s;
  }
  .search-box:focus-within {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(184,147,95,0.15);
  }
  .search-box svg { flex-shrink: 0; color: var(--gold-dark); }
  .search-box input {
    border: none;
    outline: none;
    background: transparent;
    font-size: 16px;
    width: 100%;
    color: var(--text);
    font-family: inherit;
  }
  .search-box input::placeholder { color: #a3aab5; }

  .stats-row {
    display: flex;
    gap: 10px;
    margin-top: 14px;
    flex-wrap: wrap;
  }
  .stat-pill {
    flex: 1;
    min-width: 140px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    text-align: center;
  }
  .stat-pill .num {
    font-size: 20px;
    font-weight: 700;
    color: var(--navy);
  }
  .stat-pill .label {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }
  .stat-pill.room1 .num { color: var(--room1); }
  .stat-pill.room2 .num { color: var(--room2); }

  .result-count {
    margin: 18px 4px 10px;
    font-size: 13px;
    color: var(--muted);
  }
  .result-count b { color: var(--navy); }

  .table-wrap {
    background: var(--card);
    border-radius: 16px;
    box-shadow: 0 8px 28px rgba(26,42,61,0.08);
    border: 1px solid var(--border);
    overflow: hidden;
  }
  table {
    width: 100%;
    border-collapse: collapse;
  }
  thead th {
    background: var(--navy);
    color: #fff;
    padding: 14px 12px;
    font-size: 13px;
    font-weight: 600;
    text-align: right;
    position: sticky;
    top: 0;
  }
  thead th:first-child { text-align: center; width: 50px; }
  tbody td {
    padding: 12px;
    font-size: 14px;
    border-bottom: 1px solid var(--border);
    color: var(--text);
  }
  tbody td:first-child { text-align: center; color: var(--muted); font-size: 12px; }
  tbody tr:hover { background: #faf8f3; }
  tbody tr:last-child td { border-bottom: none; }

  .code-badge {
    display: inline-block;
    font-family: 'Consolas', monospace;
    font-weight: 700;
    letter-spacing: 1px;
    background: #fdf6ea;
    color: var(--gold-dark);
    border: 1px solid #ecd9b8;
    padding: 3px 10px;
    border-radius: 6px;
    font-size: 13px;
  }
  .room-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 12.5px;
    font-weight: 600;
    white-space: nowrap;
  }
  .room-badge.r1 { background: var(--room1-bg); color: var(--room1); }
  .room-badge.r2 { background: var(--room2-bg); color: var(--room2); }
  .room-badge::before {
    content: "";
    width: 7px; height: 7px;
    border-radius: 50%;
    background: currentColor;
  }

  mark {
    background: rgba(184,147,95,0.35);
    color: inherit;
    border-radius: 3px;
    padding: 0 2px;
  }

  .no-results {
    text-align: center;
    padding: 50px 20px;
    color: var(--muted);
    display: none;
  }
  .no-results.show { display: block; }
  .no-results .icon { font-size: 40px; margin-bottom: 10px; opacity: .5; }

  footer {
    text-align: center;
    padding: 24px 16px 30px;
    color: var(--muted);
    font-size: 12.5px;
  }
  footer .line1 { color: var(--navy); font-weight: 600; margin-bottom: 3px; }

  @media (max-width: 560px) {
    thead th, tbody td { padding: 9px 8px; font-size: 12.5px; }
    header .exam-title { font-size: 16px; padding: 7px 16px; }
    header h1 { font-size: 18px; }
  }
</style>
</head>

const tableBody = document.getElementById('tableBody');
const searchInput = document.getElementById('searchInput');
const resultCount = document.getElementById('resultCount');
const noResults = document.getElementById('noResults');
const totalCount = document.getElementById('totalCount');
const room1Count = document.getElementById('room1Count');
const room2Count = document.getElementById('room2Count');

totalCount.textContent = toArabicNum(students.length);
room1Count.textContent = toArabicNum(students.filter(s => s.room === 'قاعة الانتصار').length);
room2Count.textContent = toArabicNum(students.filter(s => s.room === 'قاعة بابل').length);

function toArabicNum(num) {
  const arabicDigits = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
  return String(num).replace(/[0-9]/g, d => arabicDigits[d]);
}

function escapeHtml(str) {
  return str.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function highlight(text, query) {
  if (!query) return escapeHtml(text);
  const escaped = escapeHtml(text);
  const escapedQuery = escapeHtml(query).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const re = new RegExp('(' + escapedQuery + ')', 'gi');
  return escaped.replace(re, '<mark>$1</mark>');
}

function render(filter = '') {
  const q = filter.trim().toLowerCase();
  const filtered = students.filter(s =>
    s.name.toLowerCase().includes(q) || s.code.includes(q)
  );

  tableBody.innerHTML = filtered.map(s => `
    <tr>
      <td>${toArabicNum(s.n)}</td>
      <td>${highlight(s.name, filter.trim())}</td>
      <td><span class="code-badge">${highlight(s.code, filter.trim())}</span></td>
      <td><span class="room-badge ${s.room === 'قاعة الانتصار' ? 'r1' : 'r2'}">${s.room}</span></td>
    </tr>
  `).join('');

  if (filter.trim()) {
    resultCount.innerHTML = `تم العثور على <b>${toArabicNum(filtered.length)}</b> نتيجة من أصل <b>${toArabicNum(students.length)}</b>`;
  } else {
    resultCount.innerHTML = `عرض جميع الطلبة (<b>${toArabicNum(students.length)}</b>)`;
  }

  noResults.classList.toggle('show', filtered.length === 0);
  tableBody.parentElement.style.display = filtered.length === 0 ? 'none' : 'table';
}

searchInput.addEventListener('input', e => render(e.target.value));

render();
