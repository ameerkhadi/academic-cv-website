<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="جدولي">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1d5fa8">
<title>جدولي الذكي</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#1b1f24;--muted:#69717c;--line:#e3e5e9;--accent:#1d5fa8;--live:#12805c;--live-bg:#e3f6ee;--warn:#8a5a00;--warn-bg:#fff1cf;--done:#a0a6ae;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101316;--card:#1a1e23;--text:#eceef1;--muted:#97a0ab;--line:#2a3037;--accent:#6aa9ec;--live:#4cd6a0;--live-bg:#12312a;--warn:#f1d58a;--warn-bg:#3a2f12;--done:#5d656f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101316;--card:#1a1e23;--text:#eceef1;--muted:#97a0ab;--line:#2a3037;--accent:#6aa9ec;--live:#4cd6a0;--live-bg:#12312a;--warn:#f1d58a;--warn-bg:#3a2f12;--done:#5d656f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",Tahoma,Roboto,Arial,sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:18px 14px 40px}
.top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.top h1{font-size:1.15rem;margin:0}
.clock{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem}
.hero{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:12px}
.hero.live{background:var(--live-bg);border-color:var(--live)}
.tag{display:inline-block;font-size:.78rem;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--accent);color:#fff}
.live .tag{background:var(--live);color:#fff}
.course{font-size:1.25rem;font-weight:700;margin:8px 0 2px}
.meta{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:4px 12px;font-size:.95rem}
.chip b{font-size:1.15rem}
.count{font-size:2.3rem;font-weight:800;font-variant-numeric:tabular-nums;margin:6px 0 2px;direction:ltr;text-align:right}
.lbl{color:var(--muted);font-size:.85rem}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--live);width:0;transition:width 1s linear}
.alert{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:8px 12px;margin-top:10px;font-size:.9rem}
.sec{font-size:.85rem;color:var(--muted);font-weight:700;margin:18px 4px 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 14px;margin-bottom:10px}
.card.today{border-color:var(--accent);border-width:2px}
.card h3{margin:10px 0 2px;font-size:1rem}
.empty{color:var(--muted);padding:8px 0 12px;font-size:.92rem}
.r{display:grid;grid-template-columns:96px 46px 1fr auto;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:.93rem}
.r.first{border-top:0}
.r .t{direction:ltr;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.r .h{background:var(--accent);color:#fff;border-radius:999px;padding:1px 10px;font-weight:700;font-size:.85rem;direction:ltr}
.r.done{color:var(--done)}.r.done .h{background:var(--done)}
.r.now{color:var(--live);font-weight:700}
.st{font-size:.75rem}
.sc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px;font-size:.92rem}.sc.hl{border:2px solid var(--live)}.sh{display:flex;gap:8px;align-items:center;margin-bottom:4px}.sh .lbl{margin-inline-start:auto}.sc .tag{background:var(--live)}.foot{color:var(--muted);font-size:.78rem;text-align:center;margin-top:18px}
</style>
</head>
<body>
<main>
<div class="top"><h1 id="greet">جدولي</h1><span class="clock" id="clock"></span></div>
<div id="hero"></div>
<div class="sec">أين طلبتي الآن</div><div id="stu"></div>
<div class="sec">اليوم</div><div id="today"></div>
<div class="sec">الجدول الأسبوعي الكامل</div><div id="week"></div>
<p class="foot">Cloud Computing Security · د. أمير هادي<br>بتوقيت بغداد (UTC+3) · الفصل الأول ٢٠٢٦–٢٠٢٧</p>
</main>
<script>
const COURSE="Cloud Computing Security";
// d: JS weekday (0=Sun..6=Sat); s,e in minutes from midnight
const S=[
{d:6,s:510,e:630,lv:"4-G",h:"C-041",sh:"صباحي"},
{d:6,s:990,e:1110,lv:"4-J",h:"C-035",sh:"مسائي"},
{d:6,s:1110,e:1230,lv:"4-I",h:"C-035",sh:"مسائي"},
{d:2,s:510,e:630,lv:"4-H",h:"C-036",sh:"صباحي"},
{d:2,s:510,e:630,lv:"4-E",h:"C-032",sh:"صباحي"},
{d:2,s:630,e:750,lv:"4-C",h:"C-135",sh:"صباحي"},
{d:2,s:750,e:870,lv:"4-D",h:"C-041",sh:"صباحي"},
{d:2,s:750,e:870,lv:"4-F",h:"C-041",sh:"صباحي"}
];
const DAYS=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
const ORDER=[6,0,1,2,3,4];
const K={A:'Authentication &amp; Access Control',E:'Ethical Hacking',G:'Graduate Project 1',M:'Multimedia Security',R:'Risk Management &amp; Incident',C:'Cloud Computing Security'};
const P={z:'د. زياد طارق',a:'د. علي حسين',s:'د. علي سالم',h:'د. حيدر سعدي',b:'د. باسم عبدالأمير',m:'م.م مريم إسماعيل',i:'د. أمير هادي (أنت)'};
// slot = course+teacher + hall ; sh:0 morning (08:30, 3 slots x 2h), sh:1 evening (14:30)
const L={
'4-C':{sh:0,d:{6:['G- C-036','Ah C-035','Es C-035'],0:['Ah LabA-103','Mm C-0101','-- C-041'],1:['Mm LabC-4','Rb LabC-4','-- LabC-4'],2:['Es LabC-5','Ci C-135','-- C-041']}},
'4-D':{sh:0,d:{6:['Az C-035','G- C-0135','Ea C-0135'],0:['Mm LabC-5','Rb C-0135',''],1:['Ea LabA-104','Az LabA-104',''],2:['Mm C-041','-- LabA-104','Ci C-041']}},
'4-E':{sh:0,d:{6:['Ea C-036','Az LabA-104','-- C-035'],0:['Mm LabA-104','-- C-036','Rb C-035'],1:['Az C-029','-- LabC-6','Ea LabC-5'],2:['Ci C-032','Mm C-026','G- C-0135']}},
'4-F':{sh:0,d:{6:['-- C-041','Ea C-0135','Az C-135'],0:['Rb C-033','-- C-30','Mm C-035'],1:['-- C-041','Ea LabC-5','Az LabC-5'],2:['','Mm LabC-4','Ci C-041']}},
'4-G':{sh:0,d:{6:['Ci C-041','Ea C-0135','Az C-035'],0:['G- C-041','Rb C-0135','Mm C-041'],1:['Ea LabC-5','-- C-033','Az LabC-5'],2:['-- LabA-104','Mm LabC-5','Rb C-033']}},
'4-H':{sh:0,d:{6:['Az C-0135','-- C-034','Ea C-0135'],0:['-- C-041','Mm C-036','Rb C-041'],1:['Az LabC-4','G- C-033','Ea LabA-103'],2:['Ci C-036','G- LabA-104','Mm LabC-5']}},
'4-I':{sh:1,d:{6:['Ah C-029','Es C-041','Ci C-035'],0:['Ah LabC-5','Rb C-041','-- C-038'],1:['Mm C-035','Rb C-36','-- C-031'],2:['Mm LabC-5','Es LabC-5','']}},
'4-J':{sh:1,d:{6:['Es C-029','Ci C-035','Ah C-041'],0:['Rb C-035','Ah LabC-5','-- C-038'],1:['Rb C-036','Mm C-35','-- C-031'],2:['Es LabC-5','Mm LabC-5','']}}
};
function desc(c){if(!c)return 'لا محاضرة (فراغ)';const[x,h]=c.split(' ');if(x[0]==='-')return `فراغ · القاعة <b dir='ltr'>${h}</b>`;return `${K[x[0]]} · ${x[1]==='-'?'بدون مدرس مسجّل':P[x[1]]} · القاعة <b dir='ltr'>${h}</b>`;}
function stu(dow,sec,tg,live){const mins=sec/60,tl=new Set(tg.map(x=>x.lv));
const ks=Object.keys(L).sort((a,b)=>(tl.has(b)-tl.has(a))||(a<b?-1:1));
document.getElementById('stu').innerHTML=ks.map(lv=>{const o=L[lv],base=o.sh?870:510,idx=Math.floor((mins-base)/120),dd=o.d[dow];
let body,sub='';
if(dd&&idx>=0&&idx<3){body=desc(dd[idx]);sub='تنتهي بعد '+human((base+(idx+1)*120)*60-sec);}else body='خارج وقت الدوام / لا محاضرات الآن';
const t=tg.find(x=>x.lv===lv);
if(t&&!live){const ni=Math.round((t.s-base)/120),pd=o.d[t.d];sub=ni>0?'قبل محاضرتك ('+tm(t.s)+'): '+desc(pd[ni-1]):'محاضرتك هي أول محاضرة لهم ذلك اليوم';}
return `<div class='sc ${t?'hl':''}'><div class='sh'><b dir='ltr'>${lv}</b>${t?`<span class='tag'>${live?'عندك الآن':'محاضرتك القادمة'}</span>`:''}<span class='lbl'>${o.sh?'مسائي':'صباحي'}</span></div><div>${body}</div>${sub?`<div class='lbl'>${sub}</div>`:''}</div>`;}).join('');}
const p=n=>String(n).padStart(2,"0");
const tm=m=>p(Math.floor(m/60))+":"+p(m%60);
function dur(sec){sec=Math.max(0,Math.floor(sec));const d=Math.floor(sec/86400),h=Math.floor(sec%86400/3600),m=Math.floor(sec%3600/60),s=sec%60;
return (d?d+" يوم ":"")+(h||d?p(h)+":":"")+p(m)+":"+p(s);}
function human(sec){const m=Math.round(sec/60),d=Math.floor(m/1440),h=Math.floor(m%1440/60),mm=m%60;
return [d?d+" يوم":"",h?h+" ساعة":"",mm?mm+" دقيقة":""].filter(Boolean).join(" و ")||"أقل من دقيقة";}
const clash=l=>l.length>1&&l.some((a,i)=>l.some((b,j)=>j>i&&a.d===b.d&&a.s<b.e&&b.s<a.e));
function chips(x){return `<span class="chip">القاعة <b dir="ltr">${x.h}</b></span><span class="chip">المرحلة <b dir="ltr">${x.lv}</b></span><span class="chip">${x.sh}</span>`;}
function render(){
const t0=new Date(),n=new Date(t0.getTime()+(180+t0.getTimezoneOffset())*60000),dow=n.getDay(),sec=n.getHours()*3600+n.getMinutes()*60+n.getSeconds(),mins=sec/60;
const hr=n.getHours();
document.getElementById("greet").textContent=(hr<12?"صباح الخير":hr<18?"مساء الخير":"مساء النور")+" دكتور أمير";
document.getElementById("clock").textContent=DAYS[dow]+" · "+p(n.getHours())+":"+p(n.getMinutes());
const cur=S.filter(x=>x.d===dow&&x.s<=mins&&mins<x.e);
let html="";let NX=[];
if(cur.length){
 const end=Math.min(...cur.map(x=>x.e)),st=cur[0].s,pct=Math.min(100,(sec-st*60)/((cur[0].e-st)*60)*100);
 html=`<div class="hero live"><span class="tag">● جارية الآن</span><div class="course">${COURSE}</div>
 <div class="meta">${chips(cur[0])}</div>
 <div class="count">${dur(end*60-sec)}</div><div class="lbl">المتبقي على انتهاء المحاضرة · تنتهي ${tm(end)}</div>
 <div class="bar"><i style="width:${pct}%"></i></div>
 ${cur.length>1?`<div class="alert">⚠️ تعارض: عندك ${cur.length} شعب بنفس الوقت<br>${cur.map(x=>`${x.lv} ← ${x.h}`).join(" · ")}</div>`:""}</div>`;
}else{
 let best=null;
 S.forEach(x=>{let off=(x.d-dow+7)%7;if(off===0&&x.s*60<=sec)off=7;const w=off*86400+x.s*60-sec;if(!best||w<best.w)best={w,x};});
 const nx=S.filter(x=>x.d===best.x.d&&x.s===best.x.s);NX=nx;
 const same=best.w<86400&&best.x.d===dow;
 const dn=best.x.d===dow?"اليوم":best.x.d===(dow+1)%7?"غداً":DAYS[best.x.d];
 html=`<div class="hero"><span class="tag">المحاضرة القادمة</span><div class="course">${COURSE}</div>
 <div class="meta">${nx.map(chips).join("")}</div>
 <div class="count">${dur(best.w)}</div><div class="lbl">${dn} الساعة ${tm(best.x.s)} · بعد ${human(best.w)}</div>
 ${nx.length>1?`<div class="alert">⚠️ تعارض: ${nx.length} شعب بنفس الوقت<br>${nx.map(x=>`${x.lv} ← ${x.h}`).join(" · ")}</div>`:""}</div>`;
}
document.getElementById("hero").innerHTML=html;stu(dow,sec,cur.length?cur:NX,cur.length>0);
const td=S.filter(x=>x.d===dow).sort((a,b)=>a.s-b.s);
const left=td.filter(x=>x.s*60>sec).length;
document.getElementById("today").innerHTML=td.length?`<div class="card today"><h3>${td.length} محاضرات اليوم${left?" · المتبقية "+left:" · انتهت كلها"}</h3>`+
 td.map((x,i)=>{const live=x.s<=mins&&mins<x.e,done=mins>=x.e;
 return `<div class="r ${i?"":"first"} ${live?"now":""} ${done?"done":""}"><span class="t">${tm(x.s)}–${tm(x.e)}</span><span dir="ltr">${x.lv}</span><span class="st">${live?"جارية":done?"انتهت":"قادمة"}</span><span class="h">${x.h}</span></div>`;}).join("")+`</div>`
 :`<div class="card"><div class="empty">لا توجد محاضرات اليوم 🎉</div></div>`;
document.getElementById("week").innerHTML=ORDER.map(d=>{
 const l=S.filter(x=>x.d===d).sort((a,b)=>a.s-b.s);
 return `<div class="card ${d===dow?"today":""}"><h3>${DAYS[d]}${d===dow?" · اليوم":""}${l.length?" ("+l.length+")":""}</h3>`+
 (l.length?l.map((x,i)=>`<div class="r ${i?"":"first"}"><span class="t">${tm(x.s)}–${tm(x.e)}</span><span dir="ltr">${x.lv}</span><span class="st">${x.sh}</span><span class="h">${x.h}</span></div>`).join(""):`<div class="empty">لا توجد محاضرات</div>`)+`</div>`;}).join("");
}
render();setInterval(render,1000);
document.addEventListener("visibilitychange",render);
</script>
</body>
</html>
