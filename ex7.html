<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تكامل الأنظمة الحكومية — اختبار تفاعلي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0f1a;
    --bg-2: #0d1526;
    --surface: #111b30;
    --surface-2: #16223d;
    --line: #22304a;
    --line-soft: #1a2540;
    --gold: #c9a24b;
    --gold-soft: #8a7038;
    --ink: #ece7da;
    --ink-dim: #97a0b5;
    --ink-faint: #5c6684;
    --good: #4caf7d;
    --good-bg: rgba(76,175,125,0.12);
    --bad: #d16a6a;
    --bad-bg: rgba(209,106,106,0.12);
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:
      radial-gradient(1100px 500px at 85% -10%, rgba(201,162,75,0.10), transparent 60%),
      radial-gradient(900px 600px at -10% 110%, rgba(201,162,75,0.06), transparent 55%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
    color: var(--ink);
    font-family: 'Tajawal', sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  .wrap{
    max-width: 720px;
    margin: 0 auto;
    padding: 56px 22px 90px;
  }

  .eyebrow{
    text-align:center;
    color: var(--gold);
    font-size: 12px;
    letter-spacing: 0.26em;
    font-weight: 700;
    margin-bottom: 14px;
    opacity: 0.9;
  }
  h1{
    font-family: 'Amiri', serif;
    font-weight: 700;
    text-align: center;
    font-size: clamp(26px, 5.5vw, 38px);
    line-height: 1.3;
    margin: 0 0 10px;
    color: #f5f1e6;
  }
  .byline{
    text-align:center;
    color: var(--ink-faint);
    font-size: 13px;
    letter-spacing: 0.02em;
    margin-bottom: 36px;
  }

  /* ---- progress ---- */
  .progress-row{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom: 10px;
    font-size: 13px;
    color: var(--ink-dim);
  }
  .progress-track{
    height: 3px; width: 100%;
    background: var(--line);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 34px;
  }
  .progress-fill{
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--gold-soft), var(--gold));
    transition: width 0.4s ease;
  }
  .score-chip{
    color: var(--gold);
    font-weight: 700;
  }

  /* ---- question card ---- */
  .card{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 30px 26px;
  }
  .qnum{
    font-family: 'Amiri', serif;
    color: var(--gold);
    font-size: 14px;
    margin-bottom: 10px;
    letter-spacing: 0.02em;
  }
  .qtext{
    font-size: 19px;
    font-weight: 500;
    line-height: 1.7;
    color: var(--ink);
    margin-bottom: 26px;
  }
  .options{
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .opt{
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    border: 1px solid var(--line-soft);
    border-radius: 8px;
    background: var(--surface-2);
    cursor: pointer;
    text-align: right;
    transition: border-color 0.2s ease, background 0.2s ease, transform 0.15s ease;
  }
  .opt:hover{ border-color: var(--gold-soft); }
  .opt .tag{
    flex: 0 0 auto;
    width: 30px; height: 30px;
    border: 1px solid var(--line-soft);
    border-radius: 50%;
    display: flex; align-items:center; justify-content:center;
    font-family: 'Amiri', serif;
    font-size: 14px;
    color: var(--ink-faint);
    transition: all 0.2s ease;
  }
  .opt .txt{
    flex: 1 1 auto;
    font-size: 15.5px;
    line-height: 1.6;
    color: var(--ink);
  }
  .opt.disabled{ cursor: default; }
  .opt.correct{
    border-color: var(--good);
    background: var(--good-bg);
  }
  .opt.correct .tag{ border-color: var(--good); color: var(--good); }
  .opt.wrong{
    border-color: var(--bad);
    background: var(--bad-bg);
  }
  .opt.wrong .tag{ border-color: var(--bad); color: var(--bad); }
  .opt.muted{ opacity: 0.45; }

  .feedback{
    margin-top: 20px;
    font-size: 13.5px;
    min-height: 18px;
    color: var(--ink-dim);
  }
  .feedback.good{ color: var(--good); }
  .feedback.bad{ color: var(--bad); }

  .actions{
    display:flex; justify-content:flex-end;
    margin-top: 26px;
  }
  .btn{
    appearance: none;
    border: 1px solid var(--gold-soft);
    background: transparent;
    color: var(--gold);
    padding: 11px 26px;
    border-radius: 7px;
    font-family: 'Tajawal', sans-serif;
    font-size: 14.5px;
    font-weight: 700;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease, opacity 0.2s ease;
    opacity: 0;
    pointer-events: none;
  }
  .btn.show{ opacity: 1; pointer-events: auto; }
  .btn:hover{ background: var(--gold); color: #0a0f1a; }

  /* ---- results ---- */
  .results{
    display:none;
    text-align:center;
    padding: 50px 26px;
  }
  .results.show{ display:block; }
  .results .big{
    font-family: 'Amiri', serif;
    font-size: 56px;
    color: var(--gold);
    margin-bottom: 6px;
  }
  .results .label{
    color: var(--ink-dim);
    font-size: 15px;
    margin-bottom: 34px;
  }
  .results .msg{
    font-size: 16px;
    color: var(--ink);
    margin-bottom: 34px;
    line-height: 1.8;
  }
  .retry{
    display:inline-block;
    border: 1px solid var(--gold-soft);
    background: transparent;
    color: var(--gold);
    padding: 12px 30px;
    border-radius: 7px;
    font-family: 'Tajawal', sans-serif;
    font-size: 14.5px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .retry:hover{ background: var(--gold); color: #0a0f1a; }

  footer{
    text-align:center;
    margin-top: 60px;
    color: var(--ink-faint);
    font-size: 12px;
    letter-spacing: 0.03em;
  }

  @media (max-width: 520px){
    .wrap{ padding: 40px 16px 70px; }
    .card{ padding: 22px 18px; }
    .qtext{ font-size: 17px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">برنامج القيادة الرقمية — الدبلوم العالي</div>
    <h1>تكامل الأنظمة الحكومية</h1>
    <div class="byline">اختبار تفاعلي — إعداد: أ.م.د. أمير هادي</div>

    <div id="quizArea">
      <div class="progress-row">
        <span id="qCounter">سؤال ١ / 29</span>
        <span class="score-chip" id="scoreChip">النتيجة: 0</span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

      <div class="card">
        <div class="qnum" id="qNum">السؤال ١</div>
        <div class="qtext" id="qText"></div>
        <div class="options" id="optsArea"></div>
        <div class="feedback" id="feedback"></div>
        <div class="actions">
          <button class="btn" id="nextBtn">السؤال التالي ←</button>
        </div>
      </div>
    </div>

    <div class="results" id="resultsArea">
      <div class="big" id="finalScore">0/0</div>
      <div class="label">نتيجتك النهائية</div>
      <div class="msg" id="finalMsg"></div>
      <button class="retry" id="retryBtn">إعادة الاختبار</button>
    </div>

    <footer>
      المعهد العالي لإعداد وتأهيل القادة · إعداد: أ.م.د. أمير هادي
    </footer>
  </div>

<script>
const DATA = [{"q": "تكامل الأنظمة الحكومية كما عُرِّف هو:", "options": ["شراء برمجيات جديدة لكل وزارة على حدة", "عملية ربط وتوحيد قواعد البيانات والأنظمة البرمجية والبنى التحتية الرقمية بين الجهات الحكومية لتبادل المعلومات وتقديم خدمات متكاملة", "تدريب الموظفين على استخدام الحاسوب فقط", "بناء مبنى موحّد لجميع الوزارات"], "correct": "ب"}, {"q": "مفهوم «قابلية التشغيل البيني» (Interoperability) يعني:", "options": ["قدرة النظام على العمل بدون كهرباء", "إمكانية بيع النظام لجهات أخرى", "سرعة معالجة البيانات فقط", "قدرة الأنظمة المختلفة على التواصل والتعامل مع بعضها بفاعلية وكفاءة دون تدخل بشري مستمر"], "correct": "د"}, {"q": "بحسب مسار التحول من الأنظمة المعزولة إلى الحكومة المتكاملة، ماذا يأتي مباشرة بعد «ربط الأنظمة وتوحيد البيانات»؟", "options": ["منصة تكامل (ESB / API Gateway)", "أنظمة معزولة وبيانات مجزأة", "حكومة ذكية وخدمات متميزة", "بيانات موحّدة فقط بلا أي مرحلة لاحقة"], "correct": "أ"}, {"q": "خفض التكاليف التشغيلية عبر التكامل الحكومي يمكن أن يصل إلى:", "options": ["10%", "25%", "60%", "90%"], "correct": "ج"}, {"q": "أي مما يلي **ليس** من فوائد تكامل الأنظمة الحكومية؟", "options": ["تسريع تقديم الخدمات", "زيادة عدد الموظفين المطلوبين لإدخال البيانات يدوياً", "تعزيز الشفافية والرقابة", "دعم اتخاذ القرار"], "correct": "ب"}, {"q": "في البنية المعمارية متعددة الطبقات، يقع «ناقل الخدمات المؤسسية ESB» ضمن:", "options": ["طبقة البنية التحتية (Layer 1)", "طبقة المستفيد والواجهات الأمامية (Layer 6)", "طبقة إدارة البيانات والمعرفة (Layer 2)", "طبقة التكامل والوساطة (Layer 4)"], "correct": "د"}, {"q": "أي طبقة معمارية تحتوي على PKI ومراكز البيانات والشبكات الآمنة؟", "options": ["طبقة الخدمات الرقمية (Layer 5)", "طبقة منطق الأعمال الحكومية (Layer 3)", "طبقة البنية التحتية والأمن السيبراني (Layer 1)", "طبقة المستفيد والواجهات الأمامية (Layer 6)"], "correct": "ج"}, {"q": "«الهوية الرقمية الموحّدة ونظام الدخول الأحادي SSO» يندرج تحت أي نوع من أنواع التكامل الحكومي؟", "options": ["تكامل الهوية (Identity Integration)", "تكامل البيانات (Data Integration)", "تكامل القنوات (Channel Integration)", "تكامل القطاع الخاص (Public-Private Integration)"], "correct": "أ"}, {"q": "النموذج الموصوف بأنه «ربط مباشر بين نظامين» وغير قابل للتوسع ومناسب فقط للمشاريع الصغيرة هو:", "options": ["المعمارية الخدمية (SOA)", "الخدمات المصغّرة (Microservices)", "بوابة API (API Gateway)", "نقطة لنقطة (P2P)"], "correct": "د"}, {"q": "العيب الرئيسي لنموذج ناقل الخدمات (ESB) بحسب جدول المقارنة هو:", "options": ["تعقيد إدارة الإصدارات", "نقطة فشل مركزية واحدة", "صعوبة تتبع الأحداث", "تعقيد البنية التحتية"], "correct": "ب"}, {"q": "الإطار الأوروبي لقابلية التشغيل البيني (EIF) يحدد أربعة مستويات، أي مما يلي **ليس** أحدها؟", "options": ["المستوى القانوني", "المستوى الدلالي", "المستوى المالي", "المستوى التقني"], "correct": "ج"}, {"q": "منصة «تكمّل» للتكامل الحكومي تنتمي إلى:", "options": ["سلطنة عُمان", "المملكة العربية السعودية", "الإمارات العربية المتحدة", "قطر"], "correct": "أ"}, {"q": "أي بروتوكول أمني ضمن المكدّس التقني يُستخدم للمصادقة وإدارة الهوية؟", "options": ["JSON", "OAuth 2.0", "Kubernetes", "Docker"], "correct": "ب"}, {"q": "معيار «FHIR» المذكور ضمن تنسيقات تبادل البيانات يُستخدم تحديداً في مجال:", "options": ["التجارة الإلكترونية", "النقل", "الصحة", "الطاقة"], "correct": "ج"}, {"q": "المعيار الدولي المسؤول عن قياس جودة البيانات المتبادلة بين الأنظمة الحكومية هو:", "options": ["ISO 25012", "ISO 27001", "NIST SP 800", "OpenAPI 3.x"], "correct": "أ"}, {"q": "المرحلة الأولى في دورة حياة مشروع التكامل الحكومي هي:", "options": ["التصميم المعماري", "الرصد والتشخيص", "النشر والتشغيل", "التحسين المستمر"], "correct": "ب"}, {"q": "تحدي «صعوبة ربط الأنظمة التي لا تدعم معايير API الحديثة» يشير إلى تحدي:", "options": ["التعقيد التنظيمي والسياسي", "جودة البيانات وعدم اتساقها", "الأنظمة القديمة (Legacy Systems)", "البنية التحتية غير المتجانسة"], "correct": "ج"}, {"q": "من استراتيجيات التخفيف من مخاطر مشاريع التكامل:", "options": ["إلغاء جميع الأنظمة القديمة فوراً", "تجاهل مقاومة الموظفين للتغيير", "تنفيذ المشروع بالكامل دفعة واحدة دون اختبار", "التنفيذ التدريجي (Phased Imp const LETTERS = ["أ","ب","ج","د"];

let current = 0;
let score = 0;
let answered = false;

const qCounter = document.getElementById('qCounter');
const scoreChip = document.getElementById('scoreChip');
const progressFill = document.getElementById('progressFill');
const qNum = document.getElementById('qNum');
const qText = document.getElementById('qText');
const optsArea = document.getElementById('optsArea');
const feedback = document.getElementById('feedback');
const nextBtn = document.getElementById('nextBtn');
const quizArea = document.getElementById('quizArea');
const resultsArea = document.getElementById('resultsArea');
const finalScore = document.getElementById('finalScore');
const finalMsg = document.getElementById('finalMsg');
const retryBtn = document.getElementById('retryBtn');

const ORDINALS = ["الأول","الثاني","الثالث","الرابع","الخامس","السادس","السابع","الثامن","التاسع","العاشر"];
function ordinalWord(n){
  if(n <= 10) return ORDINALS[n-1];
  return n.toString();
}

function renderQuestion(){
  answered = false;
  feedback.textContent = "";
  feedback.className = "feedback";
  nextBtn.classList.remove("show");

  const item = DATA[current];
  qCounter.textContent = `سؤال ${current+1} / ${DATA.length}`;
  scoreChip.textContent = `النتيجة: ${score}`;
  progressFill.style.width = `${(current/DATA.length)*100}%`;
  qNum.textContent = `السؤال ${ordinalWord(current+1)}`;
  qText.textContent = item.q;

  optsArea.innerHTML = "";
  item.options.forEach((optText, idx) => {
    const letter = LETTERS[idx];
    const row = document.createElement('div');
    row.className = 'opt';
    row.innerHTML = `<div class="tag">${letter}</div><div class="txt">${optText}</div>`;
    row.addEventListener('click', () => selectOption(letter, row));
    optsArea.appendChild(row);
  });
}

function selectOption(letter, row){
  if(answered) return;
  answered = true;
  const item = DATA[current];
  const isCorrect = letter === item.correct;

  Array.from(optsArea.children).forEach((el, idx) => {
    el.classList.add('disabled');
    const elLetter = LETTERS[idx];
    if(elLetter === item.correct){
      el.classList.add('correct');
    } else if(el === row){
      el.classList.add('wrong');
    } else {
      el.classList.add('muted');
    }
  });

  if(isCorrect){
    score++;
    feedback.textContent = "إجابة صحيحة";
    feedback.classList.add('good');
  } else {
    feedback.textContent = `إجابة غير صحيحة — الصحيح هو (${item.correct})`;
    feedback.classList.add('bad');
  }
  scoreChip.textContent = `النتيجة: ${score}`;
  nextBtn.classList.add('show');
}

nextBtn.addEventListener('click', () => {
  current++;
  if(current >= DATA.length){
    showResults();
  } else {
    renderQuestion();
  }
});

function showResults(){
  quizArea.style.display = "none";
  resultsArea.classList.add('show');
  progressFill.style.width = "100%";
  finalScore.textContent = `${score}/${DATA.length}`;
  const pct = Math.round((score/DATA.length)*100);
  let msg = "";
  if(pct >= 85) msg = "أداء ممتاز — إتقان واضح للمادة.";
  else if(pct >= 70) msg = "أداء جيد جداً — بقيت نقاط بسيطة تحتاج مراجعة.";
  else if(pct >= 50) msg = "أداء مقبول — يُنصح بمراجعة المحتوى مرة أخرى.";
  else msg = "يُنصح بإعادة قراءة المادة ثم إعادة المحاولة.";
  finalMsg.textContent = `${pct}% من الإجابات صحيحة. ${msg}`;
}

retryBtn.addEventListener('click', () => {
  current = 0; score = 0;
  quizArea.style.display = "";
  resultsArea.classList.remove('show');
  renderQuestion();
});

renderQuestion();
</script>
