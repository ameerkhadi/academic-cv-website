      max-width: 900px;
      margin: 30px auto;
      padding: 0 16px 60px;

      background: var(--primary);
      color: white;

      font-weight: bold;
      color: var(--accent);

      font-size: 1.1rem;
      font-weight: bold;
      margin: 30px 0 14px;
      padding: 8px 16px;
      border-radius: 6px;
      color: white;

    .label-medium { background: var(--medium); }
    .label-hard   { background: var(--hard); }

      background: var(--card);
      border-radius: var(--radius);

      margin-bottom: 18px;

      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;

      border-radius: 20px;
      color: white;

    .badge-medium { background: var(--medium); }

      font-weight: 600;
      margin-bottom: 16px;
      line-height: 1.5;
    }

      background: white;
      text-align: left;
      cursor: pointer;
      font-size: 0.92rem;

    }

      background: #eafaf1;
      border-color: var(--easy);
      color: #1a7a40;
      font-weight: bold;
    }

    .option-btn.wrong {

      border-color: var(--hard);
      color: #922b21;
    }

      margin-top: 14px;
      padding: 12px 16px;
      background: #f0f7ff;
      border-left: 4px solid var(--medium);
      border-radius: 6px;
      font-size: 0.88rem;
      line-height: 1.55;

      display: flex;
      justify-content: flex-end;
      margin-top: 14px;
    }

    .reset-btn {
      background: none;
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 6px 14px;
      cursor: pointer;
      font-size: 0.8rem;
      color: #666;
      transition: all 0.2s;
    }

    .reset-btn:hover { background: #eee; }

    .submit-all-wrap {
      text-align: center;
      margin-top: 30px;
    }

    #submitAll {
      background: var(--accent);
      color: var(--primary);
      border: none;
      padding: 14px 40px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 30px;

    #finalResult {

      margin-top: 28px;
      background: var(--primary);
      color: white;
      border-radius: var(--radius);

      text-align: center;

    .progress-bar-wrap {
      background: #ddd;
      border-radius: 10px;
      height: 10px;
      margin: 16px 0 6px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 10px;
      transition: width 0.4s;
    }

    footer {
      text-align: center;
      padding: 20px;
      font-size: 0.8rem;
      color: #aaa;
    }
  </style>
</head>

// ─── State ───────────────────────────────────────────────
let answered = 0, correct = 0, wrong = 0;
let currentFilter = 'all';

// ─── Build Quiz ───────────────────────────────────────────
function buildQuiz() {
  const container = document.getElementById('quizBody');
  container.innerHTML = '';

  const groups = { easy: [], medium: [], hard: [] };
  questions.forEach(q => groups[q.difficulty].push(q));

  const labels = {
    easy:   { text:'🟢 Easy Questions (1–34)',   cls:'label-easy' },
    medium: { text:'🔵 Medium Questions (35–67)', cls:'label-medium' },
    hard:   { text:'🔴 Hard Questions (68–100)',  cls:'label-hard' }
  };

  ['easy','medium','hard'].forEach(diff => {
    const lbl = document.createElement('div');
    lbl.className = `section-label ${labels[diff].cls} filter-section filter-${diff}`;
    lbl.textContent = labels[diff].text;
    lbl.id = `lbl-${diff}`;
    container.appendChild(lbl);

    groups[diff].forEach(q => {
      const card = document.createElement('div');
      card.className = `question-card ${diff} filter-section filter-${diff}`;
      card.id = `card-${q.id}`;

      card.innerHTML = `
        <div class="question-header">
          <span class="q-number">Q${q.id}</span>
          <span class="difficulty-badge badge-${diff}">${diff.toUpperCase()}</span>
        </div>
        <div class="question-text">${q.q}</div>
        <div class="options" id="opts-${q.id}">
          ${q.opts.map((o,i) => `<button class="option-btn" onclick="selectAnswer(${q.id},${i})">${o}</button>`).join('')}
        </div>
        <div class="explanation" id="exp-${q.id}">💡 <strong>Explanation:</strong> ${q.exp}</div>
        <div class="action-row">
          <button class="reset-btn" onclick="resetQuestion(${q.id})">↺ Reset</button>
        </div>`;

      container.appendChild(card);
    });
  });
}

function selectAnswer(qId, chosen) {
  const q = questions.find(x => x.id === qId);
  const opts = document.querySelectorAll(`#opts-${qId} .option-btn`);
  const exp = document.getElementById(`exp-${qId}`);

  // Already answered?
  if ([...opts].some(b => b.classList.contains('correct') || b.classList.contains('wrong'))) return;

  opts.forEach((btn, i) => {
    btn.disabled = true;
    if (i === q.ans) btn.classList.add('correct');
    else if (i === chosen) btn.classList.add('wrong');
  });

  exp.classList.add('show');
  answered++;
  if (chosen === q.ans) correct++; else wrong++;
  updateScore();
}

function resetQuestion(qId) {
  const q = questions.find(x => x.id === qId);
  const opts = document.querySelectorAll(`#opts-${qId} .option-btn`);
  const exp = document.getElementById(`exp-${qId}`);
  const wasAnswered = [...opts].some(b => b.classList.contains('correct') || b.classList.contains('wrong'));
  if (!wasAnswered) return;

  const wasCorrect = opts[q.ans].classList.contains('correct') &&
    [...opts].filter(b => b.classList.contains('wrong')).length === 0;
  const wasWrong = [...opts].some(b => b.classList.contains('wrong'));

  opts.forEach(btn => {
    btn.disabled = false;
    btn.classList.remove('correct','wrong');
    btn.onclick = function(){};
  });
  opts.forEach((btn, i) => { btn.onclick = () => selectAnswer(qId, i); });
  exp.classList.remove('show');

  answered--;
  if (wasCorrect) correct--;
  if (wasWrong) wrong--;
  updateScore();
}

function updateScore() {
  document.getElementById('sc-answered').textContent = answered;
  document.getElementById('sc-correct').textContent = correct;
  document.getElementById('sc-wrong').textContent = wrong;
  const pct = answered > 0 ? Math.round((correct / answered) * 100) : 0;
  document.getElementById('sc-pct').textContent = pct + '%';
  document.getElementById('progressBar').style.width = (answered / 100 * 100) + '%';
  document.getElementById('progressText').textContent = `${answered} of 100 answered`;
}

function filterQuestions(filter) {
  currentFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');

  document.querySelectorAll('.filter-section').forEach(el => {
    if (filter === 'all' || el.classList.contains(`filter-${filter}`)) {
      el.classList.remove('hidden');
    } else {
      el.classList.add('hidden');
    }
  });
}

function showFinal() {
  const pct = answered > 0 ? Math.round((correct / 100) * 100) : 0;
  let grade, msg;
  if (pct >= 90)      { grade = `🏆 Excellent! ${correct}/100`; msg = "Outstanding! You have a strong command of AWS Cloud concepts."; }
  else if (pct >= 75) { grade = `✅ Good Job! ${correct}/100`; msg = "Great work! Review the questions you missed to solidify your knowledge."; }
  else if (pct >= 60) { grade = `📘 Passing — ${correct}/100`; msg = "You passed! Focus on the hard questions and explanations for improvement."; }
  else               { grade = `📖 Keep Studying — ${correct}/100`; msg = "Review the lecture materials and retry. You can do it!"; }

  document.getElementById('finalGrade').textContent = grade;
  document.getElementById('finalMsg').textContent = msg;
  document.getElementById('finalResult').style.display = 'block';
  document.getElementById('finalResult').scrollIntoView({ behavior: 'smooth' });
}

function resetAll() {
  answered = 0; correct = 0; wrong = 0;
  updateScore();
  buildQuiz();
  document.getElementById('finalResult').style.display = 'none';
  filterQuestions.call({ target: document.querySelector('.filter-btn') }, currentFilter);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ─── Init ─────────────────────────────────────────────────
buildQuiz();
</script>
