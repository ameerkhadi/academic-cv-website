  if(!s){err.textContent='الرمز غير صحيح — تحقق من رمزك في صفحة الشعب';return;}
  err.textContent='';
  const color=CLS_COLOR[s.cls]||'#607d8b';
  const initials=s.name.split(' ').slice(0,2).map(w=>w[0]).join('');
  document.getElementById('studentCard').innerHTML=`
    <div class="card-header" style="background:${color}18;border-bottom:2px solid ${color};">
      <div class="card-avatar" style="background:${color};">${initials}</div>
      <div class="card-title"><h2>${s.name}</h2><span class="code">${s.code} — ${s.cls}</span></div>
    </div>
    <div class="card-body">
      <div class="info-row"><span class="info-label">رمز الطالب</span><span class="info-value" style="font-family:monospace;color:${color};">${s.code}</span></div>
      <div class="info-row"><span class="info-label">الشعبة</span><span class="info-value">${s.cls}</span></div>
      <div class="info-row"><span class="info-label">النوع</span><span class="info-value">${s.cls.startsWith('صباح')?'صباحي':'مسائي'}</span></div>
    </div>
    <div class="grade-big ${gradeColor(s.grade)}">${gradeText(s.grade)}</div>`;
  document.getElementById('loginWrap').style.display='none';
  document.getElementById('mainWrap').style.display='block';
  document.body.style.alignItems='flex-start';
  document.body.style.paddingTop='40px';
}
function doLogout(){
  document.getElementById('loginWrap').style.display='block';
  document.getElementById('mainWrap').style.display='none';
  document.getElementById('codeInput').value='';
  document.getElementById('loginErr').textContent='';
  document.body.style.alignItems='center';
  document.body.style.paddingTop='20px';
}
document.getElementById('codeInput').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
</script>
</body>
</html>
