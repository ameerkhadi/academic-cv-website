# وسيطٌ أماميٌّ يُنهي TLS ويمرّر الطلبَ إلى الخادم المحلّيّ.
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name tickets.example.iq;          # يُستبدَل بالنطاق الفعليّ

    ssl_certificate     /etc/letsencrypt/live/tickets.example.iq/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tickets.example.iq/privkey.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://127.0.0.1:8000/static/;
        expires 7d;
    }
}
