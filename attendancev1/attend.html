<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />

<meta http-equiv="Cache-Control" content="no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<title>تسجيل الحضور — المعهد العالي لإعداد وتأهيل القادة</title>
<style>
  :root{--bg1:#07111f;--bg2:#0f172a;--panel:rgba(255,255,255,.07);--line:rgba(255,255,255,.10);
        --text:#f8fafc;--muted:#a5b4c7;--green:#22c55e;--red:#ef4444}
  *{box-sizing:border-box}
  body{margin:0;font-family:Tahoma,Arial,sans-serif;color:var(--text);min-height:100vh;
    display:flex;align-items:center;justify-content:center;padding:16px;
    background:radial-gradient(circle at top,rgba(59,130,246,.20),transparent 30%),
               linear-gradient(135deg,var(--bg1),var(--bg2) 55%,#09101d)}
  .card{width:100%;max-width:460px;background:var(--panel);border:1px solid var(--line);
    border-radius:26px;padding:26px 22px;box-shadow:0 24px 60px rgba(0,0,0,.42);backdrop-filter:blur(14px)}
  .org{margin:0 0 10px;text-align:center;font-size:13px;font-weight:900;color:#93c5fd;
    letter-spacing:.2px;line-height:1.7}
  h1{margin:0 0 6px;font-size:23px;text-align:center}
  .sub{color:var(--muted);font-size:14px;text-align:center;margin:0 0 18px;line-height:1.8}
  .subject{background:rgba(59,130,246,.14);border:1px solid rgba(59,130,246,.32);color:#bfdbfe;
    border-radius:14px;padding:12px;text-align:center;font-weight:900;font-size:16px;margin-bottom:16px}
  label{display:block;font-size:14px;font-weight:800;margin-bottom:7px}
  input,select{width:100%;font-family:inherit;font-size:16px;border-radius:14px;padding:14px;
    background:#0a1323;color:#fff;border:1px solid rgba(255,255,255,.12);outline:none;margin-bottom:14px}
  button{width:100%;font-family:inherit;font-size:17px;border:none;border-radius:16px;color:#fff;
    padding:16px;cursor:pointer;font-weight:900;background:linear-gradient(180deg,#22c55e,#16a34a)}
  button:disabled{opacity:.55;cursor:not-allowed}
  .box{border-radius:16px;padding:16px;font-weight:800;line-height:1.9;text-align:center;font-size:15px}
  .ok{background:rgba(34,197,94,.16);border:1px solid rgba(34,197,94,.38);color:#bbf7d0}
  .err{background:rgba(239,68,68,.16);border:1px solid rgba(239,68,68,.38);color:#fecaca}
  .load{background:rgba(59,130,246,.14);border:1px solid rgba(59,130,246,.32);color:#bfdbfe}
  .tick{font-size:52px;line-height:1;margin-bottom:8px}
  .hide{display:none}
  .foot{margin-top:18px;text-align:center;color:var(--muted);font-size:12px;line-height:1.9;
    border-top:1px solid var(--line);padding-top:12px}
  .foot b{color:#cbd5e1}
</style>
</head>
<body>
<div class="card">
  <p class="org">المعهد العالي لإعداد وتأهيل القادة</p>
  <h1>تسجيل الحضور</h1>
  <p class="sub">برنامج إعداد قادة المستقبل</p>

  <div id="state" class="box load">جارٍ التحقّق من الرمز…</div>

  <div id="form" class="hide">
    <div class="subject" id="subjName">—</div>
    <label for="student">اختر اسمك من القائمة</label>
    <select id="student"><option value="">— اختر اسمك —</option></select>
    <button id="btn" onclick="submitAttendance()">تأكيد الحضور</button>
  </div>

  <div class="foot">
    المعهد العالي لإعداد وتأهيل القادة<br>
    تطوير <b>د. أمير هادي</b>
  </div>
</div>

<script>
/* ══ ضع هنا رابط تطبيق Apps Script بعد النشر ══ */
const API = 'https://script.google.com/macros/s/AKfycbwx1Ul3AWlToOA7ZNkXJeV5hXINmG2TutiyjLzWSQGNvV8cEk5US0Z3KZsncqypLpeW/exec';

/* قائمة الطلبة مضمّنة — تظهر فوراً بلا انتظار الخادم */
const STUDENTS = [{"id":1,"name":"احمد إسماعيل علوان"},{"id":2,"name":"احمد رزاق مايح"},{"id":3,"name":"احمد صبيح مجيد"},{"id":4,"name":"احمد عبد حسن رهيف"},{"id":5,"name":"احمد عبد علي عباس"},{"id":6,"name":"احمد مهدي حاشوش"},{"id":7,"name":"احمد نزار حسين"},{"id":8,"name":"اسعد فليح قاسم"},{"id":9,"name":"اسلام حمزة علي"},{"id":10,"name":"الهام سامي علي"},{"id":11,"name":"اياد طارق جواد"},{"id":12,"name":"ايمان زغير رحيم"},{"id":13,"name":"ايمان ضيدان عزيز"},{"id":14,"name":"ايناس عبد الكاظم محمد"},{"id":15,"name":"إبراهيم نبيل عبدالكريم"},{"id":16,"name":"إيهاب ظاهر حبيب"},{"id":17,"name":"آفاق حميد حسن"},{"id":18,"name":"باسم جلوب ازغير"},{"id":19,"name":"باسم محمد هاشم"},{"id":20,"name":"بسام خليل إبراهيم"},{"id":21,"name":"بشرى شريف غضبان"},{"id":22,"name":"بيداء كاظم مطر"},{"id":23,"name":"ثائر حسين محمد"},{"id":24,"name":"جميل عودة إبراهيم"},{"id":25,"name":"جهاد منصور ناصح"},{"id":26,"name":"حاتم عبد الكريم محمد"},{"id":27,"name":"حسن جبار جاسم"},{"id":28,"name":"حسن كريم ازميط"},{"id":29,"name":"حسن هادي حسن"},{"id":30,"name":"حسين فاضل عباس"},{"id":31,"name":"حقي إسماعيل محمد"},{"id":32,"name":"حميد راضي محمد"},{"id":33,"name":"حيدر جبار عبدالله"},{"id":34,"name":"حيدر حسين مطلك"},{"id":35,"name":"حيدر طارق حميد"},{"id":36,"name":"حيدر عبد الكريم شويع"},{"id":37,"name":"حيدر محمود مردان"},{"id":38,"name":"حيدر موسى احمد"},{"id":39,"name":"حيدر وثيج عجيل"},{"id":40,"name":"خدر حسن ممند"},{"id":41,"name":"خلدون إبراهيم عباس"},{"id":42,"name":"خميس نصيف جاسم"},{"id":43,"name":"داود سلمان داود"},{"id":44,"name":"دنيا عبدالرضا هادي"},{"id":45,"name":"رافد خيون دبيسان"},{"id":46,"name":"رافد كاظم فياض"},{"id":47,"name":"رائد عبد الحسن ضحك"},{"id":48,"name":"رجاء سعيد فرج"},{"id":49,"name":"رسل مظفر ناصر"},{"id":50,"name":"رشا عبد محمد كفطان"},{"id":51,"name":"رضوان يونس إسماعيل"},{"id":52,"name":"رعد سعد الله علي"},{"id":53,"name":"رند صباح حسين"},{"id":54,"name":"زياد طارق حسين"},{"id":55,"name":"زينب حسن خيون"},{"id":56,"name":"زينب رائد عبد حمودي"},{"id":57,"name":"زينب عكلة عبد"},{"id":58,"name":"سعد صاحب عبد"},{"id":59,"name":"سلام حنون مناتي"},{"id":60,"name":"سلوان كامل علوان"},{"id":61,"name":"سليم جلوب بجاي فرج"},{"id":62,"name":"سندس علي خليفة"},{"id":63,"name":"سهد حسن امين"},{"id":64,"name":"سوسن جبار إبراهيم"},{"id":65,"name":"سيف محمد جاسم"},{"id":66,"name":"شهلاء حسين سلمان"},{"id":67,"name":"صادق فاضل علي"},{"id":68,"name":"ضرغام هادي كيكو"},{"id":69,"name":"ضمياء سلمان داود"},{"id":70,"name":"طارق عزيز حسين"},{"id":71,"name":"عادل محمد علاوي"},{"id":72,"name":"عامر جميل حمود"},{"id":73,"name":"عامر حسين علي"},{"id":74,"name":"عامر محمود عكيل"},{"id":75,"name":"عباس محمد علي"},{"id":76,"name":"عبد الجبار حنون جبرة الله"},{"id":77,"name":"عبد الستار جبار  زيارة"},{"id":78,"name":"عصام جبر جاسم حسن"},{"id":79,"name":"عقيل حسن عبد الكاظم"},{"id":80,"name":"علاء سامي محمد"},{"id":81,"name":"علاء فيصل زعيان"},{"id":82,"name":"علاء كاظم صالح"},{"id":83,"name":"علي رسول حسين"},{"id":84,"name":"علي عادل محمد"},{"id":85,"name":"علي عماد لطوفي"},{"id":86,"name":"علي غانم حسين"},{"id":87,"name":"علي فاروق فؤاد"},{"id":88,"name":"علي كريم مجيد"},{"id":89,"name":"علي ناظم كاطع"},{"id":90,"name":"علي نجم عبد حسين"},{"id":91,"name":"عماد عباس بنيان"},{"id":92,"name":"عمار عبد الحسين جاسم"},{"id":93,"name":"عمر عبد الكريم حميد"},{"id":94,"name":"غزوان جبار عودة"},{"id":95,"name":"غزوان عبد الأمير  كاظم"},{"id":96,"name":"غسان سليم علي"},{"id":97,"name":"فاروق غازي عبدالله"},{"id":98,"name":"فاضل عبد الزهرة ناجي"},{"id":99,"name":"فائق حميد حزام"},{"id":100,"name":"فتيان حسين علي"},{"id":101,"name":"فرح قاسم محمد"},{"id":102,"name":"فريد كاظم سدرة"},{"id":103,"name":"قاسم محمد علي"},{"id":104,"name":"كرار محمد عبد الزهرة"},{"id":105,"name":"ماهر حمدي رشيد"},{"id":106,"name":"محمد جمال جاسم"},{"id":107,"name":"محمد حسن علوان"},{"id":108,"name":"محمد حمدي كريم"},{"id":109,"name":"محمد خالد شهاب"},{"id":110,"name":"محمد شوكت جاسم"},{"id":111,"name":"محمد عبد السلام عبد العزيز"},{"id":112,"name":"محمد عبد الصاحب حسن"},{"id":113,"name":"محمد عبد الله محمود"},{"id":114,"name":"محمد كامل دنبوس"},{"id":115,"name":"مصطفى سعد خزعل"},{"id":116,"name":"مصطفى فاروق خلف"},{"id":117,"name":"مهند عبد الواحد نايف"},{"id":118,"name":"ميثم حسين امين"},{"id":119,"name":"ميعاد هاتو هاشم"},{"id":120,"name":"نصير ماجد جابر"},{"id":121,"name":"نغم داود سلمان"},{"id":122,"name":"هيثم محسن حسين"},{"id":123,"name":"واثق قحطان وثيج"},{"id":124,"name":"وجدان قحطان فرحان"}];

let jsonpId = 0;

/* استدعاء واحد بمهلة — يُستعمل داخل call() مع إعادة المحاولة */
function callOnce(params, timeoutMs){
  return new Promise((resolve, reject) => {
    const cb = 'cb_' + (++jsonpId) + '_' + Date.now();
    const s  = document.createElement('script');
    const t  = setTimeout(() => { cleanup(); reject(new Error('TIMEOUT')); }, timeoutMs);
    function cleanup(){ clearTimeout(t); delete window[cb]; if (s.parentNode) s.parentNode.removeChild(s); }
    window[cb] = data => { cleanup(); resolve(data); };
    s.onerror = () => { cleanup(); reject(new Error('NETWORK')); };
    const q = Object.keys(params).map(k => k + '=' + encodeURIComponent(params[k])).join('&');
    // _ لكسر أي تخزين مؤقت وسيط
    s.src = API + '?' + q + '&callback=' + cb + '&_=' + Date.now();
    document.body.appendChild(s);
  });
}

/* محاولتان قبل الاستسلام — الشبكات المتقطّعة تنجح غالباً في الثانية */
async function call(params){
  let lastErr = null;
  for (let attempt = 1; attempt <= 2; attempt++){
    try {
      return await callOnce(params, attempt === 1 ? 15000 : 30000);
    } catch (e) {
      lastErr = e;
      if (attempt === 1) await new Promise(r => setTimeout(r, 800));
    }
  }
  if (lastErr && lastErr.message === 'TIMEOUT'){
    throw new Error('لا يصل رد من الخادم. الأسباب المحتملة: (١) الصفحة قديمة في ذاكرة المتصفح — اضغط Ctrl+Shift+R، (٢) رابط النشر تغيّر ولم يُحدَّث في الملف، (٣) الإنترنت بطيء جداً.');
  }
  throw new Error('تعذّر الاتصال بالخادم — تحقّق من الإنترنت.');
}

function esc(v){ return String(v ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function show(kind, html){
  const el = document.getElementById('state');
  el.className = 'box ' + kind;
  el.innerHTML = html;
  el.classList.remove('hide');
}

/* معرّف ثابت للجهاز — يمنع تسجيل عدة أسماء من هاتف واحد */
function deviceId(){
  let d = null;
  try { d = localStorage.getItem('qm_dev'); } catch(e){}
  if (!d){
    d = 'd' + Math.random().toString(36).slice(2) + Date.now().toString(36);
    try { localStorage.setItem('qm_dev', d); } catch(e){}
  }
  return d;
}

const token = new URLSearchParams(location.search).get('t') || '';

(async function init(){
  if (!token){
    return show('err', 'لا يوجد رمز في الرابط.<br>امسح رمز QR من الشاشة مباشرةً.');
  }
  try{
    // القائمة تظهر فوراً من الملف — بلا أي انتظار للخادم
    document.getElementById('student').innerHTML =
      '<option value="">— اختر اسمك —</option>' +
      STUDENTS.map(s => `<option value="${s.id}">${s.id} — ${esc(s.name)}</option>`).join('');
    document.getElementById('state').classList.add('hide');
    document.getElementById('form').classList.remove('hide');

    // التحقّق من الرمز يجري في الخلفية ولا يعطّل الطالب
    call({ action:'check', t: token }).then(chk => {
      if (chk.ok){
        document.getElementById('subjName').textContent = chk.subject;
      } else {
        document.getElementById('form').classList.add('hide');
        show('err', esc(chk.error));
      }
    }).catch(() => {
      document.getElementById('subjName').textContent = 'جارٍ التحقّق…';
    });
  }catch(e){
    show('err', esc(e.message));
  }
})();

async function submitAttendance(){
  const sel = document.getElementById('student');
  if (!sel.value) return alert('اختر اسمك أولاً');

  const btn = document.getElementById('btn');
  btn.disabled = true;
  btn.textContent = 'جارٍ التسجيل…';

  try{
    const r = await call({ action:'mark', t: token, id: sel.value, dev: deviceId() });
    document.getElementById('form').classList.add('hide');

    if (r.ok){
      show('ok', '<div class="tick">✓</div>' +
        (r.already ? 'حضورك مسجَّل مسبقاً' : 'تم تسجيل حضورك') +
        '<br><b>' + esc(r.name) + '</b><br>' + esc(r.subject) +
        (r.time ? '<br>' + esc(r.time) : ''));
    } else {
      show('err', esc(r.error) + '<br><br>أعد مسح الرمز من الشاشة.');
    }
  }catch(e){
    btn.disabled = false;
    btn.textContent = 'تأكيد الحضور';
    show('err', esc(e.message));
  }
}
</script>
