function pad(n){ return String(n).padStart(2,'0'); }
function fmt(pre,n){ return pre+'-'+pad(n); }

const wrap = document.getElementById('sectionsWrap');
Object.keys(STUDENTS).forEach(cls => {
  const pre = PREFIX[cls];
  const color = CLS_COLOR[cls];
  const list = STUDENTS[cls];
  const block = document.createElement('div');
  block.className = 'section-block';
  let rows = list.map(([id,name]) =>
    `<tr><td><span class="code-badge" style="background:${color}">${fmt(pre,id)}</span></td><td>${name}</td></tr>`
  ).join('');
  block.innerHTML = `
    <div class="section-header" style="background:${color}">
      <span>${cls}</span>
      <span class="section-count">${list.length} طالب</span>
    </div>
    <table>
      <thead><tr><th>الرمز</th><th>اسم الطالب</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
  wrap.appendChild(block);
});
