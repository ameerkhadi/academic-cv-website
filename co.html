function fmt(pre,n){return pre+'-'+String(n).padStart(2,'0');}
const wrap=document.getElementById('sectionsWrap');
Object.keys(STUDENTS).forEach(cls=>{
  const color=CLS_COLOR[cls]||'#607d8b';
  const pre=PREFIX[cls];
  const type=cls.startsWith('صباح')?'صباحي':'مسائي';
  const block=document.createElement('div');
  block.className='section-block';
  block.innerHTML=`<div class="section-header" style="background:${color}22;border-bottom:2px solid ${color};">
    <span style="color:${color};font-size:1.2rem;">◈</span>
    <span>شعبة ${cls}</span>
    <span class="section-type" style="background:${color}33;color:${color};">${type}</span>
    <span style="margin-right:auto;color:#8b949e;font-size:0.82rem;">${STUDENTS[cls].length} طالب</span>
  </div>
  <table class="students-table">
    <thead><tr><th>رمز الطالب</th><th>الاسم الكامل</th></tr></thead>
    <tbody>${STUDENTS[cls].map(([id,name])=>`<tr><td><span class="code-badge" style="background:${color};">${fmt(pre,id)}</span></td><td>${name}</td></tr>`).join('')}</tbody>
  </table>`;
  wrap.appendChild(block);
});
