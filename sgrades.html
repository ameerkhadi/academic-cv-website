<meta charset="UTF-8">

<title>درجات الطلاب - الحوسبة السحابية</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0f1117; color: #e0e0e0; font-family: 'Segoe UI', Tahoma, sans-serif;
         min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .login-wrap { background: #1a1d2e; border-radius: 12px; padding: 40px 32px;
                width: 100%; max-width: 400px; text-align: center; border: 1px solid #2a2d3e; }
  .login-wrap h1 { font-size: 1.4rem; margin-bottom: 6px; color: #fff; }
  .login-wrap p { color: #aaa; font-size: 0.9rem; margin-bottom: 24px; }
  .login-wrap input {
    width: 100%; padding: 12px 16px; border-radius: 8px; border: 1px solid #3a3d4e;
    background: #0f1117; color: #fff; font-size: 1.1rem; text-align: center;
    letter-spacing: 3px; margin-bottom: 14px; outline: none; font-family: monospace;
  }
  .login-wrap input:focus { border-color: #3498db; }
  .login-wrap button {
    width: 100%; padding: 12px; border-radius: 8px; border: none;
    background: #2980b9; color: #fff; font-size: 1rem; cursor: pointer; font-weight: bold;
  }
  .login-wrap button:hover { background: #3498db; }
  .error { color: #e74c3c; font-size: 0.9rem; margin-top: 10px; min-height: 20px; }
  .back-link { display: block; margin-top: 16px; color: #3498db; text-decoration: none; font-size: 0.85rem; }

  .main-wrap { display: none; width: 100%; max-width: 420px; }
  .card { background: #1a1d2e; border-radius: 12px; padding: 28px 24px;
          border: 1px solid #2a2d3e; text-align: center; }
  .card-header { padding: 14px; border-radius: 8px; margin-bottom: 20px; }
  .card-header .code { font-size: 1.8rem; font-weight: bold; letter-spacing: 4px;
                       font-family: monospace; color: #fff; }
  .card-header .cls { font-size: 0.9rem; opacity: 0.85; margin-top: 4px; color: #fff; }
  .student-name { font-size: 1.1rem; font-weight: bold; margin-bottom: 6px; color: #fff; }
  .student-type { font-size: 0.85rem; color: #aaa; margin-bottom: 24px; }
  .grade-box { padding: 20px; border-radius: 10px; margin-bottom: 20px; }
  .grade-label { font-size: 0.85rem; margin-bottom: 8px; color: rgba(255,255,255,0.8); }
  .grade-num { font-size: 3rem; font-weight: bold; color: #fff; line-height: 1; }
  .grade-out { font-size: 1rem; color: rgba(255,255,255,0.7); margin-top: 4px; }
  .g-none  { background: #555; }
  .g-low   { background: #c0392b; }
  .g-mid   { background: #d35400; }
  .g-good  { background: #27ae60; }
  .g-full  { background: #1a8f4e; }
  .g-unchecked { background: #555; }
  .logout-btn {
    width: 100%; padding: 10px; border-radius: 8px; border: none;
    background: #2a2d3e; color: #aaa; font-size: 0.9rem; cursor: pointer; margin-top: 4px;
  }
  .logout-btn:hover { background: #3a3d4e; color: #fff; }
  .back-link2 { display: block; margin-top: 12px; color: #3498db; text-decoration: none; font-size: 0.85rem; text-align: center; }
</style>
</head>
<body>

<div class="login-wrap" id="loginWrap">
  <h1>درجات الطلاب</h1>
  <p>مادة الحوسبة السحابية</p>
  <input type="text" id="codeInput" maxlength="4" placeholder="ادخل رمز الطالب" autocomplete="off" />
  <button onclick="doLogin()">دخول</button>
  <div class="error" id="errMsg"></div>

</div>

<div class="main-wrap" id="mainWrap">
  <div class="card">
    <div class="card-header" id="cardHeader">
      <div class="code" id="cardCode"></div>
      <div class="cls" id="cardCls"></div>
    </div>
    <div class="student-name" id="cardName"></div>
    <div class="student-type" id="cardType"></div>
    <div class="grade-box" id="gradeBox">

      <div class="grade-out" id="gradeOut"></div>

function pad(n){ return String(n).padStart(2,'0'); }
function fmt(pre,n){ return pre+'-'+pad(n); }

const CODE_MAP = {};
Object.keys(STUDENTS).forEach(cls => {
  const pre = PREFIX[cls];
  STUDENTS[cls].forEach(([id, name]) => {
    const code = fmt(pre, id);
    const grade = GRADES[cls] ? GRADES[cls][id] : undefined;
    CODE_MAP[code.toUpperCase()] = { code, cls, id, name, grade };
  });
});

function gradeClass(g) {
  if (g === undefined || g === null) return 'g-unchecked';
  if (g === 0) return 'g-none';
  if (g <= 3) return 'g-low';
  if (g <= 6) return 'g-mid';
  if (g <= 9) return 'g-good';
  return 'g-full';
}

function doLogin() {
  const raw = document.getElementById('codeInput').value.trim().toUpperCase();
  const err = document.getElementById('errMsg');
  if (!raw) { err.textContent = 'الرجاء ادخال الرمز'; return; }
  const st = CODE_MAP[raw];
  if (!st) { err.textContent = 'الرمز غير صحيح، تحقق من الرمز وحاول مجدداً'; return; }
  err.textContent = '';
  const color = CLS_COLOR[st.cls];
  document.getElementById('cardHeader').style.background = color;
  document.getElementById('cardCode').textContent = st.code;
  document.getElementById('cardCls').textContent = st.cls;
  document.getElementById('cardName').textContent = st.name;
  document.getElementById('cardType').textContent = st.cls.startsWith('صباحي') ? 'دراسة صباحية' : 'دراسة مسائية';
  const gc = gradeClass(st.grade);
  const gb = document.getElementById('gradeBox');
  gb.className = 'grade-box ' + gc;
  document.getElementById('gradeNum').textContent = st.grade !== undefined ? st.grade : '—';
  document.getElementById('gradeOut').textContent = st.grade !== undefined ? 'من 10' : 'لم يصحح بعد';
  document.getElementById('loginWrap').style.display = 'none';
  document.getElementById('mainWrap').style.display = 'block';
}

function doLogout() {
  document.getElementById('codeInput').value = '';
  document.getElementById('errMsg').textContent = '';
  document.getElementById('loginWrap').style.display = 'block';
  document.getElementById('mainWrap').style.display = 'none';
}

document.getElementById('codeInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});
