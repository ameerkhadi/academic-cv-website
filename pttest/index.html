<style>
:root{
  /* Blue and gray palette */
  --ink:#263445; --paper:#eef2f6; --surface:#fff;
  --accent:#2563a8; --accent-dark:#1d4f86; --accent-soft:#e7eff8;
  --accent-2:#2f6fb2; --accent-2-soft:#e7eff8;
  --seal:#3d78b3; --seal-soft:#e7eff8; --seal-line:#b8cde3;
  --line:#cbd5e1; --muted:#64748b; --track:#e2e8f0;
  --ok:#2563a8; --ok-soft:#e7eff8;
  --warn:#526a82; --warn-soft:#e9eef4;
  --danger:#4b647d; --danger-soft:#e8edf3; --danger-line:#b9c8d6;
  --r:8px;
  --grad:linear-gradient(115deg,#172b42 0%,#25527d 52%,#3d6f9f 100%);
  --shadow:0 1px 2px rgba(22,30,45,.08), 0 3px 10px rgba(22,30,45,.08);
  --shadow-lg:0 2px 6px rgba(22,30,45,.12), 0 12px 28px rgba(22,30,45,.16);
}
html[data-theme="dark"]{
  --ink:#e5edf6; --paper:#111a26; --surface:#1c2735;
  --accent:#5fa8ff; --accent-dark:#82bcff; --accent-soft:#1f3852;
  --accent-2:#4e8fd0; --accent-2-soft:#263f59;
  --seal:#6ea7dc; --seal-soft:#263f59; --seal-line:#496b8d;
  --line:#35465a; --muted:#a5b4c5; --track:#2a394b;
  --ok:#6aa8df; --ok-soft:#203a55;
  --warn:#9aafc4; --warn-soft:#2b3b4d;
  --danger:#a9bbcd; --danger-soft:#2b3b4d; --danger-line:#526a82;
  --grad:linear-gradient(115deg,#122238 0%,#1e3b5a 52%,#31587c 100%);
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 4px 16px rgba(0,0,0,.28);
  --shadow-lg:0 2px 6px rgba(0,0,0,.4), 0 14px 34px rgba(0,0,0,.34);
}
html{transition:background .2s ease}
body,.card,.btn,input,textarea,select{transition:background-color .2s ease,border-color .2s ease,color .2s ease}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);
  font-family:'IBM Plex Sans Arabic',system-ui,'Segoe UI',sans-serif;
  font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%}
h1,h2,h3{margin:0;font-weight:600;line-height:1.35}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:16px}
a{color:var(--accent)}
.wrap{max-width:940px;margin:0 auto;padding:0 16px 64px}

.top{background:var(--grad);color:#fff;padding:20px 0 18px;margin-bottom:22px;
  border-bottom:3px solid var(--accent-2);box-shadow:0 6px 24px rgba(22,30,45,.22)}
.top .wrap{padding-bottom:0}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand .inst{font-size:12px;letter-spacing:.04em;opacity:.8}
.brand .course{font-family:'Amiri',serif;font-size:clamp(20px,3.2vw,27px);font-weight:700;line-height:1.25}
.who{font-size:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.who b{font-weight:600}
.linkbtn{background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:6px;padding:6px 12px;font-size:13px}
.linkbtn:hover{background:rgba(255,255,255,.28)}

.gate{max-width:400px;margin:8vh auto 0;padding:0 16px;text-align:center}
.gate .seal-mark{width:70px;height:70px;margin:0 auto 20px;background:var(--grad);
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:'Amiri',serif;font-size:34px;color:#fff;
  box-shadow:0 10px 26px rgba(32,76,197,.30)}
.gate h1{font-family:'Amiri',serif;font-size:clamp(23px,5.4vw,31px);margin-bottom:8px;line-height:1.4}
.gate p{color:var(--muted);margin:0 0 26px;font-size:15px}
.codebox{width:100%;padding:16px;text-align:center;letter-spacing:.34em;font-size:22px;font-weight:600;
  border:1.5px solid var(--line);border-radius:var(--r);background:var(--surface);text-transform:uppercase}
.codebox:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

.btn{background:var(--accent-2);color:#161e2d;border:1px solid #2563a8;border-radius:var(--r);padding:14px 20px;
  font-weight:600;width:100%;margin-top:12px;box-shadow:0 2px 5px rgba(22,30,45,.16)}
.btn:hover{background:#2563a8;color:#fff}
.btn:disabled{opacity:.55;cursor:default}
.btn.sm{width:auto;padding:9px 16px;font-size:14px;margin:0}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--line);box-shadow:none}
.btn.ghost:hover{background:var(--accent-soft);border-color:var(--accent)}
.btn{transition:background .18s ease,transform .06s ease}
.btn:active{transform:translateY(1px);box-shadow:none}
.btn.danger{background:transparent;color:var(--danger);border:1.5px solid var(--danger-line);box-shadow:none}
.btn.danger:hover{background:var(--danger-soft)}

.tabs{display:flex;gap:4px;border-bottom:1.5px solid var(--line);margin-bottom:22px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab{background:none;border:0;padding:11px 16px;color:var(--muted);font-weight:500;
  border-bottom:3px solid transparent;margin-bottom:-1.5px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent-2);font-weight:600}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.codewrap{position:relative}
.codewrap .eye{position:absolute;inset-inline-start:10px;top:50%;transform:translateY(-50%);
  background:none;border:0;color:var(--muted);font-size:19px;padding:4px 6px;line-height:1}
.codewrap .eye:hover{color:var(--accent)}
.announce{background:linear-gradient(180deg,var(--seal-soft),transparent);
  border:1px solid var(--line);border-inline-start:4px solid var(--seal);
  border-radius:var(--r);padding:14px 16px;margin-bottom:16px;font-size:15px;line-height:1.75;white-space:pre-wrap}
.announce b{display:block;font-size:12.5px;letter-spacing:.05em;color:var(--seal);margin-bottom:4px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.foot{text-align:center;color:var(--muted);font-size:12.5px;line-height:1.9;
  padding:26px 16px 34px;border-top:1px solid var(--line);margin-top:34px}
.foot b{font-weight:600;color:var(--ink)}
.pickbox{background:var(--accent-soft);border-radius:var(--r);padding:22px;text-align:center;margin-top:12px}
.pickbox .nm{font-size:26px;font-weight:700;line-height:1.4}
.pickbox .sub{font-size:13px;color:var(--muted);margin-top:4px}
.desc{white-space:pre-wrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--danger);
  margin-inline-start:6px;vertical-align:middle}
.msgin{border-inline-start:3px solid var(--accent);background:var(--accent-soft);
  border-radius:var(--r);padding:14px 16px;margin-top:10px}
.msgin.new{border-inline-start-color:var(--danger)}
.qrwrap{text-align:center;padding:18px 0}
.qrbox{display:inline-block;background:#fff;padding:14px;border-radius:var(--r);border:1px solid var(--line)}
.qrbox canvas,.qrbox img{display:block}
.qrfall{font-family:monospace;font-size:30px;letter-spacing:.22em;font-weight:700;
  background:#fff;color:#0e1b33;padding:22px 18px;border-radius:var(--r);border:1px solid var(--line);display:inline-block}
.cardhead{background:var(--grad);color:#fff;border-radius:var(--r) var(--r) 0 0;padding:18px;margin:-18px -18px 16px}
.cardhead h3{color:#fff;margin:0}
.cardhead .sub{color:rgba(255,255,255,.82);font-size:13.5px;margin-top:4px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--muted)}
.kv .v{font-weight:600}
.bonusrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.opt{display:block;width:100%;text-align:start;background:var(--surface);border:2px solid var(--line);
  border-radius:var(--r);padding:16px 18px;margin-top:10px;font-size:16px;font-weight:500;
  color:var(--ink);line-height:1.6;transition:all .15s ease}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt:disabled{opacity:.5}
.opt.sel{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.qnum{display:inline-block;background:var(--accent);color:#fff;border-radius:999px;
  padding:5px 14px;font-size:13.5px;font-weight:600}
.big{font-size:20px;font-weight:700;text-align:center;padding:26px 0}

/* شاشة العرض — للبروجكتر */
#proj{position:fixed;inset:0;z-index:9999;background:var(--surface);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:5vh 6vw}
#proj.hide{display:none}
#proj .pnum{font-size:clamp(18px,2.4vw,30px);font-weight:600;color:var(--accent);
  background:var(--accent-soft);padding:10px 28px;border-radius:999px;margin-bottom:5vh}
#proj .ptext{font-size:clamp(30px,5.2vw,76px);font-weight:700;line-height:1.55;
  text-align:center;max-width:22ch;color:var(--ink)}
#proj .pbar{position:fixed;bottom:26px;display:flex;gap:12px;align-items:center}
#proj .pbar button{background:var(--accent);color:#fff;border:0;border-radius:10px;
  padding:14px 26px;font-size:17px;font-weight:600;font-family:inherit}
#proj .pbar button.g{background:transparent;color:var(--muted);border:1.5px solid var(--line)}
#proj .pcount{position:fixed;top:26px;inset-inline-end:32px;font-size:16px;color:var(--muted)}
.card h3{font-size:18px;margin-bottom:4px}
.meta{font-size:13px;color:var(--muted)}
.desc{margin:10px 0 0;white-space:pre-wrap}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.stack{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.wait{background:var(--warn-soft);color:var(--warn)}
.pill.none{background:var(--track);color:var(--muted)}
.pill.late{background:var(--danger-soft);color:var(--danger)}

.scorecard{margin-top:16px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.sc-head{background:var(--accent-soft);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.sc-title{font-weight:600;font-size:15px}
.seal{width:74px;height:74px;flex:0 0 auto;border:2px solid var(--seal);border-radius:50%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--seal);background:var(--seal-soft)}
.seal .n{font-family:'Amiri',serif;font-size:26px;font-weight:700;line-height:1}
.seal .d{font-size:11px;letter-spacing:.06em;margin-top:2px}
.sc-body{padding:8px 16px 16px}
.crit{padding:12px 0;border-bottom:1px dashed var(--line)}
.crit:last-child{border-bottom:0}
.crit-top{display:flex;justify-content:space-between;gap:10px;font-size:15px}
.crit-name{font-weight:500}
.crit-pts{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;white-space:nowrap}
.bar{height:7px;background:var(--track);border-radius:99px;margin-top:8px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--grad);border-radius:99px}
.crit-note{font-size:13px;color:var(--muted);margin-top:6px}
.fb{margin:14px 16px 16px;padding:13px 15px;background:var(--seal-soft);border-right:3px solid var(--seal);
  border-radius:6px;font-size:14.5px;white-space:pre-wrap}

table{width:100%;border-collapse:collapse;font-size:14.5px}
th,td{text-align:right;padding:11px 10px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:13px}
td.num,th.num{font-variant-numeric:tabular-nums}
.tblwrap{overflow-x:auto}

label{display:block;font-size:13.5px;font-weight:600;margin:14px 0 5px}
input[type=text],input[type=number],input[type=date],textarea,select{
  width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
textarea{min-height:84px;resize:vertical;line-height:1.6}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:14.5px}
.check input{width:18px;height:18px}
.crit-row{display:grid;grid-template-columns:1fr 90px 34px;gap:8px;align-items:center;margin-bottom:8px}
.iconbtn{background:none;border:1.5px solid var(--line);border-radius:8px;height:42px;color:var(--danger);font-size:18px;line-height:1}

.empty{text-align:center;color:var(--muted);padding:40px 16px;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.note{background:var(--seal-soft);border:1px solid var(--seal-line);border-radius:8px;padding:12px 14px;font-size:14px;margin-bottom:14px}
.err{background:var(--danger-soft);border:1px solid var(--danger-line);color:var(--danger);border-radius:8px;padding:12px 14px;font-size:14.5px;margin-top:12px}
.hide{display:none!important}
.spin{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.4);
  border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.center{text-align:center;padding:50px;color:var(--muted)}
.toast{position:fixed;bottom:20px;right:50%;transform:translateX(50%);background:var(--ink);color:var(--surface);
  padding:12px 20px;border-radius:99px;font-size:14.5px;z-index:99;box-shadow:0 6px 22px rgba(0,0,0,.25)}
.filebox{border:1.5px dashed var(--accent);border-radius:var(--r);padding:18px;text-align:center;background:var(--accent-soft);margin-top:14px}
.filebox input[type=file]{display:none}
.filename{font-size:14px;color:var(--accent);font-weight:600;margin-top:8px;word-break:break-all}
.prog{height:6px;background:var(--track);border-radius:99px;margin-top:12px;overflow:hidden}
.prog span{display:block;height:100%;width:0;background:var(--grad);transition:width .25s}
.filemeta{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.7}
.preview-overlay{position:fixed;inset:0;z-index:1000;background:rgba(4,14,35,.72);display:flex;align-items:center;justify-content:center;padding:18px}
.preview-overlay.hide{display:none}
.preview-dialog{width:min(940px,96vw);height:min(88vh,760px);background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;overflow:hidden}
.preview-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.preview-body{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:12px;background:var(--paper)}
.preview-body iframe{width:100%;height:100%;border:0;background:#fff}
.preview-body img{max-width:100%;max-height:100%;object-fit:contain}
.preview-note{text-align:center;color:var(--muted);padding:24px;line-height:1.8}
.proof{margin-top:14px;border:1px solid var(--ok);background:var(--ok-soft);border-radius:var(--r);padding:15px}
.proof.late{border-color:var(--warn);background:var(--warn-soft)}
.proof-title{font-weight:700;color:var(--ok);font-size:16px}
.proof.late .proof-title{color:var(--warn)}

@media(max-width:560px){
  .brand .course{font-size:21px}
  .grid2{grid-template-columns:1fr}
  .seal{width:64px;height:64px}
  .seal .n{font-size:22px}
}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px}
.top button:focus-visible,.cardhead button:focus-visible{outline-color:#fff}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
var S = { role:null, code:null, name:'', tab:0, data:null, info:{maxMB:10} };

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function toast(m){ var t=document.createElement('div'); t.className='toast'; t.textContent=m;
  document.body.appendChild(t); setTimeout(function(){ t.remove(); },2600); }
function fmtDate(v){ if(!v) return '—'; var d=new Date(v);
  if(isNaN(d)) return String(v).slice(0,10);
  return d.toLocaleDateString('ar-IQ',{year:'numeric',month:'2-digit',day:'2-digit'}); }
function pct(a,b){ return b>0 ? Math.round(a/b*100) : 0; }
function hasGrade(s){ return !!(s && s.total!=='' && s.total!=null && isFinite(Number(s.total))); }

/* ═══ الاتصال بالخادم ═══
   المحاولة الأولى: POST بنوع text/plain (يتجنّب فحص CORS المسبق).
   إن فشلت لأي سبب، نستخدم JSONP عبر وسم script — يعمل دائماً للقراءة. */

function post(payload){
  return fetch(API,{
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(payload),
    redirect:'follow'
  }).then(function(r){ return r.json(); });
}

function jsonp(payload){
  return new Promise(function(resolve,reject){
    var cb='cb_'+Math.random().toString(36).slice(2);
    var s=document.createElement('script');
    var timer=setTimeout(function(){ done(); reject(new Error('انتهت المهلة. تحقّق من الاتصال.')); },25000);
    function done(){ clearTimeout(timer); try{ delete window[cb]; }catch(e){ window[cb]=undefined; }
      if(s.parentNode) s.parentNode.removeChild(s); }
    window[cb]=function(j){ done(); resolve(j); };
    s.onerror=function(){ done(); reject(new Error('تعذّر الاتصال بالخادم.')); };
    s.src=API+'?action='+encodeURIComponent(payload.action)+
          '&callback='+cb+'&payload='+encodeURIComponent(JSON.stringify(payload));
    document.body.appendChild(s);
  });
}

function api(action,payload){
  payload = payload || {};
  payload.action = action;
  // إجراءات الكتابة لا تمرّ عبر JSONP — الخادم يرفضها ويعيد رسالة غامضة
  var WRITE = ['upload','grade','saveLecture','saveAssignment','publish',
               'addStudents','bulkGrades','contact','deleteItem','saveSettings','unlockCode','addBonus','studentCard','saveQuiz','deleteQuiz','quizStart','quizStep','quizFinish','answer','sendToStudent','markSeen',
               'recordAttendance','uploadActivity','approveActivity','uploadStory','approveStory','gradeSubmissionsBulk','addAppreciation'];
  var heavy = WRITE.indexOf(action) !== -1;
  return post(payload).catch(function(){
    if(heavy) throw new Error('تعذّر الاتصال بالخادم. تحقّق من الإنترنت وأعد المحاولة.');
    return jsonp(payload);
  }).then(function(j){
    if(!j) throw new Error('لا يوجد رد من الخادم.');
    if(!j.ok) throw new Error(j.error || 'خطأ غير متوقع.');
    return j.data;
  });
}

function addQ(q){

      esc(q?q.text:'')+'</textarea>'+

      var v=q&&q.choices?(q.choices[i]||''):'';
      return '<div style="display:flex;gap:8px;align-items:center;margin-top:6px">'+
        '<input type="radio" name="c'+n+'" class="qCor" value="'+i+'"'+
          ((q&&q.correct===i)||(!q&&i===0)?' checked':'')+'>'+
        '<input type="text" class="qCh" style="margin:0" placeholder="الخيار '+(i+1)+'" value="'+esc(v)+'">'+
      '</div>';
    }).join('');
  $('qList').appendChild(d);
}

function collectQs(){
  var out=[], cards=$('qList').children;
  for(var i=0;i<cards.length;i++){
    var c=cards[i];
    var text=c.querySelector('.qText').value.trim();
    var chs=[], els=c.querySelectorAll('.qCh');
    for(var j=0;j<els.length;j++){ var v=els[j].value.trim(); if(v) chs.push(v); }
    var cor=0, rs=c.querySelectorAll('.qCor');
    for(var k=0;k<rs.length;k++) if(rs[k].checked) cor=Number(rs[k].value);
    if(!text || chs.length<2) continue;
    if(cor>=chs.length) cor=0;
    out.push({text:text,choices:chs,correct:cor,points:1});
  }
  return out;
}

    var z=(quizzes||[]).filter(function(x){ return x.id===projId; })[0];

    '<div class="sub">'+esc(d.code)+(d.section?' · شعبة '+esc(d.section):'')+

  h+='<div class="kv"><span class="k">الدرجة الحالية</span>'+

     '<div class="kv"><span class="k">التسليمات</span>'+

     (d.lateCount?' · '+d.lateCount+' متأخر':'')+'</span></div>'+
     '<div class="kv"><span class="k">مكافأة</span>'+
     '<span class="v">'+d.appreciation.bonus+' من '+d.appreciation.bonusMax+'</span></div>'+
     '<div class="kv"><span class="k">شكر وتقدير</span>'+
     '<span class="v">'+d.appreciation.appreciation+' من '+d.appreciation.appreciationMax+'</span></div>'+

  var fc=document.querySelector('.foot b'); if(fc) fc.textContent='منصة مادة '+i.course;
  var sp=qsParam('s');
  if(sp) scanCode=sp.trim().toUpperCase();
  var c=null; try{ c=localStorage.getItem('mcode'); }catch(e){}
  if(c){ $('code').value=c; doLogin(); }
  else if(scanCode){
    $('gateErr').textContent='بطاقة الطالب متاحة لحساب الإدارة فقط — أدخل رمز الإدارة.';
    $('gateErr').className='err';
  }
}).catch(function(e){
  $('gateErr').textContent='تعذّر الوصول إلى الخادم. تأكد أن الرابط في أعلى الملف صحيح وأن النشر مضبوط على Anyone.';
  $('gateErr').className='err';
});

$('code').addEventListener('keydown',function(e){ if(e.key==='Enter') doLogin(); });
$('enter').addEventListener('click',doLogin);

function doLogin(){
  var v=$('code').value.trim();
  if(!v) return;
  $('gateErr').className='err hide';
  $('enter').disabled=true; $('enter').innerHTML='<span class="spin"></span> جارٍ التحقق';
  api('login',{code:v}).then(function(r){
    $('enter').disabled=false; $('enter').textContent='دخول';
    if(!r.ok){ $('gateErr').textContent=r.message; $('gateErr').className='err'; return; }
    S.role=r.role; S.code=r.code||v; S.name=r.name;
    try{ localStorage.setItem('mcode',S.code); }catch(e){}
    start();
  }).catch(function(e){
    $('enter').disabled=false; $('enter').textContent='دخول';
    $('gateErr').textContent=e.message; $('gateErr').className='err';
  });
}

function signOut(){ try{ localStorage.removeItem('mcode'); }catch(e){}
  location.href=location.pathname; }

function start(){
  $('gate').className='gate hide';
  $('app').className='';
  $('userName').innerHTML='<b>'+esc(S.role==='teacher'?'لوحة التحكم':S.name)+'</b>';
  $('refreshBtn').className='linkbtn';
  msgsLoaded=null;
  S.tab=0; renderTabs(); load();
}

/* ═══ المظهر ═══ */
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t==='dark'?'dark':'light');
  var b=$('themeBtn'); if(b) b.innerHTML = t==='dark' ? '&#9728;' : '&#9789;';
  try{ localStorage.setItem('mtheme',t); }catch(e){}
}
function toggleTheme(){
  var cur=document.documentElement.getAttribute('data-theme');
  applyTheme(cur==='dark'?'light':'dark');
}
function initTheme(){
  var t=null;
  try{ t=localStorage.getItem('mtheme'); }catch(e){}
  if(!t) t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark':'light';
  applyTheme(t);
}

/* ═══ إظهار/إخفاء الرمز ═══ */
function toggleEye(){
  var i=$('code'), b=$('eyeBtn');
  var show = i.type==='password';
  i.type = show ? 'text' : 'password';
  var lbl = show ? 'إخفاء الرمز' : 'إظهار الرمز';
  b.title = lbl;
  b.setAttribute('aria-label', lbl);
  i.focus();
}

/* ═══ تحديث بلا خروج ═══ */
var refreshing=false;
function doRefresh(){
  if(refreshing) return;
  refreshing=true;
  var b=$('refreshBtn'); if(b){ b.disabled=true; b.textContent='…'; }
  api(S.role==='student'?'studentData':'teacherData',{code:S.code})
    .then(function(d){
      S.data=d; msgsLoaded=null; trashCache=null; bonusCache=null; stg=null; quizzes=null;
      renderTop(); render(); toast('تم التحديث');
    })
    .catch(function(e){ toast(e.message); })
    .then(function(){
      refreshing=false;
      if(b){ b.disabled=false; b.textContent='تحديث'; }
    });
}

/* ═══ الإعلان ورابط الاختبار (يظهران للطالب) ═══ */
function renderTop(){
  var st=(S.data && S.data.settings) || null;
  var a=$('announceBox'), q=$('quizBox');
  if(!a||!q) return;
  if(S.role!=='student' || !st){ a.innerHTML=''; q.innerHTML=''; return; }

  a.innerHTML = (st.announceOn && st.announce)
    ? '<div class="announce"><b>إعلان</b>'+esc(st.announce)+'</div>' : '';

  q.innerHTML = '';   // نظام الرابط الخارجي أُزيل — الاختبارات صارت داخل المنصة
}

function unreadCount(){
  if(S.role!=='student') return 0;
  return ((S.data&&S.data.inbox)||[]).filter(function(m){ return !m.seen; }).length;
}

function renderTabs(){
  if(scanCode && S.role==='teacher'){ $('tabs').innerHTML=''; return; }
  var names = S.role==='student'
    ? ['المحاضرات','الواجبات','الأنشطة','قصة النجاح','درجاتي','الاختبارات','التواصل']
    : ['التسليمات','الواجبات','المحاضرات','الدرجات','بنك الأسئلة','الطلبة','الحضور','الأنشطة والقصص','الرسائل'];
  var un=unreadCount();
  $('tabs').innerHTML = names.map(function(n,i){
    // شارة الرسائل الجديدة على تبويب «التواصل» (الأخير عند الطالب)
    var badge = (un && S.role==='student' && i===6) ? '<span class="dot"></span>' : '';
    return '<button class="tab" role="tab" aria-selected="'+(i===S.tab)+'" onclick="go('+i+')">'+
      n+badge+'</button>';
  }).join('');
}
function go(i){ S.tab=i; renderTabs(); render(); }

function load(){
  $('view').innerHTML='<div class="center">جارٍ التحميل…</div>';
  api(S.role==='student'?'studentData':'teacherData',{code:S.code})
    .then(function(d){ S.data=d; render(); })
    .catch(function(e){ $('view').innerHTML='<div class="err">'+esc(e.message)+'</div>'; });
}

function render(){
  if(!S.data) return;
  renderTop();

  // مسح QR: البطاقة للأدمن فقط، ورسالة صريحة لغيره
  if(scanCode){
    if(S.role==='teacher'){
      if(cardData===null && !cardErr) loadCard();
      $('view').innerHTML = cardView();
      return;
    }
    $('view').innerHTML='<div class="card"><h3>بطاقة الطالب</h3>'+
      '<div class="err">بطاقة الطالب متاحة لحساب الإدارة فقط.</div>'+
      '<button class="btn sm ghost" style="margin-top:12px" onclick="clearScan()">العودة إلى صفحتي</button></div>';
    return;
  }

  $('view').innerHTML = S.role==='student' ? studentView() : teacherView();
  if(S.role==='student' && S.tab===6){
    setTimeout(drawQR,0);
    if(unreadCount()) markRead();
  }
}

/* ═══════════ الطالب ═══════════ */

function studentView(){
  if(S.tab===0) return lecturesView();
  if(S.tab===1) return assignmentsView();
  if(S.tab===2) return activitiesStudentView();
  if(S.tab===3) return storyStudentView();
  if(S.tab===4) return gradesView();
  if(S.tab===5) return quizReviewView();
  return contactView();
}

function quizReviewView(){
  var Q=S.data.quiz||{current:null,review:[]};
  var h='';

  if(Q.current){
    var c=Q.current;
    h+='<div class="card"><div class="row"><h3>'+esc(c.title)+'</h3>'+
      '<span class="qnum">السؤال '+c.step+' من '+c.total+'</span></div>'+
      '<div class="note">السؤال معروض على الشاشة أمامك — اختر الإجابة هنا.</div>';

    if(c.answered){
      h+='<div class="big" style="color:var(--ok)">✓ سُجّلت إجابتك</div>'+
        '<div class="meta" style="text-align:center">انتظر السؤال التالي، ثم اضغط «تحديث».</div>';
    } else {
      h+=c.choices.map(function(o){
        return '<button class="opt" onclick="pickAns(\''+c.quizId+'\','+c.step+','+o.i+',this)">'+
          esc(o.text)+'</button>';
      }).join('');
      h+='<div class="meta" style="margin-top:14px">لا يمكن تغيير الإجابة بعد اختيارها.</div>';
    }
    h+='</div>';
  }

  var R=Q.review||[];
  if(!Q.current && !R.length) return '<div class="empty">لا يوجد اختبار مفتوح الآن.</div>';

  R.forEach(function(z){
    h+='<div class="card"><div class="row"><h3>'+esc(z.title)+'</h3>'+
      (z.score!=null?'<span class="pill ok">'+z.score+' من '+z.maxScore+'</span>':'')+'</div>'+
      (z.lecture?'<div class="meta">'+esc(z.lecture)+'</div>':'');

    z.questions.forEach(function(q,i){
      h+='<div style="margin-top:18px;padding-top:14px;border-top:1px solid var(--line)">'+
         '<div style="font-weight:600">'+(i+1)+'. '+esc(q.text)+'</div>';
      q.choices.forEach(function(ch,ci){
        var ok=(ci===q.correct), me=(ci===q.mine);
        var bg = ok ? 'background:var(--accent-soft);font-weight:600'
               : (me ? 'background:var(--danger-soft)' : '');
        var tag = ok ? '✓ ' : (me ? '✗ ' : '');
        h+='<div style="padding:7px 10px;margin-top:5px;border-radius:8px;font-size:14.5px;'+bg+'">'+
           tag+esc(ch)+(me&&!ok?' <span class="meta">(إجابتك)</span>':'')+'</div>';
      });
      if(q.mine==null) h+='<div class="meta" style="margin-top:5px">لم تجب على هذا السؤال.</div>';
      h+='</div>';
    });
    h+='</div>';
  });
  return h;
}

function pickAns(quizId,step,choice,btn){
  var all=document.querySelectorAll('.opt');
  for(var i=0;i<all.length;i++) all[i].disabled=true;
  btn.className='opt sel';
  api('answer',{code:S.code,quizId:quizId,qIndex:step,choice:choice})
    .then(function(){ toast('سُجّلت إجابتك'); doRefresh(); })
    .catch(function(e){
      toast(e.message);
      for(var i=0;i<all.length;i++) all[i].disabled=false;
      btn.className='opt';
    });
}

function contactView(){
  var em=(S.info && S.info.teacherEmail) || '';
  var nm=(S.info && S.info.teacherName) || 'أستاذ المادة';
  var subj='['+((S.info&&S.info.course)||'المادة')+'] '+S.name;
  var body='الاسم: '+S.name+'\nالرمز: '+S.code+
           (S.data.section?('\nالشعبة: '+S.data.section):'')+'\n\n';
  var href='mailto:'+em+'?subject='+encodeURIComponent(subj)+'&body='+encodeURIComponent(body);

  var inb=S.data.inbox||[];
  var box='';
  if(inb.length){
    box='<div class="card"><h3>رسائل من أستاذ المادة</h3>'+
      inb.map(function(m){
        return '<div class="msgin'+(m.seen?'':' new')+'">'+
          '<div class="row"><b>'+esc(m.subject||'رسالة')+'</b>'+
          '<span class="meta">'+fmtDate(m.date)+'</span></div>'+
          '<div class="desc" style="margin-top:6px">'+esc(m.message)+'</div></div>';
      }).join('')+'</div>';
  }

  return box+'<div class="card"><h3>التواصل مع أستاذ المادة</h3>'+
    '<div class="note">المراسلة تكون عبر البريد الإلكتروني الرسمي. اذكر اسمك ورمزك في رسالتك.</div>'+
    '<div style="margin-top:14px;font-size:15px;line-height:2">'+
    '<div><b>'+esc(nm)+'</b></div>'+
    '<div style="direction:ltr;text-align:right;font-family:monospace;font-size:14.5px">'+esc(em)+'</div>'+
    '</div>'+
    '<div class="stack" style="margin-top:16px">'+
    '<a class="btn sm" style="text-decoration:none" href="'+esc(href)+'">فتح بريدي وكتابة رسالة</a>'+
    '<button class="btn sm ghost" onclick="copyEmail()">نسخ البريد</button>'+
    '</div></div>'+

    '<div class="card"><h3>رمزك المصوَّر</h3>'+
    '<div class="note">اعرض هذا الرمز للأستاذ عند طلبه في القاعة.</div>'+
    '<div class="qrwrap" id="qrWrap"></div></div>';
}

function markRead(){
  api('markSeen',{code:S.code})
    .then(function(){
      ((S.data&&S.data.inbox)||[]).forEach(function(m){ m.seen=true; });
      renderTabs();
    }).catch(function(){});
}

function drawQR(){
  var w=$('qrWrap');
  if(!w || w.getAttribute('data-done')==='1') return;
  var url = location.origin + location.pathname + '?s=' + encodeURIComponent(S.code);
  w.innerHTML='';
  if(window.__noQR || typeof QRCode==='undefined'){
    w.innerHTML='<div class="qrfall">'+esc(S.code)+'</div>'+
      '<div class="meta" style="margin-top:10px">تعذّر تحميل الرمز المصوَّر — اعرض الرمز أعلاه.</div>';
  } else {
    var box=document.createElement('div'); box.className='qrbox';
    w.appendChild(box);
    try{
      new QRCode(box,{text:url,width:190,height:190,correctLevel:QRCode.CorrectLevel.M});
    }catch(e){
      w.innerHTML='<div class="qrfall">'+esc(S.code)+'</div>';
    }
  }
  w.setAttribute('data-done','1');
}

function copyEmail(){
  var em=(S.info && S.info.teacherEmail) || '';
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(em).then(function(){ toast('نُسخ البريد'); },
      function(){ toast(em); });
  } else toast(em);
}

function lecturesView(){
  var L=S.data.lectures||[];
  if(!L.length) return '<div class="empty">لم يُنشر محتوى بعد.</div>';
  return L.map(function(l){
    return '<div class="card"><div class="row"><h3>'+esc(l.title)+'</h3>'+
      '<span class="meta">'+fmtDate(l.date)+'</span></div>'+
      (l.note?'<p class="desc">'+esc(l.note)+'</p>':'')+
      (l.url?'<div class="stack"><a class="btn sm" style="text-decoration:none;display:inline-block" href="'+
        esc(l.url)+'" target="_blank" rel="noopener">فتح الملف</a></div>':'')+'</div>';
  }).join('');
}

function assignmentsView(){
  var A=S.data.assignments||[];
  if(!A.length) return '<div class="empty">لا توجد واجبات منشورة.</div>';
  return A.map(function(a,i){ return assignmentCard(a,i); }).join('');
}

function assignmentCard(a,i){
  var s=a.submission;
  var badge = !s ? '<span class="pill none">لم يُسلَّم</span>'
    : (hasGrade(s) ? '<span class="pill ok">مصحح</span>'
    : (s.status==='متأخر' ? '<span class="pill late">مستلم متأخراً</span>'
    : '<span class="pill wait">قيد التصحيح</span>'));

  var h='<div class="card"><div class="row"><h3>'+esc(a.title)+'</h3>'+badge+'</div>'+
    '<div class="meta">آخر موعد: '+fmtDate(a.due)+' · الدرجة القصوى: '+a.maxScore+'</div>'+
    (a.description?'<p class="desc">'+esc(a.description)+'</p>':'');

  if(a.criteria.length && (!s || !hasGrade(s))){
    h+='<div class="scorecard"><div class="sc-head"><span class="sc-title">معايير التقييم</span></div>'+
      '<div class="sc-body">'+a.criteria.map(function(c){
        return '<div class="crit"><div class="crit-top"><span class="crit-name">'+esc(c.criterion)+
          '</span><span class="crit-pts">'+c.maxPoints+' درجة</span></div>'+
          (c.guide?'<div class="crit-note">'+esc(c.guide)+'</div>':'')+'</div>';
      }).join('')+'</div></div>';
  }

  if(hasGrade(s)){
    h+='<div class="scorecard"><div class="sc-head">'+
      '<div><div class="sc-title">بطاقة التقييم</div><div class="meta">'+esc(s.fileName||'')+'</div></div>'+
      '<div class="seal"><span class="n">'+s.total+'</span><span class="d">من '+a.maxScore+'</span></div></div>'+
      '<div class="sc-body">'+a.criteria.map(function(c){
        var got=Number(s.scores[c.criterionId]||0);
        return '<div class="crit"><div class="crit-top"><span class="crit-name">'+esc(c.criterion)+
          '</span><span class="crit-pts">'+got+' / '+c.maxPoints+'</span></div>'+
          '<div class="bar"><span style="width:'+pct(got,c.maxPoints)+'%"></span></div></div>';
      }).join('')+'</div>'+
      (s.feedback?'<div class="fb">'+esc(s.feedback)+'</div>':'')+'</div>';
  }

  if(!s){
    h+='<div class="filebox">'+
      '<button class="btn sm ghost" onclick="document.getElementById(\'f'+i+'\').click()">اختيار الملف</button>'+
      '<input type="file" id="f'+i+'" accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.zip,.png,.jpg,.jpeg" onchange="pick('+i+')">'+
      '<div class="filename" id="fn'+i+'"></div>'+      '<div class="filemeta" id="fi'+i+'">الحد الأقصى '+S.info.maxMB+' ميغابايت</div>'+      '<div class="stack" style="justify-content:center;margin-top:10px">'+      '<button class="btn sm ghost hide" id="pv'+i+'" onclick="previewPicked('+i+')">معاينة الملف</button>'+      '<button class="btn sm hide" id="up'+i+'" onclick="upload('+i+',\''+a.id+'\')">تأكيد وإرسال الواجب</button></div>'+      '<div class="prog hide" id="pg'+i+'"><span></span></div>'+      '<div id="uerr'+i+'"></div></div>';
  } else {
    var proofCls=s.status==='متأخر'?' late':'';
    h+='<div class="proof'+proofCls+'">'+      '<div class="proof-title">'+(s.status==='متأخر'?'تم تسلّم الواجب، لكنه متأخر':'تم تسلّم واجبك بنجاح')+'</div>'+      '<div class="kv"><span class="k">الملف</span><span class="v">'+esc(s.fileName)+'</span></div>'+      '<div class="kv"><span class="k">الحجم</span><span class="v">'+formatBytes(s.fileSize)+'</span></div>'+      '<div class="kv"><span class="k">وقت التسليم</span><span class="v">'+fmtDateTime(s.submittedAt)+'</span></div>'+      '<div class="stack">'+(s.fileUrl?'<a class="btn sm ghost" style="text-decoration:none" href="'+esc(s.fileUrl)+'" target="_blank" rel="noopener">عرض الملف</a>':'')+      '<span class="meta" style="align-self:center">لا يمكن استبدال الملف بعد التسليم</span></div></div>';
  }
  return h+'</div>';
}

var OK_EXT=['pdf','doc','docx','ppt','pptx','xls','xlsx','zip','png','jpg','jpeg'];
var picked={};
function pick(i){
  var f=$('f'+i).files[0]; if(!f) return;
  var mb=f.size/1024/1024, err=$('uerr'+i);
  var ext=f.name.split('.').pop().toLowerCase();
  if(OK_EXT.indexOf(ext)===-1){
    err.innerHTML='<div class="err">نوع الملف غير مقبول. المسموح: '+OK_EXT.join('، ')+'</div>';
    $('up'+i).className='btn sm hide'; $('pv'+i).className='btn sm ghost hide'; return;
  }
  if(mb>S.info.maxMB){
    err.innerHTML='<div class="err">حجم الملف '+mb.toFixed(2)+' ميغابايت، والحد الأقصى '+
      S.info.maxMB+'. اضغط الملف أو قسّمه.</div>';
    $('up'+i).className='btn sm hide'; $('pv'+i).className='btn sm ghost hide'; return;
  }
  err.innerHTML=''; picked[i]=f;
  $('fn'+i).textContent=f.name;
  $('fi'+i).textContent='الحجم الحالي: '+formatBytes(f.size)+' · النوع: '+(f.type||ext.toUpperCase())+' · الحد الأقصى '+S.info.maxMB+' ميغابايت';
  $('up'+i).className='btn sm'; $('pv'+i).className='btn sm ghost';
}

function upload(i,aid){
  var f=picked[i]; if(!f) return;
  if(!window.confirm('بعد تأكيد الإرسال لن تتمكن من استبدال الملف. هل تريد تسليم هذا الواجب الآن؟')) return;
  var b=$('up'+i), pg=$('pg'+i);
  b.disabled=true; b.innerHTML='<span class="spin"></span> جارٍ التسليم';
  pg.className='prog'; pg.firstChild.style.width='25%';

  var r=new FileReader();
  r.onload=function(){
    pg.firstChild.style.width='60%';
    api('upload',{code:S.code,assignmentId:aid,fileName:f.name,
                  mimeType:f.type,base64:r.result.split(',')[1]})
      .then(function(){ pg.firstChild.style.width='100%'; toast('تم تسلّم الواجب بنجاح'); load(); })
      .catch(function(e){
        b.disabled=false; b.textContent='تأكيد وإرسال الواجب'; pg.className='prog hide';
        $('uerr'+i).innerHTML='<div class="err">'+esc(e.message)+'</div>';
      });
  };
  r.onerror=function(){ b.disabled=false; b.textContent='تأكيد وإرسال الواجب'; pg.className='prog hide'; $('uerr'+i).innerHTML='<div class="err">تعذّر قراءة الملف.</div>'; };
  r.readAsDataURL(f);
}

function formatBytes(n){
  n=Number(n)||0; if(!n) return '—';
  if(n<1024) return n+' بايت';
  if(n<1024*1024) return (n/1024).toFixed(1)+' KB';
  return (n/1024/1024).toFixed(2)+' MB';
}
function fmtDateTime(v){
  if(!v) return '—'; var d=new Date(v); if(isNaN(d)) return String(v);
  return d.toLocaleString('ar-IQ',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
function previewPicked(i){
  var f=picked[i]; if(!f) return;
  var url=URL.createObjectURL(f), type=f.type||'';
  var body='';
  if(type==='application/pdf') body='<iframe src="'+url+'" title="معاينة الملف"></iframe>';
  else if(type.indexOf('image/')===0) body='<img src="'+url+'" alt="معاينة الملف">';
  else body='<div class="preview-note">المعاينة المباشرة لهذا النوع غير متاحة داخل المتصفح.<br><b>'+esc(f.name)+'</b><br>'+formatBytes(f.size)+'</div>';
  $('previewTitle').textContent='معاينة: '+f.name;

       '<div class="meta" style="margin-top:8px">لا يمكن استبدال الملف بعد التسليم</div></div>';

function pickAct(i,id){
  var f=$('af'+i).files[0]; if(!f) return;
  var mb=f.size/1024/1024, err=$('aerr'+i);
  var ext=f.name.split('.').pop().toLowerCase();
  if(OK_EXT.indexOf(ext)===-1){
    err.innerHTML='<div class="err">نوع الملف غير مقبول. المسموح: '+OK_EXT.join('، ')+'</div>';
    $('aup'+i).className='btn sm hide'; return;
  }
  if(mb>S.info.maxMB){
    err.innerHTML='<div class="err">حجم الملف '+mb.toFixed(2)+' ميغابايت، والحد الأقصى '+S.info.maxMB+'.</div>';
    $('aup'+i).className='btn sm hide'; return;
  }
  err.innerHTML=''; pickedAct[i]=f;
  $('afn'+i).textContent=f.name;
  $('afi'+i).textContent='الحجم: '+formatBytes(f.size);
  $('aup'+i).className='btn sm';
}

function uploadAct(i,id){
  var f=pickedAct[i]; if(!f) return;
  if(!window.confirm('بعد التأكيد لن تتمكن من استبدال الملف. تسليم النشاط الآن؟')) return;
  var b=$('aup'+i), pg=$('apg'+i);
  b.disabled=true; b.innerHTML='<span class="spin"></span> جارٍ التسليم';
  pg.className='prog'; pg.firstChild.style.width='25%';
  var r=new FileReader();
  r.onload=function(){
    pg.firstChild.style.width='60%';
    api('uploadActivity',{code:S.code,activityId:id,fileName:f.name,mimeType:f.type,base64:r.result.split(',')[1]})
      .then(function(){ pg.firstChild.style.width='100%'; toast('تم تسليم النشاط'); load(); })
      .catch(function(e){

        $('aerr'+i).innerHTML='<div class="err">'+esc(e.message)+'</div>';
      });
  };
  r.readAsDataURL(f);
}

function submitAttendance(){

        h+='<div class="err" style="margin-top:10px"><b>أسماء غير مطابقة ('+r.unmatched.length+') — راجعها:</b><br>'+
           r.unmatched.map(esc).join('<br>')+'</div>';
      }
      if(r.atCap && r.atCap.length){
        h+='<div class="note" style="margin-top:10px"><b>بلغوا سقف 5 نقاط، لم يُضف لهم شيء:</b><br>'+
           r.atCap.map(esc).join('<br>')+'</div>';
      }
      box.innerHTML=h;
      if(!r.unmatched.length) $('attT').value='';
      toast('سُجّل حضور '+r.recorded+' طالباً');
    }).catch(function(e){ toast(e.message); });
}

/**
 * تصحيح دفعي: كل الدرجات تُدخَل محلياً بلا أي حفظ وسيط (لا استدعاء API
 * لكل تسليم على حدة كما كان سابقاً)، ثم زر واحد "حفظ الكل" يرسلها دفعة
 * واحدة. البطاقات كلها مفتوحة افتراضياً لتسريع الإدخال المتتالي.
 */
function subsHtml(){
  if(!curSubs.length) return '<div class="empty">لا توجد تسليمات لهذا الواجب بعد.</div>';
  var a=asgById(curAsg);
  var h='<div class="card"><div class="row"><h3>حفظ دفعي</h3>'+
    '<span class="meta">'+curSubs.length+' تسليم</span></div>'+
    '<div class="note">أدخل كل الدرجات بلا أي حفظ وسيط، ثم اضغط «حفظ الكل» مرة واحدة أسفل الصفحة.</div>'+
    '<button class="btn" onclick="saveAllGrades()">حفظ الكل</button>'+
    '<div id="bulkResult"></div></div>';

  h+=curSubs.map(function(s,i){
    var done=hasGrade(s);
    return '<div class="card"><div class="row">'+
      '<div><h3>'+esc(s.name)+'</h3><div class="meta">'+esc(s.code)+' · '+
      fmtDate(s.submittedAt)+' · '+esc(s.status||'')+'</div></div>'+
      (done?'<span class="pill ok">'+s.total+' / '+a.maxScore+' (مصحَّح سابقاً)</span>'
           :'<span class="pill wait">بانتظار التصحيح</span>')+'</div>'+
      (s.fileUrl?'<div class="stack"><a class="btn sm ghost" style="text-decoration:none" href="'+esc(s.fileUrl)+
        '" target="_blank" rel="noopener">فتح الملف</a></div>':'')+
      gradeForm(a,s,i)+'</div>';
  }).join('');

  h+='<div class="card"><button class="btn" onclick="saveAllGrades()">حفظ الكل</button><div id="bulkResult2"></div></div>';
  return h;
}

function gradeForm(a,s,i){
  var h='<div class="scorecard" style="margin-top:14px"><div class="sc-body">';
  a.criteria.forEach(function(c){
    var v = s.scores[c.criterionId]!=null ? s.scores[c.criterionId] : '';
    h+='<div class="crit"><div class="crit-top"><span class="crit-name">'+esc(c.criterion)+
      '</span><span class="crit-pts">من '+c.maxPoints+'</span></div>'+
      (c.guide?'<div class="crit-note">'+esc(c.guide)+'</div>':'')+
      '<input type="number" min="0" max="'+c.maxPoints+'" step="0.5" style="margin-top:8px" id="p'+
      i+'_'+c.criterionId+'" value="'+v+'" placeholder="0"></div>';
  });
  return h+'</div></div><label for="fb'+i+'">ملاحظاتك للطالب</label>'+
    '<textarea id="fb'+i+'" placeholder="ما أحسنه، وما يحتاج تحسيناً تحديداً">'+esc(s.feedback||'')+'</textarea>';
}

/** يجمع كل الدرجات المُدخَلة محلياً بلا حفظ وسيط، ويرسلها دفعة واحدة */
function saveAllGrades(){
  var a=asgById(curAsg);
  if(!a || !curSubs.length){ toast('لا يوجد شيء للحفظ'); return; }

  var items=[], bad=false;
  curSubs.forEach(function(s,i){
    var scores={}, touched=false;
    a.criteria.forEach(function(c){
      var el=$('p'+i+'_'+c.criterionId);
      if(!el) return;
      var v=parseFloat(el.value);
      if(el.value!=='' && !isNaN(v)) touched=true;
      if(isNaN(v)) v=0;
      if(v>c.maxPoints){ bad=true; el.style.borderColor='var(--danger)'; }
      scores[c.criterionId]=v;
    });
    // نرسل فقط التسليمات التي أُدخلت لها درجة فعلاً، أو كانت مصحَّحة سابقاً (لتحديث الملاحظة)
    if(touched || hasGrade(s)){
      var fbEl=$('fb'+i);
      items.push({submissionId:s.id, scores:scores, feedback: fbEl?fbEl.value:(s.feedback||'')});
    }
  });

  if(bad){ toast('توجد درجة تتجاوز الحد الأقصى لمعيارها — راجع الحقول الحمراء'); return; }
  if(!items.length){ toast('أدخل درجة واحدة على الأقل'); return; }

  api('gradeSubmissionsBulk',{code:S.code,items:items})
    .then(function(r){
      var msg='حُفظ '+r.saved+' من '+items.length+(r.failed?' — فشل '+r.failed:'');
      toast(msg);
      var box=$('bulkResult')||$('bulkResult2');
      if(box && r.failed){
        box.innerHTML='<div class="err" style="margin-top:10px">'+
          r.results.filter(function(x){return !x.ok;}).map(function(x){
            return esc(x.submissionId)+': '+esc(x.error);
          }).join('<br>')+'</div>';
      }
      loadSubs(curAsg);
      api('teacherData',{code:S.code}).then(function(d){ S.data=d; });
    }).catch(function(e){ toast(e.message); });
}

function addCrit(n,m){

function createAsg(){
  var title=$('aT').value.trim();
  if(!title){ toast('اكتب عنوان الواجب'); return; }
  var names=document.querySelectorAll('.cName'), maxs=document.querySelectorAll('.cMax'), criteria=[];
  for(var i=0;i<names.length;i++){
    var n=names[i].value.trim(), m=parseFloat(maxs[i].value);
    if(n && !isNaN(m)) criteria.push({criterion:n,maxPoints:m,guide:''});
  }
  if(!criteria.length){ toast('أضف معياراً واحداً على الأقل'); return; }

  var obj={ title:title, description:$('aD').value, due:$('aDue').value,
            published:$('aPub').checked, counts:$('aCnt').checked, criteria:criteria };
  var wasEdit=!!editAsg;
  if(wasEdit){
    obj.id=editAsg.id;
    var old=editAsg.criteria||[], changed=(old.length!==criteria.length);
    if(!changed) for(var k=0;k<old.length;k++)
      if(old[k].criterion!==criteria[k].criterion || Number(old[k].maxPoints)!==Number(criteria[k].maxPoints)) changed=true;
    if(changed && editAsg.graded &&
       !confirm('غيّرت معايير الروبرك، ويوجد '+editAsg.graded+' تسليم مُصحَّح بالمعايير القديمة.\n\n'+

  }

  api('saveAssignment',{code:S.code,obj:obj})
    .then(function(){ toast(wasEdit?'حُدّث الواجب':'حُفظ الواجب'); editAsg=null; load(); })
    .catch(function(e){ toast(e.message); });
}

function startEdit(kind,id){
  var list=(kind==='lecture'?S.data.lectures:S.data.assignments)||[];
  var item=list.filter(function(x){ return x.id===id; })[0];
  if(!item){ toast('العنصر غير موجود'); return; }
  if(kind==='lecture'){ editLec=item; editAsg=null; } else { editAsg=item; editLec=null; }
  render();

    var f=$(kind==='lecture'?'lecForm':'asgForm');
    if(f) f.scrollIntoView({behavior:'smooth',block:'start'});
  },30);
}

function cancelEdit(){ editAsg=null; editLec=null; render(); }

function delItem(kind,id){
  var isLec=(kind==='lecture');
  var list=(isLec?S.data.lectures:S.data.assignments)||[];
  var item=list.filter(function(x){ return x.id===id; })[0];
  if(!item) return;
  var msg='نقل '+(isLec?'الأسبوع':'الواجب')+' «'+item.title+'» إلى سلة المحذوفات؟';
  if(!isLec && item.submitted)
    msg+='\n\nتنبيه: مرتبط به '+item.submitted+' تسليم'+
         (item.graded?' ('+item.graded+' مُصحَّح)':'')+'، وستُخفى معه.';
  msg+='\n\nلا شيء يُمحى نهائياً — يمكن استرجاعه من سلة المحذوفات أسفل الصفحة.';
  if(!confirm(msg)) return;

  api('deleteItem',{code:S.code,kind:kind,id:id,value:true})
    .then(function(){
      toast('نُقل إلى سلة المحذوفات');
      if(isLec && editLec && editLec.id===id) editLec=null;
      if(!isLec && editAsg && editAsg.id===id) editAsg=null;
      trashCache=null; load();
    }).catch(function(e){ toast(e.message); });
}

    '<tr><td>الحضور</td><td class="num">5</td></tr>'+
    '</tbody></table></div>'+
    '<div class="note">النوع «امتحان» يدخل الـ20، والنوع «كويز» يدخل الـ5 كنسبة من مجموع كل الأسئلة. '+
    'الحضور يُسجَّل من تبويب «الحضور» ويدخل الـ5 كنقاط مباشرة لا نسبة. '+
    'الأنواع الأخرى تُعرض للطالب خارج التوزيع.</div></div>';

  h+='<div class="card"><h3>الإضافي (فوق الأساسي، سقفه الكلي 12، ولا يتجاوز المجموع 40)</h3>'+
    '<div class="tblwrap"><table><tbody>'+
    '<tr><td>مكافأة يدوية (هذا القسم)</td><td class="num">حتى 5</td></tr>'+
    '<tr><td>شكر وتقدير (أدناه)</td><td class="num">حتى 3</td></tr>'+
    '<tr><td>الأنشطة الثلاثة (تبويب «الأنشطة والقصص»)</td><td class="num">حتى 3</td></tr>'+
    '<tr><td>قصة النجاح (تبويب «الأنشطة والقصص»)</td><td class="num">حتى 1</td></tr>'+
    '</tbody></table></div></div>';

  h+='<div class="card"><h3>مكافأة</h3>'+
    '<div class="note">بين 0.5 و5 لكل طالب. الخادم يرفض ما يتجاوز السقف.</div>'+
    '<div class="grid2"><div><label for="bC">رمز الطالب</label>'+
    '<input type="text" id="bC" placeholder="AC34FG" style="letter-spacing:.08em;text-transform:uppercase"></div>'+
    '<div><label for="bA">المقدار</label><select id="bA">'+
    '<option>0.5</option><option>1</option><option>1.5</option><option>2</option>'+
    '<option>2.5</option><option>3</option><option>3.5</option><option>4</option>'+
    '<option>4.5</option><option>5</option></select></div></div>'+
    '<label for="bR">السبب (اختياري)</label>'+
    '<input type="text" id="bR" placeholder="مثال: مشاركة متميزة في الأسبوع الثالث">'+
    '<button class="btn" style="margin-top:14px" onclick="giveBonus()">إضافة المكافأة</button>';

  if(bonusCache && bonusCache.length){
    h+='<div class="meta" style="margin-top:18px">الممنوحة حتى الآن ('+bonusCache.length+' طالب):</div>'+
      '<div class="tblwrap"><table><thead><tr><th>الطالب</th><th class="num">المجموع</th>'+
      '<th>الأسباب</th></tr></thead><tbody>'+
      bonusCache.map(function(b){
        return '<tr><td>'+esc(b.name)+'<div class="meta">'+esc(b.code)+'</div></td>'+
          '<td class="num">'+b.total+'</td><td class="meta">'+
          esc(b.items.map(function(i){ return i.amount+(i.reason?' ('+i.reason+')':''); }).join(' · '))+
          '</td></tr>';
      }).join('')+'</tbody></table></div>';
  }
  h+='</div>';

  h+='<div class="card"><h3>شكر وتقدير</h3>'+
    '<div class="note">1 درجة ثابتة لكل مرة، سقف 3 لكل طالب — منفصل تماماً عن المكافأة أعلاه.</div>'+
    '<label for="prC">رمز الطالب</label>'+
    '<input type="text" id="prC" placeholder="AC34FG" style="letter-spacing:.08em;text-transform:uppercase">'+
    '<label for="prR">السبب (إلزامي)</label>'+
    '<input type="text" id="prR" placeholder="مثال: تميّز بالإجابة الصفّية">'+
    '<button class="btn" style="margin-top:14px" onclick="giveAppreciation()">منح شكر وتقدير (+1)</button></div>';

  return h+'<div class="card"><h3>رصد درجات دفعة واحدة</h3>'+
    '<div class="note">اكتب كل طالب في سطر: <b>الرمز</b> ثم مسافة ثم <b>الدرجة</b>.<br>مثال:<br>AC34FG 8<br>KM7PQR 9.5</div>'+
    '<label for="gI">اسم البند</label><input type="text" id="gI" placeholder="مثال: كويز الأسبوع الثالث">'+
    '<div class="grid2"><div><label for="gT">النوع</label><select id="gT">'+
    '<option>امتحان</option><option>كويز</option><option>مشاركة</option><option>أخرى</option></select></div>'+
    '<div><label for="gM">الدرجة القصوى</label><input type="number" id="gM" value="10" step="0.5"></div></div>'+
    '<label for="gL">الرموز والدرجات</label>'+
    '<textarea id="gL" style="min-height:150px" placeholder="AC34FG 8"></textarea>'+
    '<button class="btn" style="margin-top:14px" onclick="bulkGrades()">رصد الدرجات</button></div>';
}

function giveBonus(){
  var c=$('bC').value.trim();
  if(!c){ toast('اكتب رمز الطالب'); return; }
  api('addBonus',{code:S.code,target:c,amount:$('bA').value,reason:$('bR').value.trim()})
    .then(function(r){
      toast('مكافأة '+r.name+' — مجموعه الآن '+r.total);
      $('bC').value=''; $('bR').value=''; bonusCache=null; render();
    }).catch(function(e){ toast(e.message); });
}

function giveAppreciation(){
  var c=$('prC').value.trim();
  if(!c){ toast('اكتب رمز الطالب'); return; }
  var r=$('prR').value.trim();
  if(!r){ toast('اكتب السبب'); return; }
  api('addAppreciation',{code:S.code,target:c,reason:r})
    .then(function(res){
      toast('شكر وتقدير لـ'+res.name+' — مجموعه الآن '+res.total);
      $('prC').value=''; $('prR').value=''; bonusCache=null; render();
    }).catch(function(e){ toast(e.message); });
}

function bulkGrades(){
  var item=$('gI').value.trim();
  if(!item){ toast('اكتب اسم البند'); return; }
  api('bulkGrades',{code:S.code,item:item,type:$('gT').value,maxScore:$('gM').value,text:$('gL').value})
    .then(function(r){ toast('رُصدت '+r.count+' درجة'); $('gL').value=''; })
    .catch(function(e){ toast(e.message); });
}

/* ═══ الإعلان ورابط الاختبار — تحكّم المدرّس ═══ */
var stg=null;
function settingsView(){
  if(stg===null){
    api('settings',{code:S.code}).then(function(d){ stg=d; render(); })
      .catch(function(e){ toast(e.message); });
    return '<div class="card"><div class="meta">جارٍ تحميل الإعدادات…</div></div>';
  }
  return '<div class="card"><h3>الإعلان العام</h3>'+
    '<div class="note">يظهر شريطاً أعلى صفحة كل طالب. يراه عند فتح المنصة أو ضغط «تحديث».</div>'+
    '<textarea id="annT" placeholder="مثال: لقاء الأحد القادم في القاعة الكبرى">'+esc(stg.announce||'')+'</textarea>'+
    '<div class="check"><input type="checkbox" id="annOn"'+(stg.announceOn?' checked':'')+'>'+
    '<label for="annOn" style="margin:0">إظهاره للطلبة الآن</label></div>'+
    '<button class="btn" style="margin-top:14px" onclick="saveAnn()">حفظ الإعلان</button></div>';
}

function saveAnn(){
  api('saveSettings',{code:S.code,obj:{announce:$('annT').value,announceOn:$('annOn').checked}})
    .then(function(r){ stg=r.settings; toast('حُفظ الإعلان'); render(); })
    .catch(function(e){ toast(e.message); });
}

/* ═══ الاختيار العشوائي ═══ */
var picked=[], pickSec='';
function pickView(){
  var St=(S.data.students||[]).filter(function(s){ return s.active!==false; });
  var secs=[]; St.forEach(function(s){ if(s.section && secs.indexOf(s.section)<0) secs.push(s.section); });
  secs.sort();
  var pool=St.filter(function(s){ return !pickSec || s.section===pickSec; });
  var left=pool.filter(function(s){ return picked.indexOf(s.code)<0; });

  var h='<div class="card"><div class="row"><h3>اختيار عشوائي</h3>'+
    '<span class="meta">'+left.length+' من '+pool.length+' متبقٍ</span></div>'+
    '<div class="note">لا يتكرر الاسم حتى تنتهي القائمة أو تُصفّرها.</div>';

  if(secs.length>1){
    h+='<label for="pkSec">الشعبة</label><select id="pkSec" onchange="pickSec=this.value;picked=[];render()">'+
      '<option value=""'+(pickSec?'':' selected')+'>الكل</option>'+
      secs.map(function(x){ return '<option value="'+esc(x)+'"'+(pickSec===x?' selected':'')+'>'+esc(x)+'</option>'; }).join('')+
      '</select>';
  }

  h+='<div class="stack" style="margin-top:14px">'+
    '<button class="btn sm" onclick="doPick()"'+(left.length?'':' disabled')+'>اسحب اسماً</button>'+
    (picked.length?'<button class="btn sm ghost" onclick="picked.pop();render()">تراجع</button>'+
                   '<button class="btn sm ghost" onclick="picked=[];render()">تصفير</button>':'')+
    '</div>';

  if(lastPick) h+='<div class="pickbox"><div class="nm">'+esc(lastPick.name)+'</div>'+
    '<div class="sub">'+esc(lastPick.code)+(lastPick.section?' · شعبة '+esc(lastPick.section):'')+'</div></div>';

  if(picked.length>1){
    h+='<div class="meta" style="margin-top:14px">خرجت أسماؤهم ('+picked.length+'):</div>'+
      '<div style="font-size:14px;line-height:2">'+picked.map(function(c){
        var st=St.filter(function(x){return x.code===c;})[0];
        return st?esc(st.name):esc(c);
      }).join(' · ')+'</div>';
  }
  return h+'</div>';
}

var lastPick=null;
function doPick(){
  var St=(S.data.students||[]).filter(function(s){ return s.active!==false; });
  var pool=St.filter(function(s){ return (!pickSec||s.section===pickSec) && picked.indexOf(s.code)<0; });
  if(!pool.length){ toast('انتهت القائمة'); return; }
  var p=pool[Math.floor(Math.random()*pool.length)];
  picked.push(p.code); lastPick=p; render();
}

/* ═══ فكّ قفل رمز ═══ */
function unlockPrompt(){
  var c=prompt('اكتب رمز الطالب المراد فكّ قفله:');
  if(!c) return;
  api('unlockCode',{code:S.code,target:c.trim()})
    .then(function(){ toast('فُكّ القفل عن '+c.trim().toUpperCase()); })
    .catch(function(e){ toast(e.message); });
}

function studentsAdminView(){
  var St=S.data.students||[];
  var h=settingsView()+pickView()+
    '<div class="card"><div class="row"><h3>قفل الدخول</h3>'+
    '<button class="btn sm ghost" onclick="unlockPrompt()">فكّ قفل رمز</button></div>'+
    '<div class="note">يُقفل الرمز 30 دقيقة بعد 5 محاولات خاطئة. استخدم الزر للفكّ الفوري.</div></div>'+
    '<div class="card"><h3>إضافة طلبة</h3>'+
    '<div class="note">اكتب كل طالب في سطر: <b>الاسم</b> ثم فاصلة ثم <b>الشعبة</b> (اختيارية).<br>ستُولَّد الرموز تلقائياً.</div>'+
    '<textarea id="stL" style="min-height:150px" placeholder="أحمد علي, أ&#10;سارة محمد, ب"></textarea>'+
    '<button class="btn" style="margin-top:14px" onclick="addSt()">إضافة وتوليد الرموز</button>'+
    '<div id="newCodes"></div></div>';

  h+='<div class="card"><div class="row"><h3>الطلبة المسجلون</h3>'+
    '<span class="meta">'+St.length+' طالب</span></div><div class="tblwrap"><table><thead><tr>'+
    '<th>الرمز</th><th>الاسم</th><th>الشعبة</th></tr></thead><tbody>'+
    St.map(function(s){
      return '<tr><td style="font-weight:600;letter-spacing:.06em">'+esc(s.code)+'</td><td>'+
        esc(s.name)+'</td><td>'+esc(s.section||'—')+'</td></tr>';
    }).join('')+'</tbody></table></div></div>';
  return h;
}

function addSt(){
  var t=$('stL').value.trim();
  if(!t){ toast('اكتب أسماء الطلبة'); return; }
  api('addStudents',{code:S.code,text:t}).then(function(r){
    var rows=r.added.map(function(a){ return a.name+'\t'+a.code; }).join('\n');
    $('newCodes').innerHTML='<label>الرموز الجديدة — انسخها وأرسلها لكل طالب</label>'+
      '<textarea style="min-height:160px;font-family:monospace" readonly>'+esc(rows)+'</textarea>';
    $('stL').value='';
    toast('أُضيف '+r.added.length+' طالب');
    api('teacherData',{code:S.code}).then(function(d){ S.data=d; });
  }).catch(function(e){ toast(e.message); });
}
</script>
