<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نتائج مادة الحوسبة السحابية</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container { width: 100%; max-width: 560px; }

        .card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 40px 35px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        .logo { text-align: center; margin-bottom: 28px; }
        .logo-icon {
            width: 80px; height: 80px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 14px;
            font-size: 35px;
            box-shadow: 0 10px 30px rgba(102,126,234,0.4);
        }
        .logo h1 { color: #fff; font-size: 22px; font-weight: 700; margin-bottom: 4px; }
        .logo p  { color: rgba(255,255,255,0.5); font-size: 13px; }

        /* ── notice banner ── */
        .notice {
            background: linear-gradient(135deg,rgba(255,193,7,0.15),rgba(255,193,7,0.05));
            border: 1px solid rgba(255,193,7,0.35);
            border-radius: 14px;
            padding: 12px 16px;
            margin-bottom: 22px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }
        .notice-icon { font-size: 20px; flex-shrink: 0; margin-top: 1px; }
        .notice-text { font-size: 13px; color: rgba(255,255,255,0.85); line-height: 1.6; }
        .notice-text strong { color: #ffd200; }

        .input-group { margin-bottom: 18px; }
        .input-group label {
            display: block; color: rgba(255,255,255,0.8);
            font-size: 14px; margin-bottom: 10px; font-weight: 500;
        }
        .input-wrapper input {
            width: 100%; padding: 16px 20px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 14px; color: #fff;
            font-size: 18px; font-family: 'Courier New', monospace;
            text-align: center; letter-spacing: 3px;
            text-transform: uppercase; outline: none;
            transition: all 0.3s ease;
        }
        .input-wrapper input::placeholder {
            color: rgba(255,255,255,0.3); letter-spacing: 1px;
            font-size: 14px; font-family: 'Segoe UI', sans-serif;
        }
        .input-wrapper input:focus {
            border-color: #667eea;
            background: rgba(102,126,234,0.1);
            box-shadow: 0 0 0 3px rgba(102,126,234,0.2);
        }

        .btn {
            width: 100%; padding: 16px;
            background: linear-gradient(135deg,#667eea,#764ba2);
            border: none; border-radius: 14px; color: #fff;
            font-size: 16px; font-weight: 700; cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(102,126,234,0.4);
            letter-spacing: 1px;
        }
        .btn:hover  { transform: translateY(-2px); box-shadow: 0 12px 35px rgba(102,126,234,0.5); }
        .btn:active { transform: translateY(0); }

        .result {
            display: none; margin-top: 22px;
            border-radius: 18px; overflow: hidden;
            animation: slideUp 0.4s ease;
        }
        @keyframes slideUp {
            from { opacity:0; transform:translateY(20px); }
            to   { opacity:1; transform:translateY(0); }
        }

        .result-header {
            padding: 20px 25px;
            display: flex; align-items: center; gap: 15px;
        }
        .result-header .icon {
            width: 50px; height: 50px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px; flex-shrink: 0;
        }
        .result-header .info h3 { font-size: 13px; opacity: 0.8; margin-bottom: 3px; }
        .result-header .info h2 { font-size: 17px; font-weight: 700; }

        .result-body {
            padding: 20px 25px 25px;
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
        }
        .info-box {
            border-radius: 12px; padding: 15px; text-align: center;
        }
        .info-box .label { font-size: 11px; opacity: 0.7; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }
        .info-box .value { font-size: 20px; font-weight: 800; }
        .info-box.full   { grid-column: 1 / -1; }

        /* updated badge */
        .updated-badge {
            display: inline-block;
            background: rgba(255,193,7,0.2);
            border: 1px solid rgba(255,193,7,0.5);
            border-radius: 20px;
            padding: 3px 10px;
            font-size: 11px;
            color: #ffd200;
            margin-top: 6px;
        }

        .result.success .result-header { background: linear-gradient(135deg,#11998e,#38ef7d); color: #fff; }
        .result.success .result-header .icon { background: rgba(255,255,255,0.2); }
        .result.success .result-body {
            background: rgba(56,239,125,0.05);
            border: 1px solid rgba(56,239,125,0.15); border-top: none;
        }
        .result.success .info-box {
            background: rgba(56,239,125,0.08);
            border: 1px solid rgba(56,239,125,0.2); color: #fff;
        }

        .score-display { font-size: 52px !important; font-weight: 900 !important; line-height: 1; }
        .score-10  { color: #38ef7d; }
        .score-9   { color: #56ab2f; }
        .score-8   { color: #a8e063; }
        .score-7   { color: #f7971e; }
        .score-6   { color: #fda085; }
        .score-low { color: #ff6b6b; }

        .result.error .result-header { background: linear-gradient(135deg,#ff416c,#ff4b2b); color:#fff; }
        .result.error .result-header .icon { background: rgba(255,255,255,0.2); }
        .result.error .result-body {
            background: rgba(255,65,108,0.05);
            border: 1px solid rgba(255,65,108,0.2); border-top: none;
            color: rgba(255,255,255,0.7); text-align: center;
            font-size: 14px; line-height: 1.7;
        }

        .result.warning .result-header { background: linear-gradient(135deg,#f7971e,#ffd200); color:#1a1a2e; }
        .result.warning .result-header .icon { background: rgba(0,0,0,0.15); }
        .result.warning .result-body {
            background: rgba(255,193,7,0.05);
            border: 1px solid rgba(255,193,7,0.2); border-top: none;
            color: rgba(255,255,255,0.85); text-align: center;
            font-size: 14px; line-height: 1.9; padding: 25px;
        }

        .footer {
            text-align: center; margin-top: 22px;
            color: rgba(255,255,255,0.25); font-size: 12px;
        }
    </style>
</head>

function getScoreClass(s){
  if(s===10)return'score-10';if(s===9)return'score-9';
  if(s===8)return'score-8';if(s===7)return'score-7';
  if(s===6)return'score-6';return'score-low';
}
function getScoreEmoji(s){
  if(s===10)return'🏆';if(s>=8)return'🌟';
  if(s>=6)return'✅';if(s>=4)return'⚠️';return'❌';
}
function getScoreLabel(s){
  if(s===10)return'ممتاز';if(s===9)return'جيد جداً';
  if(s===8)return'جيد جداً';if(s===7)return'جيد';
  if(s===6)return'مقبول';if(s>=1)return'ضعيف';return'صفر';
}

function checkResult(){
  const input=document.getElementById('codeInput').value.trim().toUpperCase();
  const resultDiv=document.getElementById('result');
  if(!input){resultDiv.style.display='none';return;}

  const student=students[input];

  if(student){
    if(student.score===null){
      resultDiv.className='result warning';
      resultDiv.innerHTML=`
        <div class="result-header">
          <div class="icon">📋</div>
          <div class="info"><h3>الطالب مسجل في القوائم</h3><h2>${student.name}</h2></div>
        </div>
        <div class="result-body">
          <p>رمزك <strong style="color:#ffd200;font-size:16px;">${input}</strong>
          مسجل في الشعبة <strong style="color:#ffd200;">${student.shift} ${student.section}</strong><br><br>
          🚫 <strong style="color:#ffd200;">غير ممتحن</strong><br><br>
          يرجى مراجعة الأستاذ لمعرفة السبب</p>
        </div>`;
      resultDiv.style.display='block';return;
    }

    const sc=getScoreClass(student.score);
    const em=getScoreEmoji(student.score);
    const lb=getScoreLabel(student.score);
    const wasUpdated=updated.has(input);

    resultDiv.className='result success';
    resultDiv.innerHTML=`
      <div class="result-header">
        <div class="icon">✅</div>
        <div class="info"><h3>تم العثور على نتيجتك</h3><h2>${student.name}</h2></div>
      </div>
      <div class="result-body">
        <div class="info-box full" style="text-align:center;padding:20px;">
          <div class="label">الدرجة النهائية من 10</div>
          <div class="value score-display ${sc}">${student.score}</div>
          <div style="margin-top:8px;font-size:14px;opacity:0.8;">${em} ${lb}</div>
                 </div>
        <div class="info-box">
          <div class="label">الرمز</div>
          <div class="value" style="font-size:18px;font-family:monospace;">${input}</div>
        </div>
        <div class="info-box">
          <div class="label">الشعبة</div>
          <div class="value" style="font-size:18px;">${student.shift} ${student.section}</div>
        </div>
      </div>`;
  } else {
    resultDiv.className='result error';
    resultDiv.innerHTML=`
      <div class="result-header">
        <div class="icon">❌</div>
        <div class="info"><h3>الرمز غير موجود</h3><h2>لم يتم العثور على نتيجة</h2></div>
      </div>
      <div class="result-body">
        <p>الرمز <strong style="color:#fff;">"${input}"</strong> غير مسجل في قاعدة البيانات.<br>
        تأكد من إدخال الرمز بشكل صحيح<br>
        مثال: <strong style="color:#fff;">A-01</strong> أو <strong style="color:#fff;">I-15</strong></p>
      </div>`;
  }
  resultDiv.style.display='block';
}

document.getElementById('codeInput').addEventListener('keypress',function(e){if(e.key==='Enter')checkResult();});
document.getElementById('codeInput').addEventListener('input',function(){
  const p=this.selectionStart;this.value=this.value.toUpperCase();this.setSelectionRange(p,p);
});
