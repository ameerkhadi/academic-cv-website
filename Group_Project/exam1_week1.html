<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>امتحان الأسبوع الأول · مشروع المجموعة ٢</title>
<style>
:root{--bg:#f2f6f7;--card:#fff;--ink:#1c2a31;--mut:#5b6b73;--ac:#0f6b6b;--ac2:#e3f0f0;--ok:#1f8a4c;--okb:#e1f5e9;--no:#c0392b;--nob:#fde8e5;--bd:#d6e0e3}
@media(prefers-color-scheme:dark){:root{--bg:#10181b;--card:#182226;--ink:#e6eef0;--mut:#9fb0b6;--ac:#5fc4c4;--ac2:#1d3033;--ok:#55d08a;--okb:#16301f;--no:#ff8b7d;--nob:#35191a;--bd:#2b3b40}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.8 "Segoe UI",Tahoma,"Noto Naskh Arabic",sans-serif}
.w{max-width:720px;margin:auto;padding:16px}
h1{font-size:1.3rem;color:var(--ac);margin:8px 0}
.bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .3s}
.meta{display:flex;justify-content:space-between;color:var(--mut);font-size:.9rem;margin:6px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:18px}
.lv{display:inline-block;padding:0 10px;border-radius:12px;background:var(--ac2);color:var(--ac);font-size:.85rem}
.q{font-weight:700;margin:10px 0}
.o{display:block;width:100%;text-align:right;font:inherit;color:inherit;background:var(--card);border:2px solid var(--bd);border-radius:8px;padding:10px 14px;margin:8px 0;cursor:pointer}
.o:hover:not(:disabled){border-color:var(--ac)}
.o:focus-visible,.btn:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.o.ok{border-color:var(--ok);background:var(--okb)}
.o.no{border-color:var(--no);background:var(--nob)}
.o:disabled{cursor:default}
.ex{margin-top:12px;padding:10px 14px;border-radius:8px;background:var(--ac2);display:none}
.btn{font:inherit;background:var(--ac);color:#fff;border:0;border-radius:8px;padding:9px 24px;margin-top:14px;cursor:pointer}
.big{font-size:2.4rem;font-weight:700;color:var(--ac);text-align:center}
.rv{border-top:1px solid var(--bd);padding:10px 0}
.rv small{color:var(--mut)}
</style>
</head>
<body>
<div class="w">
<h1>امتحان الأسبوع الأول: تشكيل الفرق وتوزيع الأدوار</h1>
<div class="bar"><i id="pb"></i></div>
<div class="meta"><span id="pos"></span><span id="sc"></span></div>
<div id="app" class="card"></div>
</div>
<script>
// [السؤال، [الخيارات]، رقم الصحيحة، التعليل] — من السهل إلى الصعب
const Q=[
["كم مرحلة يضم نموذج تاكمان بعد إضافة مرحلة الإنهاء؟",["أربع","خمس","ست","ثلاث"],1,"بدأ النموذج بأربع مراحل عام ١٩٦٥، ثم أُضيفت مرحلة الإنهاء عام ١٩٧٧ فصارت خمسًا."],
["من صاحب نموذج مراحل نمو الفريق (التكوين، الاصطدام…)؟",["Belbin","Tuckman","Scrum","PMI"],1,"Bruce Tuckman اقترحه عام ١٩٦٥."],
["أي مرحلة في نموذج تاكمان تتسم عادةً بظهور الخلافات؟",["التكوين","الاصطدام","الاستقرار","الأداء"],1,"في الاصطدام تظهر خلافات شخصية وتباين في الرأي حول المجموعة وأهدافها."],
["كم عدد الأدوار في نموذج بيلبن؟",["ستة","سبعة","تسعة","اثنا عشر"],2,"طوّر بيلبن تسعة أدوار عام ١٩٨١."],
["كم مجموعة عمليات في دورة حياة المشروع عند PMI؟",["ثلاث","أربع","خمس","سبع"],2,"البدء، التخطيط، التنفيذ، المراقبة والضبط، الإغلاق."],
["ما الحجم الأمثل لفريق المشروع الطلابي بحسب عدة دراسات؟",["٢–٣ طلاب","٤–٦ طلاب","١٠–١٢ طالبًا","أكثر من عشرين"],1,"رجّحت دراسات عدة نطاق أربعة إلى ستة طلاب."],
["أي مجموعات العمليات تأتي أولًا في دورة الحياة؟",["التخطيط","التنفيذ","البدء","الإغلاق"],2,"البدء يتضمن ميثاق المشروع وسجل أصحاب المصلحة وتحديد أدوار الفريق."],
["ماذا يضم فريق سكرم إلى جانب مسؤول المنتج؟",["مسؤول سكرم ومطوّرين","مدير مشروع ومحللين","قائد فريق ومختبرين","عميلًا ومموّلًا"],0,"يتألف من مسؤول عن المنتج، ومسؤول عن سكرم، ومطوّرين."],
["أي أداة تعاون برمجي ذُكرت في المحاضرة؟",["Photoshop","Excel","GitHub","AutoCAD"],2,"GitHub بسير عمل خفيف قائم على الفروع."],
["من المسؤول عن تعظيم قيمة المنتج في سكرم؟",["Developers","Scrum Master","Product Owner","الجميع بالتساوي"],2,"هذه مسؤولية Product Owner."],
["ما «الركوب المجاني»؟",["أن ينال العضو الدرجة عن عمل غيره وهو لا يعمل شيئًا يُذكر","أن يتولى العضو كل الأعمال وحده","أن يغيب عن الاجتماعات بعذر","أن يستعين الفريق بمصدر خارجي"],0,"هو الحالة القصوى من التكاسل الاجتماعي."],
["كيف يُعرَّف «الدور» في نموذج بيلبن؟",["منصب رسمي يمنحه الأستاذ","نمط ميل في السلوك والإسهام والتفاعل مع الآخرين","مهمة تقنية ثابتة","درجة وظيفية"],1,"الدور ميل سلوكي لا لقب."],
["إلى من يوجَّه ميثاق الفريق؟",["إلى الجهة الخارجية","إلى داخل الفريق","إلى الأستاذ وحده","إلى لجنة التقييم"],1,"الميثاق وثيقة داخلية، بخلاف وثيقة نطاق العمل الموجَّهة إلى الخارج."],
["من يوقّع ميثاق الفريق؟",["قائد الفريق وحده","جميع الأعضاء","الأستاذ المشرف","لا يُوقَّع"],1,"يوقّعه جميع الأعضاء ويُراجَع باتفاقهم."],
["إلى أي عنقود من أدوار بيلبن ينتمي Co-ordinator؟",["العملي","الاجتماعي","الفكري","لا ينتمي لعنقود"],1,"العناقيد الاجتماعية: Co-ordinator وTeamworker وResource Investigator."],
["أي دور يقدّم أفكارًا أصيلة لمشكلات صعبة؟",["Shaper","Plant","Implementer","Teamworker"],1,"Plant من العنقود الفكري، وضعفه ضعف التواصل وإهمال التفاصيل."],
["ما الضعف المقبول لدور Completer Finisher؟",["قلة الحساسية","القلق الزائد والتردد في التفويض","ضعف التواصل","نقص الحماس"],1,"دقيق لكنه يقلق أكثر من اللازم ويتردد في التفويض."],
["ما الذي قد يعيد فريقًا بلغ الأداء إلى الاصطدام؟",["اقتراب نهاية الفصل","انضمام عضو جديد أو تكرر الغياب","إنجاز مهمة مبكرًا","كتابة الميثاق"],1,"تغيّر التكوين أو تكرر الغياب قد يعيد الاصطدام."],
["ما الذي غيّره دليل سكرم ٢٠٢٠ في المصطلحات؟",["استبدل «الأدوار» بـ«المسؤوليات»","استبدل «المسؤوليات» بـ«الأدوار»","استبدل «الفريق» بـ«المجموعة»","حذف مسؤول سكرم"],0,"تأكيدًا على عقلية الملكية والنتائج."],
["على أي أسئلة يقوم نموذج الميثاق المقتبس من مركز إيبرلي (كارنيغي ميلون)؟",["الأهداف، التوقعات، السياسات والإجراءات، العواقب","الميزانية، الجدول، المخاطر، الجودة","الأدوار، الأدوات، اللغات، الاختبارات","الزمن، التكلفة، النطاق، الموارد"],0,"أربعة أسئلة ثم توقيع جميع الأعضاء."],
["ماذا يفعل الأعضاء في مرحلة التكوين؟",["يتطلعون إلى القائد طلبًا للتوجيه","يتنازعون على الأدوار","يعتمدون على بعضهم تمامًا","يودّعون الفريق"],0,"يتعارفون ويتبيّنون المتوقَّع منهم."],
["ما نطاق الحجم الأمثل في بيانات صناعية عن مشاريع البرمجيات؟",["٣–٧ أشخاص","١٠–١٥ شخصًا","١–٢ شخص","٨–١٢ شخصًا"],0,"رجّحت البيانات الصناعية بين ثلاثة وسبعة."],
["ما الضعف المقبول لدور Resource Investigator؟",["مفرط في التفاؤل ويفقد اهتمامه بعد الحماس الأول","متردد في القرارات","بطيء أمام الفرص","يبالغ في النقد"],0,"متحمس يستكشف الفرص، لكن حماسه قد يخبو."],
["ما الفرق الأساسي بين ميثاق الفريق ووثيقة نطاق العمل؟",["الميثاق داخلي والنطاق موجَّه إلى الخارج","كلاهما وثيقة واحدة","الميثاق للعميل والنطاق للفريق","لا فرق في الغرض"],0,"ولا ينبغي أن يكرر الميثاق ما في وثيقة النطاق."],
["في سير عمل GitHub، أي أداة تُستعمل لطلب الملاحظات على التغييرات؟",["Issue","Pull Request","Commit فقط","Fork فقط"],1,"طلب الدمج أداة تواصل لكل الفريق وليس إجراءً تقنيًا فحسب."],
["ما الذي يرافق مرحلة الإنهاء؟",["شيء من القلق عند إغلاق المجموعة","ذروة الأداء","ظهور الخلافات","تشكيل الأدوار"],0,"أُضيفت مع Jensen عام ١٩٧٧."],
["متى طوّر بيلبن أدواره التسعة؟",["١٩٦٥","١٩٧٧","١٩٨١","٢٠٢٠"],2,"عام ١٩٨١ بعد تسع سنوات من الدراسة."],
["ماذا تشمل كلمة Developers في سكرم؟",["مبرمجي البرمجيات فقط","كل من يتولى تطوير إضافة ذات قيمة","المختبرين فقط","أعضاء الإدارة"],1,"لا تقتصر على مبرمجي البرمجيات."],
["ما العلاقة بين التكاسل الاجتماعي والركوب المجاني؟",["هما اسمان للشيء نفسه","الركوب المجاني حالة قصوى من التكاسل الاجتماعي","التكاسل أخطر من الركوب المجاني دائمًا","الركوب المجاني مفيد للفريق"],1,"التكاسل بذل جهد أقل مما يُبذل منفردًا، وإذا بلغ حدّ نيل الدرجة عن عمل الغير سُمّي ركوبًا مجانيًا."],
["فريق من خمسة أعضاء تطابقت تفضيلاتهم كلها على Plant. ما الاستنتاج الأدق؟",["الفريق مثالي","فجوة في أدوار أخرى (كالتنفيذ والإنجاز) يُقترح تغطيتها","يجب حلّ الفريق","لا معنى للنتيجة"],1,"النتيجة نتيجة: يُذكر التطابق صراحة مع تفسيره، وتُقترح تغطية الأدوار الغائبة."],
["ما الصحيح عن تسلسل مجموعات عمليات PMI الخطي؟",["يصدق دائمًا على كل الأساليب","يصدق على دورات الحياة التنبؤية، وفي الرشيقة تتكرر عمليات داخل كل دورة","لا يصدق على أي مشروع","يلغي مرحلة البدء"],1,"البدء والإغلاق يبقيان على مستوى المشروع كله."],
["لماذا لا يعني نموذج بيلبن أن يضم فريق من أربعة إلى ستة تسعة أشخاص؟",["لأن الأدوار تُدمج في أدوار سكرم","لأن المقصود تغطية الأدوار المهمة للمهمة، وقد يؤدي العضو أكثر من دور","لأن ثمانية أدوار فقط تُعتمد","لأن النموذج لا يصلح للطلبة"],1,"الفريق الأصغر يتنقل أعضاؤه بين الأدوار بحسب الحاجة."],
["ما الصحيح عن دراسة الطلبة السريلانكيين في تكوين الفرق؟",["أيّد الطلبة الاختيار الذاتي بقوة","لم يؤيّده الطلبة كثيرًا، مع تنبيه إلى اختلاف الثقافة","أثبتت أن العشوائي أفضل دائمًا","لم تتناول تكوين الفرق"],1,"يظل الحكم مرتبطًا بسياق كل مقرر."],
["أي العبارات أقرب إلى إرشادات الميثاق في المقرر الأسترالي؟",["يُكتب مرة واحدة دون تعديل","إعداده المشترك أهم من الوثيقة ويُعدَّل باتفاق الفريق","يكرر نطاق العمل","يوقّعه القائد نيابة عن الجميع"],1,"ويُحدَّد فيه هدف للفريق يختلف عن هدف المشروع."],
["فريق بلغ مرحلة الأداء ثم تكرر غياب بعض أعضائه. ما المتوقع؟",["يبقى في الأداء حتمًا","قد يعود إلى الاصطدام","ينتقل مباشرة إلى الإنهاء","يصبح ميثاقه باطلًا"],1,"الوصول إلى الأداء لا يضمن البقاء فيه."],
["قال مسؤول المنتج: «فوّضت العمل فلم أعد مسؤولًا». ما التصحيح وفق دليل سكرم؟",["صحيح تمامًا","قد يفوّض بعض العمل لكنه يبقى مسؤولًا","المسؤولية تنتقل إلى Scrum Master","المسؤولية تنتقل إلى الفريق كله"],1,"التفويض لا يُسقط المساءلة."],
["ما العلاج الأنسب للخلط بين «الدور» و«المنصب»؟",["إبقاء الأدوار ضمنية","تحديد ما يُساءَل عنه صاحب الدور وما يملك قراره","الاكتفاء بالتسمية","جعل الدور للقائد وحده"],1,"التسمية لا تغني عن تحديد المساءلة وصلاحية القرار."],
["ما الغرض الأساسي من جلسة التأمل الفردي في بداية المشروع؟",["كشف المتكاسلين ومعاقبتهم","اكتشاف تقسيم العمل غير العادل مبكرًا","تقييم الأستاذ للفريق","اختيار القائد"],1,"الغرض ليس كشف المتكاسلين بقدر اكتشاف الظلم في تقسيم العمل مبكرًا."],
["ما الاستنتاج من مشهد «الركّاب» و«السائقين» في المقرر الكبير؟",["يجب زيادة حجم الفريق","ألا يكون نطاق المشروع قابلًا للإنجاز دون إسهام كل عضو","يُستبعد الركّاب","لا علاقة بنطاق المشروع"],1,"الحجم الكبير لا يضمن إنجازًا أكبر."],
["أي العبارات الآتية تعبّر عن فهم خاطئ؟",["الاصطدام مرحلة معتادة من مراحل نمو الفريق","ظهور الخلاف في الأسابيع الأولى دليل قاطع على فشل الفريق","يُقصد بالميثاق أن يعين الفريق على عبور المراحل الأولى","دخول أعضاء جدد يستدعي دورة جديدة من المراحل"],1,"النموذج يعدّ الاصطدام مرحلة طبيعية، لا علامة فشل."]
];
const L=i=>i<14?"سهل":i<28?"متوسط":"صعب";
const $=id=>document.getElementById(id);
let i=0,score=0,res=[];
function show(){
 if(i>=Q.length)return end();
 const [q,o,a,e]=Q[i];
 $("pb").style.width=(i/Q.length*100)+"%";
 $("pos").textContent="السؤال "+(i+1)+" من "+Q.length;
 $("sc"). textContent="الدرجة: "+score;
 $("app").innerHTML='<span class="lv">'+L(i)+'</span><div class="q">'+q+'</div><div id="opts"></div><div class="ex" id="ex"></div><div id="nx"></div>';
 o.forEach((t,k)=>{const b=document.createElement("button");b.className="o";b.textContent=t;b.onclick=()=>pick(k);$("opts").appendChild(b)});
}
function pick(k){
 const [q,o,a,e]=Q[i];
 const bs=[...document.querySelectorAll(".o")];
 bs.forEach((b,j)=>{b.disabled=true;if(j==a)b.classList.add("ok");else if(j==k)b.classList.add("no")});
 if(k==a)score++;
 res.push(k);
 $("sc").textContent="الدرجة: "+score;
 const ex=$("ex");ex.style.display="block";
 ex.innerHTML="<b>"+(k==a?"إجابة صحيحة. ":"إجابة خاطئة. الصحيحة: «"+o[a]+"». ")+"</b>"+e;
 $("nx").innerHTML='<button class="btn" id="nb">'+(i==Q.length-1?"عرض النتيجة":"السؤال التالي")+'</button>';
 $("nb").onclick=()=>{i++;show()};$("nb").focus();
}
function end(){
 $("pb").style.width="100%";$("pos").textContent="انتهى الامتحان";
 const p=Math.round(score/Q.length*100);
 let h='<div class="big">'+score+' / '+Q.length+'</div><p style="text-align:center">النسبة '+p+'٪</p>';
 let bad=0;
 Q.forEach((x,n)=>{if(res[n]!=x[2]){bad++;h+='<div class="rv"><small>'+L(n)+' · السؤال '+(n+1)+'</small><div>'+x[0]+'</div><div style="color:var(--no)">إجابتك: '+x[1][res[n]]+'</div><div style="color:var(--ok)">الصحيحة: '+x[1][x[2]]+'</div><small>'+x[3]+'</small></div>'}});
 if(!bad)h+='<p style="text-align:center">أجبت عن كل الأسئلة إجابة صحيحة.</p>';
 h+='<div style="text-align:center"><button class="btn" id="rs">إعادة الامتحان</button></div>';
 $("app").innerHTML=h;
 $("rs").onclick=()=>{i=0;score=0;res=[];show()};
}
show();
</script>
</body>
</html>
