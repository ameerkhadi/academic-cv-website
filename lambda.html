<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Module 6 – Section 5: AWS Lambda</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&family=IBM+Plex+Mono:wght@400;600&family=Cairo:wght@400;700&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#050D1A;--bg2:#071320;--bg3:#0A1929;--bg4:#0D2137;
  --teal:#00D4AA;--tdim:rgba(0,212,170,.13);
  --orange:#FF9900;--odim:rgba(255,153,0,.12);
  --blue:#4FC3F7;--red:#FF6B6B;--green:#69F0AE;--purple:#A78BFA;--yellow:#FFD166;
  --tx:#E8F4FD;--tx2:#A8C8E8;--tx3:#5A8AAA;
  --bdr:rgba(0,212,170,.18);--bdr2:rgba(255,153,0,.18);
}
body{background:var(--bg);color:var(--tx);font-family:'Outfit',sans-serif;font-size:17px;line-height:1.7;min-height:100vh}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--teal);border-radius:3px}
button{font-family:'Outfit',sans-serif;cursor:pointer;transition:all .2s}
textarea{font-family:'Outfit',sans-serif}
code,pre{font-family:'IBM Plex Mono',monospace}
input[type=range]{accent-color:var(--teal);width:100%}

.header{background:var(--bg2);border-bottom:1px solid var(--bdr);padding:18px 24px}
.header-inner{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.mod-label{color:var(--teal);font-size:13px;font-weight:600}
.mod-title{color:var(--tx);font-weight:900;font-size:24px}
.mod-ar{font-family:'Cairo',sans-serif;color:var(--orange);font-size:15px;direction:rtl}

.nav{background:var(--bg2);border-bottom:1px solid var(--bdr);display:flex;gap:4px;padding:8px 16px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav-btn{background:transparent;border:1px solid var(--bdr);border-radius:20px;padding:6px 16px;color:var(--tx2);font-size:13px;white-space:nowrap;flex-shrink:0}
.nav-btn.active{background:var(--tdim);border-color:var(--teal);color:var(--teal);font-weight:700}

.content{max-width:960px;margin:0 auto;padding:32px 24px 80px}

.card{background:var(--bg3);border:1px solid var(--bdr);border-radius:12px;padding:18px 20px;margin:14px 0}
.card2{background:var(--bg4);border:1px solid var(--bdr);border-radius:8px;padding:12px 14px;margin:6px 0}
.ar{font-family:'Cairo',sans-serif;direction:rtl;text-align:right;color:var(--teal);font-size:17px;background:var(--tdim);border:1px solid var(--bdr);border-radius:8px;padding:10px 16px;margin:10px 0}
.ib{border-radius:10px;padding:14px 18px;margin:16px 0;font-size:15px;color:var(--tx2);display:flex;gap:12px;align-items:flex-start}
.ib-icon{font-size:20px;flex-shrink:0}
.kt{background:rgba(0,212,170,.07);border:1px solid var(--bdr);border-radius:12px;padding:18px 22px;margin:24px 0}
.kt-title{color:var(--teal);font-weight:700;font-size:18px;margin-bottom:12px}
.kt-row{display:flex;gap:10px;margin-bottom:8px;color:var(--tx2);font-size:16px;align-items:flex-start}
.kt-check{color:var(--teal);font-weight:700;flex-shrink:0}

.badge{display:inline-block;border-radius:20px;padding:2px 12px;font-size:13px;font-weight:600;margin:0 4px 4px 0}
.sec-num{color:var(--teal);font-weight:900;font-size:36px;margin-bottom:4px}
.sec-title{color:var(--tx);font-weight:700;font-size:28px;margin-bottom:8px}
.sub-title{color:var(--tx);font-weight:700;font-size:24px;margin-bottom:6px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.auto-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}

.step-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.step-btn{background:transparent;border:1px solid var(--bdr);border-radius:20px;padding:6px 14px;color:var(--tx2);font-size:13px}
.step-btn.active{background:var(--tdim);border-color:var(--teal);color:var(--teal)}
.auto-btn{border-radius:20px;padding:6px 14px;font-size:13px;border:1px solid var(--bdr);color:var(--tx2);background:transparent}
.auto-btn.on{background:var(--odim);border-color:var(--orange);color:var(--orange)}

.step-desc{background:var(--bg4);border:1px solid var(--bdr);border-radius:10px;padding:14px 18px;margin-top:12px;display:none}
.step-desc.show{display:block}
.step-desc-title{color:var(--teal);font-weight:700;font-size:16px;margin-bottom:4px}
.step-desc-body{color:var(--tx2);font-size:15px;margin-bottom:6px}
.step-desc-code{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--orange);background:var(--bg2);padding:5px 10px;border-radius:6px;display:block}

.legend{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-top:10px;font-size:12px;color:var(--tx3)}

.flip-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin:14px 0}
.flip-card{cursor:pointer;perspective:600px;height:126px}
.flip-inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .5s}
.flip-inner.flipped{transform:rotateY(180deg)}
.flip-front,.flip-back{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px;text-align:center}
.flip-back{transform:rotateY(180deg)}
.flip-hint{color:var(--tx3);font-size:12px;margin-top:6px}

.quiz-opt{border-radius:8px;padding:9px 14px;margin-bottom:7px;cursor:pointer;font-size:15px;display:flex;gap:10px;align-items:center;transition:all .2s;border:1px solid var(--bdr);background:var(--bg4);color:var(--tx2)}
.quiz-opt:hover{border-color:var(--teal);color:var(--teal)}
.quiz-opt.picked{background:var(--tdim);border-color:var(--teal);color:var(--teal)}
.quiz-opt.correct{background:rgba(105,240,174,.15);border-color:var(--green);color:var(--green)}
.quiz-opt.wrong{background:rgba(255,107,107,.15);border-color:var(--red);color:var(--red)}
.quiz-exp{background:rgba(79,195,247,.1);border:1px solid rgba(79,195,247,.3);border-radius:8px;padding:10px 14px;margin-top:8px;color:var(--tx2);font-size:14px;display:none}
.quiz-exp.show{display:block}

.match-item{border:1px solid var(--bdr);border-radius:8px;padding:10px 14px;margin-bottom:8px;cursor:pointer;font-size:15px;font-weight:600;color:var(--tx2);transition:all .2s;background:var(--bg4);display:flex;gap:8px;align-items:center}
.match-item.sel{background:var(--tdim);border-color:var(--teal);color:var(--teal)}
.match-item.done{background:rgba(255,153,0,.1);border-color:var(--orange)}
.match-item.correct{background:rgba(105,240,174,.15);border-color:var(--green);color:var(--green)}
.match-item.wrong{background:rgba(255,107,107,.15);border-color:var(--red);color:var(--red)}
.match-def{border:1px solid var(--bdr);border-radius:8px;padding:10px 14px;margin-bottom:8px;cursor:pointer;font-size:13px;color:var(--tx2);transition:all .2s;background:var(--bg4)}
.match-def.used{background:rgba(79,195,247,.1);border-color:var(--blue);opacity:.5}
.match-def:hover:not(.used){border-color:var(--teal)}

table{width:100%;border-collapse:collapse}
th{padding:8px 12px;color:var(--teal);font-weight:700;text-align:left;border-bottom:1px solid var(--bdr)}
td{padding:9px 12px;border-bottom:1px solid var(--bdr)}
tr:nth-child(even){background:var(--bg4)}

.pricebox{background:var(--bg4);border-radius:10px;padding:12px 14px;border-width:1px;border-style:solid}
.price-val{font-weight:700;font-size:20px;margin-top:4px}
.price-label{font-size:11px;color:var(--tx3)}

@media(max-width:660px){.grid2,.grid3{grid-template-columns:1fr}.header-inner{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div>
      <div class="mod-label">AWS Academy · Module 6</div>
      <div class="mod-title">Section 5: Introduction to AWS Lambda</div>
      <div class="mod-ar">مقدمة إلى AWS Lambda — الحوسبة بدون خوادم</div>
    </div>
    <div style="margin-left:auto;display:flex;gap:6px;flex-wrap:wrap">
      <span class="badge" style="background:rgba(0,212,170,.15);border:1px solid rgba(0,212,170,.4);color:#00D4AA">Serverless</span>
      <span class="badge" style="background:rgba(255,153,0,.15);border:1px solid rgba(255,153,0,.4);color:#FF9900">Event-Driven</span>
      <span class="badge" style="background:rgba(167,139,250,.15);border:1px solid rgba(167,139,250,.4);color:#A78BFA">Pay-per-use</span>
      <span class="badge" style="background:rgba(79,195,247,.15);border:1px solid rgba(79,195,247,.4);color:#4FC3F7">Auto-scaling</span>
    </div>
  </div>
</div>

<nav class="nav" id="main-nav">
  <button class="nav-btn active" data-tab="overview">⚡ Overview</button>
  <button class="nav-btn" data-tab="howit">⚙️ How It Works</button>
  <button class="nav-btn" data-tab="events">🔔 Event Sources</button>
  <button class="nav-btn" data-tab="usecases">💡 Use Cases</button>
  <button class="nav-btn" data-tab="limits">📊 Quotas</button>
  <button class="nav-btn" data-tab="lab">🧪 Labs</button>
  <button class="nav-btn" data-tab="quiz">📝 Quiz</button>
</nav>

<div class="content" id="page-content"></div>

<script>
const S={bg:"#050D1A",bg2:"#071320",bg3:"#0A1929",bg4:"#0D2137",
  teal:"#00D4AA",tdim:"rgba(0,212,170,.13)",orange:"#FF9900",odim:"rgba(255,153,0,.12)",
  blue:"#4FC3F7",red:"#FF6B6B",green:"#69F0AE",purple:"#A78BFA",yellow:"#FFD166",
  tx:"#E8F4FD",tx2:"#A8C8E8",tx3:"#5A8AAA",bdr:"rgba(0,212,170,.18)",bdr2:"rgba(255,153,0,.18)"};

/* ── util ── */
function el(tag,attrs,children){
  const e=document.createElement(tag);
  if(attrs)for(const[k,v]of Object.entries(attrs)){
    if(k==="style"&&typeof v==="object")Object.assign(e.style,v);
    else if(k.startsWith("on"))e.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==="class")e.className=v;
    else e.setAttribute(k,v);
  }
  if(children){const arr=Array.isArray(children)?children:[children];for(const c of arr.flat(9)){if(c==null)continue;e.appendChild(typeof c==="string"?document.createTextNode(c):c);}}
  return e;
}
function svgEl(tag,attrs,children){
  const e=document.createElementNS("http://www.w3.org/2000/svg",tag);
  if(attrs)for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);
  if(children){const arr=Array.isArray(children)?children:[children];for(const c of arr.flat(9)){if(c&&typeof c==="object")e.appendChild(c);}}
  return e;
}
function svgTxt(x,y,fill,size,weight,text){
  const t=svgEl("text",{x,y,"text-anchor":"middle","dominant-baseline":"central",fill,"font-size":size,"font-family":"Outfit,sans-serif","font-weight":weight||400});
  t.textContent=text;return t;
}
function svgRect(x,y,w,h,rx,fill,stroke,sw){
  return svgEl("rect",{x,y,width:w,height:h,rx:rx||0,fill:fill||"none",stroke:stroke||"none","stroke-width":sw||1});
}
function svgPath(d,stroke,sw,dash,markerEnd){
  const a={d,stroke:stroke||S.teal,fill:"none","stroke-width":sw||1.5};
  if(dash)a["stroke-dasharray"]=dash;
  if(markerEnd)a["marker-end"]=markerEnd;
  return svgEl("path",a);
}
function arrowMarker(id,color){
  const mk=svgEl("marker",{id,viewBox:"0 0 10 10",refX:"8",refY:"5",markerWidth:"5",markerHeight:"5",orient:"auto"});
  mk.appendChild(svgEl("path",{d:"M2 1L8 5L2 9",fill:"none",stroke:color||S.teal,"stroke-width":"1.8","stroke-linecap":"round"}));
  return mk;
}
function card(children,borderColor,extraStyle){
  const d=el("div",{class:"card"});
  if(borderColor)d.style.border=`1px solid ${borderColor}`;
  if(extraStyle)Object.assign(d.style,extraStyle);
  [children].flat(9).forEach(c=>{if(c)d.appendChild(typeof c==="string"?document.createTextNode(c):c);});
  return d;
}
function infoBox(type,html){
  const col=type==="tip"?S.teal:type==="warn"?S.orange:S.purple;
  const icon=type==="tip"?"💡":type==="warn"?"⚠️":"🔑";
  const d=el("div",{class:"ib",style:{background:`${col}11`,border:`1px solid ${col}33`}});
  d.appendChild(el("span",{class:"ib-icon"},icon));
  const inner=el("div",{});inner.innerHTML=html;d.appendChild(inner);return d;
}
function arDiv(text){const d=el("div",{class:"ar"});d.textContent=text;return d;}
function ktBox(points){
  const d=el("div",{class:"kt"});
  d.appendChild(el("div",{class:"kt-title"},"📌 Key Takeaways"));
  points.forEach(p=>{const r=el("div",{class:"kt-row"});r.appendChild(el("span",{class:"kt-check"},"✓"));r.appendChild(el("span",{},p));d.appendChild(r);});
  return d;
}
function stepBtn(label,i,state,onClick){
  const b=el("button",{class:`step-btn${state.step===i?" active":""}`,onClick});
  b.textContent=label;return b;
}
function resetBtn(onClick){const b=el("button",{class:"step-btn",onClick});b.textContent="↺ Reset";return b;}

/* ══════════════════════════════════════
   DIAGRAM 1 — Serverless vs Traditional
══════════════════════════════════════ */
function buildDiagServerless(){
  const steps=[
    {title:"Traditional Server — Always Running",desc:"A server runs 24/7. You pay even when idle. You provision, patch, and scale it yourself.",hl:["vm0","vm1","vm2"]},
    {title:"Lambda — Event Triggered",desc:"Lambda runs ONLY when an event fires. No trigger = no code running = no charge.",hl:["trigger","lambda"]},
    {title:"Lambda Auto-Scales",desc:"Automatically scales to 1,000 concurrent executions. AWS manages all infrastructure.",hl:["lambda","e0","e1","e2"]},
    {title:"CloudWatch Auto-Monitors",desc:"Every invocation is automatically logged to CloudWatch Logs. No setup required.",hl:["cw","lambda"]},
  ];
  const state={step:-1,auto:false,timer:null};

  const ROOT=svgEl("svg",{width:"100%",viewBox:"0 0 840 300",style:"display:block"});
  const defs=svgEl("defs",{});defs.appendChild(arrowMarker("arSL",S.teal));ROOT.appendChild(defs);

  // static labels
  ROOT.appendChild(svgTxt(185,14,S.tx2,13,700,"Traditional Server"));
  ROOT.appendChild(svgTxt(185,28,S.red,10,400,"Always running — always paying"));
  ROOT.appendChild(svgEl("line",{x1:425,y1:8,x2:425,y2:292,stroke:S.bdr,"stroke-width":1,"stroke-dasharray":"4 4"}));
  ROOT.appendChild(svgTxt(425,152,S.tx3,16,900,"VS"));
  ROOT.appendChild(svgTxt(635,14,S.tx2,13,700,"AWS Lambda"));
  ROOT.appendChild(svgTxt(635,28,S.teal,10,400,"Runs only when triggered — pay per 100ms"));

  // VMs
  const vmGroups=[];
  [0,1,2].forEach(i=>{
    const g=svgEl("g",{"data-id":`vm${i}`});
    const x=20+i*118;
    g.appendChild(svgRect(x,42,106,210,8,S.bg4,`${S.red}55`));
    g.appendChild(svgRect(x+8,50,90,50,4,S.bg2,`${S.red}33`));
    g.appendChild(svgTxt(x+53,68,S.tx3,8,400,"OS running"));
    g.appendChild(svgTxt(x+53,82,S.tx3,8,400,"patches needed"));
    g.appendChild(svgTxt(x+53,118,S.tx3,10,400,"CPU: running"));
    g.appendChild(svgTxt(x+53,132,S.tx3,10,400,"RAM: allocated"));
    g.appendChild(svgTxt(x+53,150,S.red,11,600,"$0.10/hr"));
    g.appendChild(svgTxt(x+53,164,S.red,9,400,"even when idle"));
    g.appendChild(svgRect(x+8,176,90,18,9,`${S.red}22`,`${S.red}44`));
    g.appendChild(svgTxt(x+53,185,S.red,9,600,"IDLE 70%"));
    g.appendChild(svgTxt(x+53,236,S.tx3,9,400,`Server ${i+1}`));
    ROOT.appendChild(g);vmGroups.push(g);
  });

  // Trigger
  const trigG=svgEl("g",{"data-id":"trigger"});
  trigG.appendChild(svgRect(448,70,116,56,8,S.bg4,`${S.orange}55`));
  trigG.appendChild(svgTxt(506,93,S.orange,11,700,"🔔 Event Trigger"));
  trigG.appendChild(svgTxt(506,112,S.tx3,10,400,"S3 / API / Schedule"));
  ROOT.appendChild(trigG);

  ROOT.appendChild(svgPath("M564 98 L600 98",S.teal,1.5,null,"url(#arSL)"));
  ROOT.appendChild(svgTxt(582,90,S.teal,10,400,"invoke"));

  // Lambda
  const lambdaG=svgEl("g",{"data-id":"lambda"});
  lambdaG.appendChild(svgRect(600,56,130,90,10,S.bg3,S.bdr,1.5));
  lambdaG.appendChild(svgTxt(665,86,S.teal,26,700,"λ"));
  lambdaG.appendChild(svgTxt(665,112,S.teal,12,700,"Lambda Function"));
  lambdaG.appendChild(svgTxt(665,128,S.tx3,10,400,"128 MB – 10,240 MB"));
  lambdaG.appendChild(svgTxt(665,141,S.tx3,10,400,"1s – 15 min timeout"));
  ROOT.appendChild(lambdaG);

  const execGs=[];
  [0,1,2].forEach(i=>{
    const g=svgEl("g",{"data-id":`e${i}`});
    g.appendChild(svgRect(604+i*46,162,38,32,6,`${S.teal}22`,S.bdr));
    g.appendChild(svgTxt(623+i*46,174,S.teal,16,400,"λ"));
    g.appendChild(svgTxt(623+i*46,187,S.tx3,8,400,`exec ${i+1}`));
    ROOT.appendChild(g);execGs.push(g);
  });
  ROOT.appendChild(svgTxt(665,212,S.tx3,10,400,"scales to 1,000 concurrent"));

  const cwG=svgEl("g",{"data-id":"cw"});
  cwG.appendChild(svgRect(600,224,130,46,8,S.bg4,`${S.blue}44`));
  cwG.appendChild(svgTxt(665,244,S.blue,11,700,"📊 CloudWatch"));
  cwG.appendChild(svgTxt(665,260,S.tx3,10,400,"auto-logs every invocation"));
  ROOT.appendChild(cwG);

  ROOT.appendChild(svgPath("M665 148 L665 160",S.teal,1,null,"url(#arSL)"));
  ROOT.appendChild(svgPath("M665 196 L665 222",S.blue,1,"3 2"));

  const payG=svgEl("g",{});
  payG.appendChild(svgRect(448,196,128,34,8,`${S.teal}15`,S.bdr));
  payG.appendChild(svgTxt(512,209,S.teal,11,700,"Pay per 100ms"));
  payG.appendChild(svgTxt(512,223,S.tx3,10,400,"$0 when not running"));
  ROOT.appendChild(payG);

  function applyState(){
    const allIds=["vm0","vm1","vm2","trigger","lambda","e0","e1","e2","cw"];
    allIds.forEach(id=>{
      const gs=ROOT.querySelectorAll(`[data-id="${id}"]`);
      gs.forEach(g=>{
        if(state.step<0){g.style.opacity=1;g.style.filter="none";}
        else{
          const isHl=steps[state.step].hl.includes(id);
          g.style.opacity=isHl?1:0.18;
          g.style.filter=isHl?`drop-shadow(0 0 9px ${S.teal}99)`:"none";
        }
        g.style.transition="all .4s";
      });
    });
  }

  const descBox=el("div",{class:"step-desc"});
  const descTitle=el("div",{class:"step-desc-title"});
  const descBody=el("div",{class:"step-desc-body"});
  descBox.append(descTitle,descBody);

  const btnRow=el("div",{class:"step-btns"});
  steps.forEach((s,i)=>{
    const b=el("button",{class:"step-btn",onClick(){
      state.step=state.step===i?-1:i;state.auto=false;clearInterval(state.timer);
      autoB.className="auto-btn";autoB.textContent="▶ Auto";
      updateBtns();applyState();
      if(state.step>=0){descTitle.textContent=`Step ${state.step+1}: ${steps[state.step].title}`;
        descBody.textContent=steps[state.step].desc;descBox.classList.add("show");}
      else descBox.classList.remove("show");
    }});b.textContent=`Step ${i+1}`;btnRow.appendChild(b);
  });
  const autoB=el("button",{class:"auto-btn",onClick(){
    state.auto=!state.auto;
    if(state.auto){autoB.className="auto-btn on";autoB.textContent="⏹ Stop";
      state.timer=setInterval(()=>{state.step=(state.step+1)%steps.length;updateBtns();applyState();
        descTitle.textContent=`Step ${state.step+1}: ${steps[state.step].title}`;
        descBody.textContent=steps[state.step].desc;descBox.classList.add("show");},2200);
    }else{clearInterval(state.timer);autoB.className="auto-btn";autoB.textContent="▶ Auto";}
  }});autoB.textContent="▶ Auto";btnRow.appendChild(autoB);
  const rstB=el("button",{class:"step-btn",onClick(){
    state.step=-1;state.auto=false;clearInterval(state.timer);
    autoB.className="auto-btn";autoB.textContent="▶ Auto";updateBtns();applyState();descBox.classList.remove("show");
  }});rstB.textContent="↺";btnRow.appendChild(rstB);

  function updateBtns(){btnRow.querySelectorAll(".step-btn").forEach((b,i)=>{if(i<steps.length)b.className=`step-btn${state.step===i?" active":""}`});}

  const lgd=el("div",{class:"legend"},[
    el("span",{},[el("span",{style:{color:S.red}},"■")," Traditional Server"]),
    el("span",{},[el("span",{style:{color:S.teal}},"λ")," Lambda"]),
    el("span",{},[el("span",{style:{color:S.orange}},"■")," Trigger"]),
    el("span",{},[el("span",{style:{color:S.blue}},"■")," CloudWatch"]),
  ]);

  const wrap=card([

    const v=el("div",{class:"price-val",style:{color:col,fontSize:big?"22px":"18px"}},"...");
    b.appendChild(v);resultGrid.appendChild(b);boxes[key]=v;
  });
  wrap.appendChild(resultGrid);

  function updatePrice(){
    const freeReqs=1000000,freeGB=400000,priceReq=0.20,priceGBs=0.0000166667;
    const gbSec=state.reqs*(state.ms/1000)*(state.mem/1024);
    const billReq=Math.max(0,state.reqs-freeReqs);
    const billGB=Math.max(0,gbSec-freeGB);
    const costReq=(billReq/1000000)*priceReq;
    const costComp=billGB*priceGBs;
    const total=costReq+costComp;
    const fmt=n=>n<0.01?"< $0.01":`$${n.toFixed(4)}`;
    boxes.gbs.textContent=(gbSec/1000).toFixed(1)+"K";
    boxes.free.textContent=Math.max(0,(freeGB-gbSec)/1000).toFixed(1)+"K GB-s";
    boxes.reqcost.textContent=fmt(costReq);
    boxes.compcost.textContent=fmt(costComp);
    boxes.total.textContent=total<0.01?"< $0.01 (Free)":fmt(total);
  }
  updatePrice();

  const note=el("div",{style:{background:`${S.green}15`,border:`1px solid ${S.green}33`,borderRadius:8,padding:"12px 16px",marginTop:12}});
  note.appendChild(el("div",{style:{color:S.green,fontWeight:700,fontSize:14,marginBottom:3}},"🎁 Lambda Free Tier (always free, every month):"));
  note.appendChild(el("div",{style:{color:S.tx2,fontSize:13}},"1,000,000 free requests + 400,000 GB-seconds compute. Great for prototyping."));
  wrap.appendChild(note);
  return wrap;
}

    checkBtn.style.background=allDone&&!state.checked?S.teal:S.bg4;
    checkBtn.style.color=allDone&&!state.checked?S.bg:"gray";
    checkBtn.style.borderColor=allDone&&!state.checked?S.teal:S.bdr;
    checkBtn.style.cursor=allDone&&!state.checked?"pointer":"not-allowed";

    items.forEach((item,i)=>{
      const isMatch=state.answers[i]!==undefined;
      const correct=state.answers[i]===i;
      let cls="match-item";

  {q:"What is an IAM Execution Role and why does Lambda need it?",a:"An IAM execution role grants Lambda permission to call other AWS services. Without it, Lambda has no credentials. E.g. a function reading S3 needs s3:GetObject in its execution role; one writing to DynamoDB needs dynamodb:PutItem."},
