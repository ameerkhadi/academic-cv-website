<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>بنك المراجعة — الذكاء الاصطناعي وتحليل البيانات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f3ec; --bg2:#efe8dc; --card:#fffdf9; --ink:#2f2a25; --muted:#7a7066; --line:#e6ddd0;
  --accent:#7c6cd6; --accent-soft:#ece8fb; --ok:#2f9e6f; --ok-soft:#e3f5ec; --bad:#d4645c; --bad-soft:#fbe9e7;
  --gold:#d9a441; --gold-soft:#fbf1dc; --shadow:0 10px 30px rgba(80,60,30,.08),0 2px 6px rgba(80,60,30,.05);
  --w1:#8fb8e8; --w2:#9fd3b5; --w3:#f2c38b; --w4:#c7a8ea; --w5:#ef9fb0;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1d1b22; --bg2:#25222b; --card:#2a2730; --ink:#efe9f3; --muted:#a59cb0; --line:#3a3542;
  --accent:#a99bf0; --accent-soft:#363052; --ok:#5cc79a; --ok-soft:#1f3a2f; --bad:#ec8a82; --bad-soft:#43282a;
  --gold:#e8bd64; --gold-soft:#3d3324; --shadow:0 10px 30px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --bg:#1d1b22; --bg2:#25222b; --card:#2a2730; --ink:#efe9f3; --muted:#a59cb0; --line:#3a3542;
  --accent:#a99bf0; --accent-soft:#363052; --ok:#5cc79a; --ok-soft:#1f3a2f; --bad:#ec8a82; --bad-soft:#43282a;
  --gold:#e8bd64; --gold-soft:#3d3324; --shadow:0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Tajawal,"Segoe UI",Tahoma,sans-serif;background:radial-gradient(1200px 600px at 85% -10%,var(--accent-soft),transparent 60%),
  radial-gradient(900px 500px at -10% 110%,var(--gold-soft),transparent 60%),var(--bg);color:var(--ink);min-height:100vh;line-height:1.7}
.wrap{max-width:760px;margin:0 auto;padding:22px 16px 60px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px;color:var(--muted)}
.brand i{width:34px;height:34px;border-radius:12px;background:var(--accent-soft);display:grid;place-items:center;font-style:normal;font-size:18px}
.iconbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:7px 12px;font:inherit;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:26px}
h1{font-size:30px;margin:4px 0 6px;line-height:1.35}
.sub{color:var(--muted);margin:0 0 22px}
.lbl{font-weight:700;margin:18px 0 10px;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:8px 16px;font:500 15px Tajawal,sans-serif;cursor:pointer;transition:.18s}
.chip:hover{transform:translateY(-1px)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:6px;vertical-align:1px}
.mode{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode button{text-align:start;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:18px;padding:14px;font:inherit;cursor:pointer;transition:.18s}
.mode button b{display:block;font-size:16px}
.mode button span{color:var(--muted);font-size:13.5px}
.mode button.on{border-color:var(--accent);background:var(--accent-soft)}
.go{margin-top:24px;width:100%;border:0;border-radius:18px;padding:15px;background:linear-gradient(135deg,var(--accent),#9a8be8);color:#fff;
  font:800 18px Tajawal,sans-serif;cursor:pointer;box-shadow:0 10px 24px rgba(124,108,214,.35);transition:.2s}
.go:hover{transform:translateY(-2px)}
.go:disabled{opacity:.5;cursor:not-allowed;transform:none}
.best{margin-top:14px;text-align:center;color:var(--muted);font-size:14px}
.stats{display:flex;gap:10px;margin-top:6px;flex-wrap:wrap}
.stat{flex:1;min-width:120px;background:var(--bg);border-radius:16px;padding:10px 14px;text-align:center}
.stat b{display:block;font-size:22px}
.stat span{font-size:13px;color:var(--muted)}

/* question */
.bar{height:10px;background:var(--bg2);border-radius:99px;overflow:hidden;margin:4px 0 16px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),#b7abf2);border-radius:99px;transition:width .35s ease}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:14px;margin-bottom:6px}
.tags{display:flex;gap:6px}
.tag{border-radius:999px;padding:3px 11px;font-size:12.5px;font-weight:700;color:#2f2a25}
.q{font-size:20px;font-weight:700;margin:6px 0 18px;line-height:1.75}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:start;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);
  border-radius:16px;padding:13px 14px;font:500 16px/1.6 Tajawal,sans-serif;cursor:pointer;transition:.18s}
.opt:hover:not(:disabled){border-color:var(--accent);transform:translateX(-2px)}
.opt .l{flex:0 0 32px;height:32px;border-radius:10px;background:var(--card);border:1.5px solid var(--line);display:grid;place-items:center;font-weight:800}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .l{background:var(--accent);border-color:var(--accent);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .l{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft);animation:shake .35s}
.opt.bad .l{background:var(--bad);border-color:var(--bad);color:#fff}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(5px)}75%{transform:translateX(-5px)}}
.why{margin-top:14px;border-radius:16px;padding:12px 16px;font-size:15px;display:none;animation:fade .3s}
.why.show{display:block}
.why.ok{background:var(--ok-soft);border:1px solid var(--ok)}
.why.bad{background:var(--bad-soft);border:1px solid var(--bad)}
.why b{display:block;margin-bottom:2px}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.btn{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:11px 20px;font:700 15px Tajawal,sans-serif;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.hint{text-align:center;color:var(--muted);font-size:12.5px;margin-top:12px}
.streak{color:var(--gold);font-weight:800}

/* results */
.ring{display:grid;place-items:center;margin:6px auto 4px}
.ring svg{width:170px;height:170px}
.ring text{font-family:Tajawal,sans-serif}
.msg{text-align:center;font-size:20px;font-weight:800;margin:4px 0}
.msg2{text-align:center;color:var(--muted);margin:0 0 16px}
.wk{display:grid;grid-template-columns:110px 1fr 54px;align-items:center;gap:10px;margin:8px 0;font-size:14px}
.wk .t{height:12px;background:var(--bg2);border-radius:99px;overflow:hidden}
.wk .t i{display:block;height:100%;border-radius:99px;transition:width .8s ease}
.rev{margin-top:12px;border:1px solid var(--line);border-radius:16px;padding:12px 14px;background:var(--bg)}
.rev .rq{font-weight:700;margin-bottom:6px}
.rev .ra{font-size:14.5px}
.rev .ra.x{color:var(--bad)} .rev .ra.v{color:var(--ok)}
.rev .rw{font-size:14px;color:var(--muted);margin-top:4px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.row .btn{flex:1}
.foot{text-align:center;color:var(--muted);font-size:12.5px;margin-top:22px}
.hide{display:none}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:3px;opacity:.85;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
@media (max-width:520px){h1{font-size:24px}.card{padding:18px;border-radius:20px}.q{font-size:18px}.mode{grid-template-columns:1fr}.wk{grid-template-columns:96px 1fr 46px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><i>🧠</i>الذكاء الاصطناعي وتحليل البيانات</div>
    <button class="iconbtn" id="themeBtn" title="الوضع الليلي">☾</button>
  </div>

  <!-- START -->
  <section class="card" id="sStart">
    <h1>بنك المراجعة 🌿</h1>
    <p class="sub">١٠٠ سؤال من الأسابيع الخمسة الأولى، لكلّ سؤال تعليلٌ قصير. خذ وقتك، وتعلّم من كلّ خطأ.</p>
    <div class="stats" id="bankStats"></div>

    <div class="lbl">الأسابيع</div>
    <div class="chips" id="weeks"></div>

    <div class="lbl">عدد الأسئلة</div>
    <div class="chips" id="counts"></div>

    <div class="lbl">طريقة الحلّ</div>
    <div class="mode" id="modes">
      <button data-m="practice" class="on"><b>🌱 تدريب</b><span>ترى الجواب الصحيح وتعليله بعد كلّ سؤال</span></button>
      <button data-m="test"><b>⏱️ اختبار</b><span>تجيب عن الكلّ، ثمّ ترى النتيجة والتصحيح</span></button>
    </div>


    <button class="go" id="goBtn">ابدأ</button>
    <div class="best" id="best"></div>
  </section>

  <!-- QUESTION -->
  <section class="card hide" id="sQ">
    <div class="meta"><span id="qNum"></span><span class="tags" id="qTags"></span></div>
    <div class="bar"><i id="qBar"></i></div>
    <div class="q" id="qText"></div>
    <div class="opts" id="qOpts"></div>
    <div class="why" id="qWhy"></div>
    <div class="nav">
      <button class="btn" id="prevBtn">→ السابق</button>
      <button class="btn pri" id="nextBtn">التالي ←</button>
    </div>
    <div class="hint">اختصارات: ١–٤ أو أ ب ج د للاختيار · Enter للتالي <span id="streak" class="streak"></span></div>
  </section>

  <!-- RESULT -->
  <section class="card hide" id="sR">
    <div class="ring" id="ring"></div>
    <div class="msg" id="rMsg"></div>
    <p class="msg2" id="rMsg2"></p>
    <div id="rWeeks"></div>
    <div class="row">
      <button class="btn pri" id="retryWrong">أعد الأسئلة الخاطئة</button>
      <button class="btn" id="newQuiz">جولة جديدة</button>
    </div>
    <div class="lbl" id="revTitle">مراجعة الأخطاء</div>
    <div id="rList"></div>
  </section>

  <div class="foot">تدريبٌ ذاتيّ للمراجعة — لا تُحتسب له درجة · إعداد د. أمير هادي</div>
</div>
<div class="confetti" id="confetti"></div>

<script>

    $('ring').innerHTML='<svg viewBox="0 0 170 170"><circle cx="85" cy="85" r="'+R+'" fill="none" stroke="var(--bg2)" stroke-width="14"/>'+
      '<circle id="arc" cx="85" cy="85" r="'+R+'" fill="none" stroke="'+col+'" stroke-width="14" stroke-linecap="round" transform="rotate(-90 85 85)" stroke-dasharray="'+C+'" stroke-dashoffset="'+C+'" style="transition:stroke-dashoffset 1.1s ease"/>'+
      '<text x="85" y="84" text-anchor="middle" font-size="34" font-weight="800" fill="var(--ink)">'+ar(pct)+'٪</text>'+
      '<text x="85" y="110" text-anchor="middle" font-size="14" fill="var(--muted)">'+ar(ok)+' من '+ar(Q.length)+'</text></svg>';
    setTimeout(function(){ var a=$('arc'); if(a) a.style.strokeDashoffset = C*(1-pct/100); },60);
    $('rMsg').textContent = pct>=90?'ممتاز! أنت جاهز تمامًا 🌟': pct>=75?'أداءٌ جميل، بقي القليل 👏': pct>=50?'بداية طيّبة — راجع الأخطاء 🌱':'لا بأس، كلّ خطأ درس — حاول مجدّدًا 💪';
    $('rMsg2').textContent = wrong.length ? 'راجع تعليل الأسئلة الخاطئة في الأسفل، ثمّ أعدها.' : 'لا أخطاء في هذه الجولة.';
    $('rWeeks').innerHTML = Object.keys(wk).sort().map(function(w){ var v=wk[w], p=Math.round(v[0]/v[1]*100);
      return '<div class="wk"><span>الأسبوع '+WNAME[w]+'</span><span class="t"><i style="width:0;background:'+WCOL[w]+'" data-p="'+p+'"></i></span><span>'+ar(v[0])+'/'+ar(v[1])+'</span></div>'; }).join('');
    setTimeout(function(){ document.querySelectorAll('#rWeeks i').forEach(function(x){ x.style.width=x.dataset.p+'%'; }); },80);
    $('revTitle').classList.toggle('hide', !wrong.length);
    $('retryWrong').classList.toggle('hide', !wrong.length);
    $('rList').innerHTML = wrong.map(function(n){ var it=Q[n], b=it.b, a=ans[n];
      return '<div class="rev"><div class="rq">'+ar(n+1)+'. '+esc(b.q)+'</div>'+
        (a===null?'<div class="ra x">لم تُجب</div>':'<div class="ra x">✗ جوابك: '+esc(b.o[it.order[a]])+'</div>')+
        '<div class="ra v">✓ الصحيح: '+esc(b.o[0])+'</div><div class="rw">💡 '+esc(b.why)+'</div></div>'; }).join('');
    $('retryWrong').onclick=function(){ start(shuffle(wrong.map(function(n){return Q[n].b;}))); };
    show('sR'); showBest();
    try{ new Image().src='https://ameer.itbabylon.org/sensors-api/hit?p=ai-quiz-done&n=1&t='+Date.now(); }catch(e){}
    if(pct>=80) confetti();
  }
  $('newQuiz').onclick=function(){ show('sStart'); upd(); };
  function confetti(){
    if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var c=$('confetti'), cols=['#8fb8e8','#9fd3b5','#f2c38b','#c7a8ea','#ef9fb0','#7c6cd6'];
    for(var k=0;k<70;k++){ var p=document.createElement('i'); p.style.left=Math.random()*100+'%';
      p.style.background=cols[k%cols.length]; p.style.animationDuration=(2.2+Math.random()*1.8)+'s'; p.style.animationDelay=(Math.random()*.6)+'s'; c.appendChild(p); }
    setTimeout(function(){ c.innerHTML=''; },4800);
  }
})();
</script>
<script>/* visit counter: no personal data */(function(p){var n="0";try{if(!localStorage.getItem("v_"+p)){localStorage.setItem("v_"+p,"1");n="1"}}catch(e){}new Image().src="https://ameer.itbabylon.org/sensors-api/hit?p="+p+"&n="+n+"&t="+Date.now()})("ai-quiz");</script>
