}

<div id="app" class="hide">

    <div class="brand">
      <span class="inst" id="instName"></span>
      <span class="course" id="courseName"></span>
    </div>
    <div class="who"><span id="userName"></span>
      <button class="linkbtn" id="themeBtn" onclick="toggleTheme()" title="تبديل المظهر">&#9789;</button>
      <button class="linkbtn hide" id="refreshBtn" onclick="doRefresh()">تحديث</button>
      <button class="linkbtn" onclick="signOut()">خروج</button></div>

  </div>
</div>

<script>
var S = { role:null, code:null, name:'', tab:0, data:null, info:{maxMB:10} };

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function toast(m){ var t=document.createElement('div'); t.className='toast'; t.textContent=m;
  document.body.appendChild(t); setTimeout(function(){ t.remove(); },2600); }
function fmtDate(v){ if(!v) return '—'; var d=new Date(v);
  if(isNaN(d)) return String(v).slice(0,10);
  return d.toLocaleDateString('ar-IQ',{year:'numeric',month:'2-digit',day:'2-digit'}); }
function pct(a,b){ return b>0 ? Math.round(a/b*100) : 0; }

/* ═══ الاتصال بالخادم ═══
   المحاولة الأولى: POST بنوع text/plain (يتجنّب فحص CORS المسبق).
   إن فشلت لأي سبب، نستخدم JSONP عبر وسم script — يعمل دائماً للقراءة. */

function post(payload){
  return fetch(API,{
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(payload),
    redirect:'follow'
  }).then(function(r){ return r.json(); });
}

function jsonp(payload){
  return new Promise(function(resolve,reject){
    var cb='cb_'+Math.random().toString(36).slice(2);
    var s=document.createElement('script');
    var timer=setTimeout(function(){ done(); reject(new Error('انتهت المهلة. تحقّق من الاتصال.')); },25000);
    function done(){ clearTimeout(timer); try{ delete window[cb]; }catch(e){ window[cb]=undefined; }
      if(s.parentNode) s.parentNode.removeChild(s); }
    window[cb]=function(j){ done(); resolve(j); };
    s.onerror=function(){ done(); reject(new Error('تعذّر الاتصال بالخادم.')); };
    s.src=API+'?action='+encodeURIComponent(payload.action)+
          '&callback='+cb+'&payload='+encodeURIComponent(JSON.stringify(payload));
    document.body.appendChild(s);
  });
}

function api(action,payload){
  payload = payload || {};
  payload.action = action;
  // إجراءات الكتابة لا تمرّ عبر JSONP — الخادم يرفضها ويعيد رسالة غامضة
  var WRITE = ['upload','grade','saveLecture','saveAssignment','publish',
               'addStudents','bulkGrades','contact','deleteItem','saveSettings','unlockCode','addBonus','studentCard'];
  var heavy = WRITE.indexOf(action) !== -1;
  return post(payload).catch(function(){
    if(heavy) throw new Error('تعذّر الاتصال بالخادم. تحقّق من الإنترنت وأعد المحاولة.');
    return jsonp(payload);
  }).then(function(j){
    if(!j) throw new Error('لا يوجد رد من الخادم.');
    if(!j.ok) throw new Error(j.error || 'خطأ غير متوقع.');
    return j.data;
  });
}

/* ═══════════ بطاقة الطالب (مسح QR) ═══════════ */

var scanCode=null, cardData=null, cardErr='';

function qsParam(k){
  var m=new RegExp('[?&]'+k+'=([^&]*)').exec(location.search);
  return m ? decodeURIComponent(m[1].replace(/\+/g,' ')) : null;
}

function clearScan(){
  scanCode=null; cardData=null; cardErr='';
  try{ history.replaceState({}, '', location.pathname); }catch(e){}
  render();
}

function loadCard(){
  cardData=null; cardErr='';
  api('studentCard',{code:S.code,target:scanCode})
    .then(function(d){ cardData=d; render(); })
    .catch(function(e){ cardErr=e.message; render(); });
}

function cardView(){
  if(cardErr) return '<div class="card"><h3>تعذّر فتح البطاقة</h3>'+
    '<div class="err">'+esc(cardErr)+'</div>'+
    '<button class="btn sm ghost" style="margin-top:12px" onclick="clearScan()">رجوع</button></div>';
  if(!cardData) return '<div class="card"><div class="meta">جارٍ فتح البطاقة…</div></div>';

  var d=cardData, B=d.breakdown;
  var h='<div class="card"><div class="cardhead"><h3>'+esc(d.name)+'</h3>'+
    '<div class="sub">'+esc(d.code)+(d.section?' · شعبة '+esc(d.section):'')+
    (d.active?'':' · معطّل')+'</div></div>';

  h+='<div class="kv"><span class="k">الدرجة الحالية</span>'+
     '<span class="v">'+B.total+' من '+B.outOf+'</span></div>'+
     '<div class="kv"><span class="k">امتحان / صفّية / واجبات</span>'+
     '<span class="v">'+B.exam.earned+' · '+B.quiz.earned+' · '+B.assign.earned+'</span></div>'+
     '<div class="kv"><span class="k">التسليمات</span>'+
     '<span class="v">'+d.submittedCount+' من '+d.totalAssignments+
     (d.lateCount?' · '+d.lateCount+' متأخر':'')+'</span></div>'+
     '<div class="kv"><span class="k">المكافأة</span>'+
     '<span class="v">'+d.bonusTotal+' من 2'+(d.bonusLeft?' (متاح '+d.bonusLeft+')':' — بلغ السقف')+'</span></div>'+
     (d.locked?'<div class="kv"><span class="k">حالة الدخول</span>'+
       '<span class="v" style="color:var(--danger)">مقفول '+d.locked+' دقيقة</span></div>':'');

  if(d.bonusLeft>0){
    h+='<div class="meta" style="margin-top:16px">منح مكافأة الآن:</div><div class="bonusrow">';
    [0.5,1,1.5,2].forEach(function(v){
      if(v<=d.bonusLeft) h+='<button class="btn sm ghost" onclick="quickBonus('+v+')">+'+v+'</button>';
    });
    h+='</div>';
  }

  h+='<div class="stack" style="margin-top:16px">'+
     '<button class="btn sm ghost" onclick="loadCard()">تحديث</button>'+
     (d.locked?'<button class="btn sm ghost" onclick="unlockThis()">فكّ القفل</button>':'')+
     '<button class="btn sm ghost" onclick="clearScan()">إغلاق</button></div></div>';

  if(d.submissions && d.submissions.length){
    h+='<div class="card"><h3>التسليمات</h3><div class="tblwrap"><table><thead><tr>'+
       '<th>الواجب</th><th>الحالة</th><th class="num">الدرجة</th></tr></thead><tbody>'+
       d.submissions.map(function(x){
         var st = !x.submitted ? '<span class="pill none">لم يسلّم</span>'
                : (x.status==='متأخر' ? '<span class="pill late">متأخر</span>'
                                      : '<span class="pill ok">مستلم</span>');
         return '<tr><td>'+esc(x.title)+(x.counts===false?' <span class="meta">(لا يُحتسب)</span>':'')+
           '</td><td>'+st+'</td><td class="num">'+
           (x.total==null?'—':x.total+' / '+x.maxScore)+'</td></tr>';
       }).join('')+'</tbody></table></div></div>';
  }

  if(d.lastMessage){
    h+='<div class="card"><h3>آخر رسالة</h3>'+
       '<div class="meta">'+fmtDate(d.lastMessage.date)+
       (d.messageCount>1?' · '+d.messageCount+' رسالة إجمالاً':'')+'</div>'+
       (d.lastMessage.subject?'<div style="font-weight:600;margin-top:8px">'+esc(d.lastMessage.subject)+'</div>':'')+
       '<div class="desc" style="margin-top:6px">'+esc(d.lastMessage.message)+'</div></div>';
  }
  return h;
}

function doLogin(){

  $('gateErr').className='err hide';

/* ═══ المظهر ═══ */
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t==='dark'?'dark':'light');
  var b=$('themeBtn'); if(b) b.innerHTML = t==='dark' ? '&#9728;' : '&#9789;';
  try{ localStorage.setItem('mtheme',t); }catch(e){}
}
function toggleTheme(){
  var cur=document.documentElement.getAttribute('data-theme');
  applyTheme(cur==='dark'?'light':'dark');
}
function initTheme(){
  var t=null;
  try{ t=localStorage.getItem('mtheme'); }catch(e){}
  if(!t) t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark':'light';
  applyTheme(t);
}

/* ═══ الإعلان ورابط الاختبار (يظهران للطالب) ═══ */
function renderTop(){
  var st=(S.data && S.data.settings) || null;
  var a=$('announceBox'), q=$('quizBox');
  if(!a||!q) return;
  if(S.role!=='student' || !st){ a.innerHTML=''; q.innerHTML=''; return; }

  a.innerHTML = (st.announceOn && st.announce)
    ? '<div class="announce"><b>إعلان</b>'+esc(st.announce)+'</div>' : '';

  q.innerHTML = (st.quizOn && st.quizUrl)
    ? '<div class="quizcard"><div class="row"><h3>'+esc(st.quizLabel||'اختبار متاح الآن')+'</h3></div>'+
      '<div class="meta">اضغط للفتح، ثم عد واضغط «تحديث» لمتابعة السؤال التالي.</div>'+
      '<a class="btn sm" style="text-decoration:none;display:inline-block;margin-top:10px" href="'+
      esc(st.quizUrl)+'" target="_blank" rel="noopener">فتح الاختبار</a></div>' : '';
}

function renderTabs(){
  if(scanCode && S.role==='teacher'){ $('tabs').innerHTML=''; return; }
  var names = S.role==='student'
    ? ['المحاضرات','الواجبات','درجاتي','التواصل']
    : ['التسليمات','الواجبات','المحاضرات','الدرجات','الطلبة','الرسائل'];
  $('tabs').innerHTML = names.map(function(n,i){
    return '<button class="tab" role="tab" aria-selected="'+(i===S.tab)+'" onclick="go('+i+')">'+n+'</button>';
  }).join('');
}
function go(i){ S.tab=i; renderTabs(); render(); }

function load(){
  $('view').innerHTML='<div class="center">جارٍ التحميل…</div>';
  api(S.role==='student'?'studentData':'teacherData',{code:S.code})
    .then(function(d){ S.data=d; render(); })
    .catch(function(e){ $('view').innerHTML='<div class="err">'+esc(e.message)+'</div>'; });
}

function render(){
  if(!S.data) return;
  renderTop();

  // مسح QR: البطاقة للأدمن فقط، ورسالة صريحة لغيره
  if(scanCode){
    if(S.role==='teacher'){
      if(cardData===null && !cardErr) loadCard();
      $('view').innerHTML = cardView();
      return;
    }
    $('view').innerHTML='<div class="card"><h3>بطاقة الطالب</h3>'+
      '<div class="err">بطاقة الطالب متاحة لحساب الإدارة فقط.</div>'+
      '<button class="btn sm ghost" style="margin-top:12px" onclick="clearScan()">العودة إلى صفحتي</button></div>';
    return;
  }

  $('view').innerHTML = S.role==='student' ? studentView() : teacherView();
  if(S.role==='student' && S.tab===3) setTimeout(drawQR,0);
}

function studentView(){
  if(S.tab===0) return lecturesView();
  if(S.tab===1) return assignmentsView();
  if(S.tab===2) return gradesView();
  return contactView();
}

function contactView(){
  var em=(S.info && S.info.teacherEmail) || '';
  var nm=(S.info && S.info.teacherName) || 'أستاذ المادة';
  var subj='['+((S.info&&S.info.course)||'المادة')+'] '+S.name;
  var body='الاسم: '+S.name+'\nالرمز: '+S.code+
           (S.data.section?('\nالشعبة: '+S.data.section):'')+'\n\n';
  var href='mailto:'+em+'?subject='+encodeURIComponent(subj)+'&body='+encodeURIComponent(body);

  return '<div class="card"><h3>التواصل مع أستاذ المادة</h3>'+
    '<div class="note">المراسلة تكون عبر البريد الإلكتروني الرسمي. اذكر اسمك ورمزك في رسالتك.</div>'+
    '<div style="margin-top:14px;font-size:15px;line-height:2">'+
    '<div><b>'+esc(nm)+'</b></div>'+
    '<div style="direction:ltr;text-align:right;font-family:monospace;font-size:14.5px">'+esc(em)+'</div>'+
    '</div>'+
    '<div class="stack" style="margin-top:16px">'+
    '<a class="btn sm" style="text-decoration:none" href="'+esc(href)+'">فتح بريدي وكتابة رسالة</a>'+
    '<button class="btn sm ghost" onclick="copyEmail()">نسخ البريد</button>'+
    '</div></div>'+

    '<div class="card"><h3>رمزك المصوَّر</h3>'+
    '<div class="note">اعرض هذا الرمز للأستاذ عند طلبه في المحاضرة.</div>'+
    '<div class="qrwrap" id="qrWrap"></div></div>';
}

function drawQR(){
  var w=$('qrWrap');
  if(!w || w.getAttribute('data-done')==='1') return;
  var url = location.origin + location.pathname + '?s=' + encodeURIComponent(S.code);
  w.innerHTML='';
  if(window.__noQR || typeof QRCode==='undefined'){
    w.innerHTML='<div class="qrfall">'+esc(S.code)+'</div>'+
      '<div class="meta" style="margin-top:10px">تعذّر تحميل الرمز المصوَّر — اعرض الرمز أعلاه.</div>';
  } else {
    var box=document.createElement('div'); box.className='qrbox';
    w.appendChild(box);
    try{
      new QRCode(box,{text:url,width:190,height:190,correctLevel:QRCode.CorrectLevel.M});
    }catch(e){
      w.innerHTML='<div class="qrfall">'+esc(S.code)+'</div>';
    }
  }
  w.setAttribute('data-done','1');
}

function copyEmail(){
  var em=(S.info && S.info.teacherEmail) || '';
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(em).then(function(){ toast('نُسخ البريد'); },
      function(){ toast(em); });
  } else toast(em);
}

function lecturesView(){
  var L=S.data.lectures||[];
  if(!L.length) return '<div class="empty">لم تُنشر محاضرات بعد.</div>';
  return L.map(function(l){
    return '<div class="card"><div class="row"><h3>'+esc(l.title)+'</h3>'+
      '<span class="meta">'+fmtDate(l.date)+'</span></div>'+
      (l.note?'<p class="desc">'+esc(l.note)+'</p>':'')+
      (l.url?'<div class="stack"><a class="btn sm" style="text-decoration:none;display:inline-block" href="'+
        esc(l.url)+'" target="_blank" rel="noopener">فتح الملف</a></div>':'')+'</div>';
  }).join('');
}

function assignmentsView(){
  var A=S.data.assignments||[];
  if(!A.length) return '<div class="empty">لا توجد واجبات منشورة.</div>';
  return A.map(function(a,i){ return assignmentCard(a,i); }).join('');
}

function assignmentCard(a,i){
  var s=a.submission;
  var badge = !s ? '<span class="pill none">لم يُسلَّم</span>'
    : (s.total!=null ? '<span class="pill ok">مصحح</span>'
    : (s.status==='متأخر' ? '<span class="pill late">مستلم متأخراً</span>'
    : '<span class="pill wait">قيد التصحيح</span>'));

  var h='<div class="card"><div class="row"><h3>'+esc(a.title)+'</h3>'+badge+'</div>'+
    '<div class="meta">آخر موعد: '+fmtDate(a.due)+' · الدرجة القصوى: '+a.maxScore+'</div>'+
    (a.description?'<p class="desc">'+esc(a.description)+'</p>':'');

  if(a.criteria.length && (!s || s.total==null)){
    h+='<div class="scorecard"><div class="sc-head"><span class="sc-title">معايير التقييم</span></div>'+
      '<div class="sc-body">'+a.criteria.map(function(c){
        return '<div class="crit"><div class="crit-top"><span class="crit-name">'+esc(c.criterion)+
          '</span><span class="crit-pts">'+c.maxPoints+' درجة</span></div>'+
          (c.guide?'<div class="crit-note">'+esc(c.guide)+'</div>':'')+'</div>';
      }).join('')+'</div></div>';
  }

  if(s && s.total!=null){
    h+='<div class="scorecard"><div class="sc-head">'+
      '<div><div class="sc-title">بطاقة التقييم</div><div class="meta">'+esc(s.fileName||'')+'</div></div>'+
      '<div class="seal"><span class="n">'+s.total+'</span><span class="d">من '+a.maxScore+'</span></div></div>'+
      '<div class="sc-body">'+a.criteria.map(function(c){
        var got=Number(s.scores[c.criterionId]||0);
        return '<div class="crit"><div class="crit-top"><span class="crit-name">'+esc(c.criterion)+
          '</span><span class="crit-pts">'+got+' / '+c.maxPoints+'</span></div>'+
          '<div class="bar"><span style="width:'+pct(got,c.maxPoints)+'%"></span></div></div>';
      }).join('')+'</div>'+
      (s.feedback?'<div class="fb">'+esc(s.feedback)+'</div>':'')+'</div>';
  }

  if(!s || s.total==null){
    h+='<div class="filebox">'+
      '<button class="btn sm ghost" onclick="document.getElementById(\'f'+i+'\').click()">'+
        (s?'استبدال الملف':'اختيار الملف')+'</button>'+
      '<input type="file" id="f'+i+'" accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.zip,.png,.jpg,.jpeg" onchange="pick('+i+')">'+
      '<div class="filename" id="fn'+i+'">'+(s?esc(s.fileName):'')+'</div>'+
      '<div class="meta" style="margin-top:8px">الحد الأقصى '+S.info.maxMB+' ميغابايت</div>'+
      '<button class="btn sm hide" id="up'+i+'" style="margin-top:10px" onclick="upload('+i+',\''+a.id+'\')">رفع التسليم</button>'+
      '<div class="prog hide" id="pg'+i+'"><span></span></div>'+
      '<div id="uerr'+i+'"></div></div>';
  } else {
    h+='<div class="meta" style="margin-top:12px">سُلِّم في '+fmtDate(s.submittedAt)+' · '+esc(s.fileName)+'</div>';
  }
  return h+'</div>';
}

var OK_EXT=['pdf','doc','docx','ppt','pptx','xls','xlsx','zip','png','jpg','jpeg'];
var picked={};
function pick(i){
  var f=$('f'+i).files[0]; if(!f) return;
  var mb=f.size/1024/1024, err=$('uerr'+i);
  var ext=f.name.split('.').pop().toLowerCase();
  if(OK_EXT.indexOf(ext)===-1){
    err.innerHTML='<div class="err">نوع الملف غير مقبول. المسموح: '+OK_EXT.join('، ')+'</div>';
    $('up'+i).className='btn sm hide';
    return;
  }
  if(mb>S.info.maxMB){
    err.innerHTML='<div class="err">حجم الملف '+mb.toFixed(1)+' ميغابايت، والحد الأقصى '+
      S.info.maxMB+'. اضغط الملف أو قسّمه.</div>';
    return;
  }
  err.innerHTML=''; picked[i]=f;
  $('fn'+i).textContent=f.name;
  $('up'+i).className='btn sm';
}

function upload(i,aid){
  var f=picked[i]; if(!f) return;
  var b=$('up'+i), pg=$('pg'+i);
  b.disabled=true; b.innerHTML='<span class="spin"></span> جارٍ الرفع';
  pg.className='prog'; pg.firstChild.style.width='25%';

  var r=new FileReader();
  r.onload=function(){
    pg.firstChild.style.width='60%';
    api('upload',{code:S.code,assignmentId:aid,fileName:f.name,
                  mimeType:f.type,base64:r.result.split(',')[1]})
      .then(function(){ pg.firstChild.style.width='100%'; toast('تم رفع التسليم'); load(); })
      .catch(function(e){
        b.disabled=false; b.textContent='رفع التسليم'; pg.className='prog hide';
        $('uerr'+i).innerHTML='<div class="err">'+esc(e.message)+'</div>';
      });
  };
  r.onerror=function(){ b.disabled=false; b.textContent='رفع التسليم'; pg.className='prog hide'; };
  r.readAsDataURL(f);
}

function gradesView(){
  var B=S.data.breakdown;
  if(!B) return '<div class="empty">لم تُرصد درجات بعد.</div>';

  var h='<div class="card"><div class="row">'+
    '<div><h3>الدرجة الحالية</h3><div class="meta">تُحدَّث تلقائياً كلما رُصدت درجة جديدة</div></div>'+
    '<div class="seal"><span class="n">'+B.total+'</span><span class="d">من '+B.outOf+
    (B.bonus.earned?' + '+B.bonus.earned+' مكافأة':'')+'</span></div></div></div>';

  h+='<div class="card"><h3>التفصيل</h3><div class="tblwrap"><table><thead><tr>'+
     '<th>البند</th><th class="num">المحصَّل</th><th class="num">الوزن</th></tr></thead><tbody>';

  h+='<tr><td>امتحان نصف الفصل'+
     (B.exam.max?'<div class="meta">'+B.exam.got+' من '+B.exam.max+'</div>':'<div class="meta">لم يُرصد بعد</div>')+
     '</td><td class="num">'+B.exam.earned+'</td><td class="num">'+B.exam.weight+'</td></tr>';

  h+='<tr><td>الاختبارات الصفّية'+
     (B.quiz.max?'<div class="meta">'+B.quiz.got+' إجابة صحيحة من '+B.quiz.max+'</div>':'<div class="meta">لم تبدأ بعد</div>')+
     '</td><td class="num">'+B.quiz.earned+'</td><td class="num">'+B.quiz.weight+'</td></tr>';

  h+='<tr><td>الواجبات'+
     (B.assign.countedCount
        ? '<div class="meta">'+B.assign.countedCount+' واجب · لكل واجب '+B.assign.perAssignment+' درجة</div>'
        : '<div class="meta">لا توجد واجبات محتسَبة بعد</div>')+
     '</td><td class="num">'+B.assign.earned+'</td><td class="num">'+B.assign.weight+'</td></tr>';

  if(B.bonus.earned)
    h+='<tr><td>مكافأة</td><td class="num">'+B.bonus.earned+'</td><td class="num">حتى '+B.bonus.max+'</td></tr>';

  h+='</tbody></table></div></div>';

  if(B.assign.rows && B.assign.rows.length){
    h+='<div class="card"><h3>تفصيل الواجبات</h3><div class="tblwrap"><table><thead><tr>'+
       '<th>الواجب</th><th class="num">الدرجة</th><th class="num">المحصَّل</th></tr></thead><tbody>';
    B.assign.rows.forEach(function(r){
      var st = r.graded ? (r.raw+' من '+r.rawMax)
             : (r.submitted ? 'بانتظار التصحيح' : 'لم يُسلَّم');
      h+='<tr><td>'+esc(r.title)+'</td><td class="num">'+st+
         '</td><td class="num">'+r.earned+' / '+r.weight+'</td></tr>';
    });
    h+='</tbody></table></div></div>';
  }

  if(B.other && B.other.length){
    h+='<div class="card"><h3>درجات أخرى</h3><div class="meta">خارج التوزيع الرسمي</div>'+
       '<div class="tblwrap"><table><thead><tr><th>البند</th><th>النوع</th>'+
       '<th class="num">الدرجة</th><th class="num">من</th></tr></thead><tbody>'+
       B.other.map(function(g){
         return '<tr><td>'+esc(g.item)+'</td><td>'+esc(g.type)+'</td><td class="num">'+
           g.score+'</td><td class="num">'+g.maxScore+'</td></tr>';
       }).join('')+'</tbody></table></div></div>';
  }
  return h;
}

var curAsg=null, curSubs=[], curMissing=[];

function gradingView(){
  var A=S.data.assignments||[];
  if(!A.length) return '<div class="empty">أنشئ واجباً أولاً من تبويب «الواجبات».</div>';

function loadSubs(id){
  curAsg=id;
  if(!id){ $('subsBox').innerHTML=''; return; }
  $('subsBox').innerHTML='<div class="center">جارٍ التحميل…</div>';
  Promise.all([
    api('submissions',{code:S.code,assignmentId:id}),
    api('missing',{code:S.code,assignmentId:id})
  ]).then(function(res){
    curSubs=res[0]; curMissing=res[1];
    $('subsBox').innerHTML=missingHtml()+subsHtml();
  }).catch(function(e){ $('subsBox').innerHTML='<div class="err">'+esc(e.message)+'</div>'; });

function missingHtml(){
  var a=asgById(curAsg);
  var total=(S.data.students||[]).length;
  if(!curMissing.length){
    return '<div class="card"><div class="row"><h3>المتابعة</h3>'+
      '<span class="pill ok">سلّم الجميع ('+total+')</span></div></div>';
  }
  var rows=curMissing.map(function(m){
    return m.name+'\t'+m.code+(m.section?'\t'+m.section:'');
  }).join('\n');
  return '<div class="card"><div class="row"><h3>لم يسلّموا</h3>'+
    '<span class="pill late">'+curMissing.length+' من '+total+'</span></div>'+
    '<div class="meta">الواجب: '+esc(a?a.title:'')+'</div>'+
    '<div class="tblwrap" style="margin-top:10px"><table><thead><tr>'+
    '<th>الاسم</th><th>الرمز</th><th>الشعبة</th></tr></thead><tbody>'+
    curMissing.map(function(m){
      return '<tr><td>'+esc(m.name)+'</td><td style="letter-spacing:.06em">'+esc(m.code)+
        '</td><td>'+esc(m.section||'—')+'</td></tr>';
    }).join('')+'</tbody></table></div>'+
    '<label style="margin-top:14px">نسخة للتذكير</label>'+
    '<textarea readonly style="min-height:110px;font-family:monospace">'+esc(rows)+'</textarea>'+
    '</div>';
}

function asgById(id){ return (S.data.assignments||[]).filter(function(a){ return a.id===id; })[0]; }

function subsHtml(){
  if(!curSubs.length) return '<div class="empty">لا توجد تسليمات لهذا الواجب بعد.</div>';
  var a=asgById(curAsg);
  return curSubs.map(function(s,i){
    var done=s.total!=null;
    return '<div class="card"><div class="row">'+
      '<div><h3>'+esc(s.name)+'</h3><div class="meta">'+esc(s.code)+' · '+
      fmtDate(s.submittedAt)+' · '+esc(s.status||'')+'</div></div>'+
      (done?'<span class="pill ok">'+s.total+' / '+a.maxScore+'</span>'
           :'<span class="pill wait">بانتظار التصحيح</span>')+'</div>'+
      '<div class="stack">'+
        (s.fileUrl?'<a class="btn sm ghost" style="text-decoration:none" href="'+esc(s.fileUrl)+
          '" target="_blank" rel="noopener">فتح الملف</a>':'')+
        '<button class="btn sm ghost" onclick="toggleGrade('+i+')">'+(done?'تعديل التقييم':'تصحيح')+'</button>'+
      '</div><div id="gr'+i+'" class="hide">'+gradeForm(a,s,i)+'</div></div>';
  }).join('');
}

function toggleGrade(i){ var el=$('gr'+i); el.className = el.className==='hide' ? '' : 'hide'; }

function gradeForm(a,s,i){
  var h='<div class="scorecard" style="margin-top:14px"><div class="sc-body">';
  a.criteria.forEach(function(c){
    var v = s.scores[c.criterionId]!=null ? s.scores[c.criterionId] : '';
    h+='<div class="crit"><div class="crit-top"><span class="crit-name">'+esc(c.criterion)+
      '</span><span class="crit-pts">من '+c.maxPoints+'</span></div>'+
      (c.guide?'<div class="crit-note">'+esc(c.guide)+'</div>':'')+
      '<input type="number" min="0" max="'+c.maxPoints+'" step="0.5" style="margin-top:8px" id="p'+
      i+'_'+c.criterionId+'" value="'+v+'" placeholder="0"></div>';
  });
  return h+'</div></div><label for="fb'+i+'">ملاحظاتك للطالب</label>'+
    '<textarea id="fb'+i+'" placeholder="ما أحسنه، وما يحتاج تحسيناً تحديداً">'+esc(s.feedback||'')+'</textarea>'+
    '<button class="btn sm" style="margin-top:12px" onclick="saveGradeSub('+i+')">حفظ التقييم</button>';
}

function saveGradeSub(i){
  var s=curSubs[i], a=asgById(curAsg), scores={}, bad=false;
  a.criteria.forEach(function(c){
    var el=$('p'+i+'_'+c.criterionId), v=parseFloat(el.value);
    if(isNaN(v)) v=0;
    if(v>c.maxPoints){ bad=true; el.style.borderColor='var(--danger)'; }
    scores[c.criterionId]=v;
  });
  if(bad){ toast('درجة تتجاوز الحد الأقصى للمعيار'); return; }

  api('grade',{code:S.code,submissionId:s.id,scores:scores,feedback:$('fb'+i).value})
    .then(function(r){
      toast('حُفظ التقييم — المجموع '+r.total);
      loadSubs(curAsg);
      api('teacherData',{code:S.code}).then(function(d){ S.data=d; });
    }).catch(function(e){ toast(e.message); });
}

function addCrit(n,m){
  var d=document.createElement('div');
  d.className='crit-row';
  d.innerHTML='<input type="text" class="cName" placeholder="اسم المعيار" value="'+esc(n||'')+'">'+
    '<input type="number" class="cMax" placeholder="الدرجة" min="0" step="0.5" value="'+(m==null?'':m)+'">'+
    '<button class="iconbtn" onclick="this.parentNode.remove()" aria-label="حذف">×</button>';
  $('crits').appendChild(d);
}

function createAsg(){
  var title=$('aT').value.trim();
  if(!title){ toast('اكتب عنوان الواجب'); return; }
  var names=document.querySelectorAll('.cName'), maxs=document.querySelectorAll('.cMax'), criteria=[];
  for(var i=0;i<names.length;i++){
    var n=names[i].value.trim(), m=parseFloat(maxs[i].value);
    if(n && !isNaN(m)) criteria.push({criterion:n,maxPoints:m,guide:''});
  }
  if(!criteria.length){ toast('أضف معياراً واحداً على الأقل'); return; }

  var obj={ title:title, description:$('aD').value, due:$('aDue').value,
            published:$('aPub').checked, counts:$('aCnt').checked, criteria:criteria };
  var wasEdit=!!editAsg;
  if(wasEdit){
    obj.id=editAsg.id;
    var old=editAsg.criteria||[], changed=(old.length!==criteria.length);
    if(!changed) for(var k=0;k<old.length;k++)
      if(old[k].criterion!==criteria[k].criterion || Number(old[k].maxPoints)!==Number(criteria[k].maxPoints)) changed=true;
    if(changed && editAsg.graded &&
       !confirm('غيّرت معايير الروبرك، ويوجد '+editAsg.graded+' تسليم مُصحَّح بالمعايير القديمة.\n\n'+
                'الدرجات المرصودة لن تُحذف، لكنها ستبقى محسوبة على المعايير السابقة وقد لا تطابق الجديدة.\n\nالمتابعة؟')) return;
  }

  api('saveAssignment',{code:S.code,obj:obj})
    .then(function(){ toast(wasEdit?'حُدّث الواجب':'حُفظ الواجب'); editAsg=null; load(); })
    .catch(function(e){ toast(e.message); });
}

function pubToggle(kind,id,val){

}

/* ═══ التعديل والحذف وسلة المحذوفات ═══ */

function startEdit(kind,id){
  var list=(kind==='lecture'?S.data.lectures:S.data.assignments)||[];
  var item=list.filter(function(x){ return x.id===id; })[0];
  if(!item){ toast('العنصر غير موجود'); return; }
  if(kind==='lecture'){ editLec=item; editAsg=null; } else { editAsg=item; editLec=null; }
  render();
  setTimeout(function(){
    var f=$(kind==='lecture'?'lecForm':'asgForm');
    if(f) f.scrollIntoView({behavior:'smooth',block:'start'});
  },30);
}

function cancelEdit(){ editAsg=null; editLec=null; render(); }

function delItem(kind,id){
  var isLec=(kind==='lecture');
  var list=(isLec?S.data.lectures:S.data.assignments)||[];
  var item=list.filter(function(x){ return x.id===id; })[0];
  if(!item) return;
  var msg='نقل '+(isLec?'المحاضرة':'الواجب')+' «'+item.title+'» إلى سلة المحذوفات؟';
  if(!isLec && item.submitted)
    msg+='\n\nتنبيه: مرتبط به '+item.submitted+' تسليم'+
         (item.graded?' ('+item.graded+' مُصحَّح)':'')+'، وستُخفى معه.';
  msg+='\n\nلا شيء يُمحى نهائياً — يمكن استرجاعه من سلة المحذوفات أسفل الصفحة.';
  if(!confirm(msg)) return;

  api('deleteItem',{code:S.code,kind:kind,id:id,value:true})
    .then(function(){
      toast('نُقل إلى سلة المحذوفات');
      if(isLec && editLec && editLec.id===id) editLec=null;
      if(!isLec && editAsg && editAsg.id===id) editAsg=null;
      trashCache=null; load();
    }).catch(function(e){ toast(e.message); });
}

function restoreItem(kind,id){
  api('deleteItem',{code:S.code,kind:kind,id:id,value:false})
    .then(function(){ toast('استُرجع كمسودة — انشره متى شئت'); trashCache=null; load(); })
    .catch(function(e){ toast(e.message); });
}

var trashCache=null, trashOpen=false;

function toggleTrash(){
  trashOpen=!trashOpen;
  if(trashOpen && trashCache===null){
    api('trash',{code:S.code})
      .then(function(d){ trashCache=d; render(); })
      .catch(function(e){ toast(e.message); });

          '</td></tr>';

    '<div class="note">اكتب كل طالب في سطر: <b>الرمز</b> ثم مسافة ثم <b>الدرجة</b>.<br>مثال:<br>AC34FG 8<br>KM7PQR 9.5</div>'+
    '<label for="gI">اسم البند</label><input type="text" id="gI" placeholder="مثال: كويز الأسبوع الثالث">'+
    '<div class="grid2"><div><label for="gT">النوع</label><select id="gT">'+

    '<label for="gL">الرموز والدرجات</label>'+

function giveBonus(){
  var c=$('bC').value.trim();
  if(!c){ toast('اكتب رمز الطالب'); return; }
  api('addBonus',{code:S.code,target:c,amount:$('bA').value,reason:$('bR').value.trim()})
    .then(function(r){
      toast('مكافأة '+r.name+' — مجموعه الآن '+r.total);
      $('bC').value=''; $('bR').value=''; bonusCache=null; render();
    }).catch(function(e){ toast(e.message); });
}

function bulkGrades(){
  var item=$('gI').value.trim();
  if(!item){ toast('اكتب اسم البند'); return; }
  api('bulkGrades',{code:S.code,item:item,type:$('gT').value,maxScore:$('gM').value,text:$('gL').value})
    .then(function(r){ toast('رُصدت '+r.count+' درجة'); $('gL').value=''; })
    .catch(function(e){ toast(e.message); });
}

/* ═══ الإعلان ورابط الاختبار — تحكّم المدرّس ═══ */
var stg=null;
function settingsView(){
  if(stg===null){
    api('settings',{code:S.code}).then(function(d){ stg=d; render(); })
      .catch(function(e){ toast(e.message); });
    return '<div class="card"><div class="meta">جارٍ تحميل الإعدادات…</div></div>';
  }
  return '<div class="card"><h3>الإعلان العام</h3>'+
    '<div class="note">يظهر شريطاً أعلى صفحة كل طالب. يراه عند فتح المنصة أو ضغط «تحديث».</div>'+
    '<textarea id="annT" placeholder="مثال: محاضرة الأحد القادم في القاعة الكبرى">'+esc(stg.announce||'')+'</textarea>'+
    '<div class="check"><input type="checkbox" id="annOn"'+(stg.announceOn?' checked':'')+'>'+
    '<label for="annOn" style="margin:0">إظهاره للطلبة الآن</label></div>'+
    '<button class="btn" style="margin-top:14px" onclick="saveAnn()">حفظ الإعلان</button></div>'+

    '<div class="card"><h3>رابط الاختبار</h3>'+
    '<div class="note">فعّله عند بدء السؤال، وعطّله بعد انتهاء الإجابة. الطالب يراه بعد ضغط «تحديث».</div>'+
    '<label for="qzL">عنوان الزر</label>'+
    '<input type="text" id="qzL" placeholder="السؤال الأول" value="'+esc(stg.quizLabel||'')+'">'+
    '<label for="qzU">الرابط (Google Forms)</label>'+
    '<input type="text" id="qzU" placeholder="https://forms.gle/..." value="'+esc(stg.quizUrl||'')+'">'+
    '<div class="check"><input type="checkbox" id="qzOn"'+(stg.quizOn?' checked':'')+'>'+
    '<label for="qzOn" style="margin:0">مفعّل الآن</label></div>'+
    '<button class="btn" style="margin-top:14px" onclick="saveQuiz()">حفظ الرابط</button></div>';
}

function saveAnn(){
  api('saveSettings',{code:S.code,obj:{announce:$('annT').value,announceOn:$('annOn').checked}})
    .then(function(r){ stg=r.settings; toast('حُفظ الإعلان'); render(); })
    .catch(function(e){ toast(e.message); });
}
function saveQuiz(){
  api('saveSettings',{code:S.code,obj:{
    quizUrl:$('qzU').value.trim(), quizLabel:$('qzL').value.trim(), quizOn:$('qzOn').checked}})
    .then(function(r){ stg=r.settings; toast('حُفظ الرابط'); render(); })
    .catch(function(e){ toast(e.message); });
}

/* ═══ الاختيار العشوائي ═══ */
var picked=[], pickSec='';
function pickView(){
  var St=(S.data.students||[]).filter(function(s){ return s.active!==false; });
  var secs=[]; St.forEach(function(s){ if(s.section && secs.indexOf(s.section)<0) secs.push(s.section); });
  secs.sort();
  var pool=St.filter(function(s){ return !pickSec || s.section===pickSec; });
  var left=pool.filter(function(s){ return picked.indexOf(s.code)<0; });

  var h='<div class="card"><div class="row"><h3>اختيار عشوائي</h3>'+
    '<span class="meta">'+left.length+' من '+pool.length+' متبقٍ</span></div>'+
    '<div class="note">لا يتكرر الاسم حتى تنتهي القائمة أو تُصفّرها.</div>';

  if(secs.length>1){
    h+='<label for="pkSec">الشعبة</label><select id="pkSec" onchange="pickSec=this.value;picked=[];render()">'+
      '<option value=""'+(pickSec?'':' selected')+'>الكل</option>'+
      secs.map(function(x){ return '<option value="'+esc(x)+'"'+(pickSec===x?' selected':'')+'>'+esc(x)+'</option>'; }).join('')+
      '</select>';
  }

  h+='<div class="stack" style="margin-top:14px">'+
    '<button class="btn sm" onclick="doPick()"'+(left.length?'':' disabled')+'>اسحب اسماً</button>'+
    (picked.length?'<button class="btn sm ghost" onclick="picked.pop();render()">تراجع</button>'+
                   '<button class="btn sm ghost" onclick="picked=[];render()">تصفير</button>':'')+
    '</div>';

  if(lastPick) h+='<div class="pickbox"><div class="nm">'+esc(lastPick.name)+'</div>'+
    '<div class="sub">'+esc(lastPick.code)+(lastPick.section?' · شعبة '+esc(lastPick.section):'')+'</div></div>';

  if(picked.length>1){
    h+='<div class="meta" style="margin-top:14px">خرجت أسماؤهم ('+picked.length+'):</div>'+
      '<div style="font-size:14px;line-height:2">'+picked.map(function(c){
        var st=St.filter(function(x){return x.code===c;})[0];
        return st?esc(st.name):esc(c);
      }).join(' · ')+'</div>';
  }
  return h+'</div>';
}

var lastPick=null;
function doPick(){
  var St=(S.data.students||[]).filter(function(s){ return s.active!==false; });
  var pool=St.filter(function(s){ return (!pickSec||s.section===pickSec) && picked.indexOf(s.code)<0; });
  if(!pool.length){ toast('انتهت القائمة'); return; }
  var p=pool[Math.floor(Math.random()*pool.length)];
  picked.push(p.code); lastPick=p; render();
}

/* ═══ فكّ قفل رمز ═══ */
function unlockPrompt(){
  var c=prompt('اكتب رمز الطالب المراد فكّ قفله:');
  if(!c) return;
  api('unlockCode',{code:S.code,target:c.trim()})
    .then(function(){ toast('فُكّ القفل عن '+c.trim().toUpperCase()); })
    .catch(function(e){ toast(e.message); });
}

function studentsAdminView(){
  var St=S.data.students||[];
  var h=settingsView()+pickView()+
    '<div class="card"><div class="row"><h3>قفل الدخول</h3>'+
    '<button class="btn sm ghost" onclick="unlockPrompt()">فكّ قفل رمز</button></div>'+
    '<div class="note">يُقفل الرمز 30 دقيقة بعد 5 محاولات خاطئة. استخدم الزر للفكّ الفوري.</div></div>'+
    '<div class="card"><h3>إضافة طلبة</h3>'+
    '<div class="note">اكتب كل طالب في سطر: <b>الاسم</b> ثم فاصلة ثم <b>الشعبة</b> (اختيارية).<br>ستُولَّد الرموز تلقائياً.</div>'+
    '<textarea id="stL" style="min-height:150px" placeholder="أحمد علي, أ&#10;سارة محمد, ب"></textarea>'+
    '<button class="btn" style="margin-top:14px" onclick="addSt()">إضافة وتوليد الرموز</button>'+
    '<div id="newCodes"></div></div>';

  h+='<div class="card"><div class="row"><h3>الطلبة المسجلون</h3>'+
    '<span class="meta">'+St.length+' طالب</span></div><div class="tblwrap"><table><thead><tr>'+
    '<th>الرمز</th><th>الاسم</th><th>الشعبة</th></tr></thead><tbody>'+
    St.map(function(s){
      return '<tr><td style="font-weight:600;letter-spacing:.06em">'+esc(s.code)+'</td><td>'+
        esc(s.name)+'</td><td>'+esc(s.section||'—')+'</td></tr>';
    }).join('')+'</tbody></table></div></div>';
  return h;
}

function addSt(){
  var t=$('stL').value.trim();
  if(!t){ toast('اكتب أسماء الطلبة'); return; }
  api('addStudents',{code:S.code,text:t}).then(function(r){
    var rows=r.added.map(function(a){ return a.name+'\t'+a.code; }).join('\n');
    $('newCodes').innerHTML='<label>الرموز الجديدة — انسخها وأرسلها لكل طالب</label>'+
      '<textarea style="min-height:160px;font-family:monospace" readonly>'+esc(rows)+'</textarea>';
    $('stL').value='';
    toast('أُضيف '+r.added.length+' طالب');
    api('teacherData',{code:S.code}).then(function(d){ S.data=d; });
  }).catch(function(e){ toast(e.message); });
}
</script>
