<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تكنولوجيا المعلومات في العمل الإداري — اختبار تفاعلي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1B1330;
    --panel:#241A42;
    --panel-light:#2E2153;
    --accent:#F0A83C;
    --accent-soft:#F6C578;
    --mint:#59D9B3;
    --paper:#F2EEF7;
    --paper-dim:#B9AFD1;
    --line:rgba(240,168,60,0.28);
    --good:#59D9B3;
    --bad:#E86A6A;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;
    background:
      radial-gradient(circle at 12% 8%, rgba(89,217,179,0.10), transparent 45%),
      radial-gradient(circle at 88% 92%, rgba(240,168,60,0.12), transparent 45%),
      var(--bg);
    color:var(--paper);
    font-family:'Tajawal', sans-serif;
    min-height:100vh;
  }
  .wrap{max-width:680px;margin:0 auto;padding:44px 20px 56px;}

  header{text-align:center;margin-bottom:34px;}
  .kicker{
    display:inline-flex;align-items:center;gap:10px;
    font-size:13px;letter-spacing:.5px;color:var(--accent-soft);
    background:rgba(240,168,60,0.08);border:1px solid var(--line);
    padding:6px 16px;border-radius:999px;margin-bottom:18px;
  }
  .kicker::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--mint);display:inline-block;}
  .lecture-tag{
    font-family:'Cairo',sans-serif;font-weight:900;font-size:15px;color:var(--mint);
    letter-spacing:.4px;margin-bottom:10px;
  }
  h1{
    font-family:'Cairo', sans-serif;font-weight:900;
    font-size:clamp(24px,4.6vw,34px);margin:0 0 10px;line-height:1.35;
    background:linear-gradient(90deg, var(--accent-soft), #FFFFFF 45%, var(--mint));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  }
  .subtitle{font-family:'Cairo',sans-serif;font-weight:700;font-size:15px;color:var(--paper);opacity:.85;}

  #status-bar{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:14px;font-family:'Cairo',sans-serif;font-weight:700;font-size:14px;color:var(--paper-dim);
  }
  #status-bar span.score{color:var(--accent-soft);}

  #progress-bar-bg{height:8px;border-radius:6px;background:var(--panel-light);overflow:hidden;border:1px solid var(--line);margin-bottom:30px;}
  #progress-bar{height:100%;width:0%;background:linear-gradient(90deg,var(--mint),var(--accent));transition:width .35s ease;border-radius:6px;}

  .qcard{
    background:linear-gradient(160deg, var(--panel-light), var(--panel));
    border:1px solid var(--line);border-radius:18px;
    padding:28px 26px 24px;
  }
  .qnum-label{
    font-family:'Cairo',sans-serif;font-weight:800;font-size:13px;color:var(--accent-soft);
    margin-bottom:12px;letter-spacing:.3px;
  }
  .qtext{font-family:'Cairo',sans-serif;font-weight:700;font-size:19px;line-height:1.75;margin-bottom:22px;}

  .options{display:flex;flex-direction:column;gap:12px;}
  .option{
    display:flex;align-items:flex-start;gap:12px;
    background:rgba(255,255,255,0.03);border:1px solid var(--line);
    border-radius:12px;padding:14px 16px;cursor:pointer;
    transition:background .2s ease, border-color .2s ease, transform .15s ease;
    font-size:15.5px;line-height:1.75;
  }
  .option:hover{background:rgba(240,168,60,0.09);border-color:var(--accent);transform:translateX(-2px);}
  .option .letter{font-family:'Cairo',sans-serif;font-weight:800;color:var(--mint);min-width:20px;}
  .option.correct{background:rgba(89,217,179,0.16);border-color:var(--good);}
  .option.wrong{background:rgba(232,106,106,0.16);border-color:var(--bad);}
  .option.disabled{cursor:default;pointer-events:none;}
  .option .mark{margin-inline-start:auto;font-size:16px;}

  #verdict{
    display:none;margin-top:20px;font-family:'Cairo',sans-serif;font-weight:800;font-size:15.5px;
  }
  #verdict.ok{color:var(--good);}
  #verdict.no{color:var(--bad);}

  #explain{
    display:none;margin-top:12px;
    background:rgba(89,217,179,0.08);border:1px solid rgba(89,217,179,0.45);
    border-radius:12px;padding:15px 17px;font-size:15px;line-height:1.95;color:#DFF6EE;
  }
  #explain .lbl{
    display:block;font-family:'Cairo',sans-serif;font-weight:800;font-size:13.5px;
    color:var(--mint);margin-bottom:7px;
  }
  #explain .ansline{display:block;margin-bottom:9px;color:var(--accent-soft);font-weight:700;}

  #next-btn{
    display:none;width:100%;margin-top:22px;
    background:linear-gradient(90deg,var(--accent),var(--accent-soft));
    color:var(--bg);font-family:'Cairo',sans-serif;font-weight:800;font-size:16px;
    border:none;border-radius:14px;padding:15px;cursor:pointer;
    transition:transform .2s ease, box-shadow .2s ease;
  }
  #next-btn:hover{transform:translateY(-2px);box-shadow:0 14px 26px -10px rgba(240,168,60,0.5);}

  #result-card{
    display:none;text-align:center;
    background:linear-gradient(160deg, var(--panel-light), var(--panel));
    border:1px solid var(--accent);border-radius:18px;padding:40px 26px;
  }
  #result-card h2{font-family:'Cairo',sans-serif;font-weight:900;font-size:22px;color:var(--accent-soft);margin:0 0 6px;}
  #result-card .final-score{font-family:'Cairo',sans-serif;font-weight:900;font-size:50px;color:var(--mint);margin:12px 0;}
  #result-card p{color:var(--paper-dim);font-size:14px;margin:0 0 24px;}
  #restart-btn{
    background:transparent;border:1.5px solid var(--accent);color:var(--accent-soft);
    font-family:'Cairo',sans-serif;font-weight:800;font-size:15px;
    border-radius:12px;padding:12px 28px;cursor:pointer;transition:background .2s ease, color .2s ease;
  }
  #restart-btn:hover{background:var(--accent);color:var(--bg);}

  footer{
    margin-top:38px;text-align:center;padding-top:22px;border-top:1px solid var(--line);
    color:var(--paper-dim);font-size:13.5px;line-height:1.9;
  }
</style>
</head>
<body>

<div class="wrap">

  <header>
    <span class="kicker">اختبار تفاعلي</span>
    <div class="lecture-tag">الوحدة التمهيدية</div>
    <h1>تكنولوجيا المعلومات في العمل الإداري</h1>
    <p class="subtitle">٥٠ سؤال اختيار من متعدد — مستوى متوسط</p>
  </header>

  <div id="status-bar">
    <span id="q-position">سؤال ١ / ٥٠</span>
    <span class="score" id="score-live">النتيجة: ٠</span>
  </div>
  <div id="progress-bar-bg"><div id="progress-bar"></div></div>

  <div class="qcard" id="qcard">
    <div class="qnum-label" id="qnum-label">السؤال ١</div>
    <div class="qtext" id="qtext"></div>
    <div class="options" id="options"></div>
    <div id="verdict"></div>
    <div id="explain">
      <span class="lbl">شرح الإجابة</span>
      <span class="ansline" id="ansline"></span>
      <span id="whytext"></span>
    </div>
    <button id="next-btn" type="button">السؤال التالي ←</button>
  </div>

  <div id="result-card">
    <h2>نتيجتك النهائية</h2>
    <div class="final-score" id="final-score">٠/٥٠</div>
    <p id="final-note"></p>
    <button id="restart-btn" type="button">إعادة الاختبار</button>
  </div>

  <footer>
    المعهد العالي لإعداد وتأهيل القادة<br>
    إعداد: أ.م.د. أمير هادي
  </footer>

</div>

<script>
const QUESTIONS = [
  {q:"تُعرَّف تكنولوجيا المعلومات بأنها مجموعة من:",
   options:["الشبكات الداخلية للمؤسسة دون البيانات أو البرمجيات","الأجهزة والبرامج والشبكات والبيانات المستخدمة لجمع المعلومات ومعالجتها وتخزينها ونقلها واسترجاعها","الأجهزة الحاسوبية والطابعات المكتبية حصراً","البرامج المكتبية المستخدمة في الطباعة والأرشفة الورقية"],
   correct:1,
   why:"التعريف يجمع أربعة مكوّنات: الأجهزة والبرامج والشبكات والبيانات. حصرها بالأجهزة أو البرامج وحدها تعريف ناقص."},
  {q:"ما الهدف الأساسي من توظيف تكنولوجيا المعلومات في المؤسسة الإدارية؟",
   options:["دعم العمل الإداري وترشيد عملية اتخاذ القرار","استبدال الهيكل التنظيمي للمؤسسة بنظام إلكتروني","الاستغناء عن الوثائق الرسمية بشكل كامل","تقليل عدد الموظفين في الدوائر الحكومية"],
   correct:0,
   why:"الغاية دعم الأداء وترشيد القرار، لا تقليص الملاك ولا إلغاء الهيكل التنظيمي أو الوثائق الرسمية."},
  {q:"تمرّ المعلومات في المؤسسة بدورة من خمس مراحل: الجمع، المعالجة، التخزين، النقل، الاسترجاع. ما المرحلة التي تلي «التخزين» مباشرة؟",
   options:["استرجاعها عند الحاجة","معالجتها","جمعها","نقلها"],
   correct:3,
   why:"الترتيب: جمع ← معالجة ← تخزين ← نقل ← استرجاع. فبعد التخزين تأتي مرحلة النقل، والاسترجاع هو المرحلة الأخيرة."},
  {q:"لماذا يُنصح بتصنيف الأعمال الإدارية إلى فئات واضحة قبل اختيار أي تقنية؟",
   options:["لأن التصنيف بديل عن دراسة الجدوى قبل شراء الأنظمة","لأن التصنيف مطلب قانوني في المؤسسات الحكومية","لأن كل تقنية يجب أن تُربط بواحدة أو أكثر من هذه الفئات لتكون ذات جدوى","لأن الأعمال الإدارية لا يمكن أتمتتها إلا بعد تصنيفها رسمياً"],
   correct:2,
   why:"التقنية تُشترى لحلّ مهمة إدارية محددة؛ فبدون تصنيف الأعمال أولاً يتحوّل الشراء إلى قرار عشوائي بلا أثر."},
  {q:"«تلقّي كتاب رسمي من وزارة المالية بخصوص تعليمات الموازنة وإحالته إلى الدائرة المعنية» — إلى أي فئة من الأعمال الإدارية ينتمي هذا المثال؟",
   options:["الملفات والأرشفة","المراسلات والمخاطبات الرسمية","المشتريات والعقود الحكومية","الاجتماعات وقراراتها"],
   correct:1,
   why:"الكتاب الرسمي الوارد وإحالته يقع ضمن المراسلات والمخاطبات (الوارد والصادر والتعاميم)، لا ضمن الأرشفة التي تخصّ الحفظ والاسترجاع."},
  {q:"«تجهيز المستندات والمعاملات استعداداً لزيارة تدقيق من ديوان الرقابة المالية» يمثّل فئة:",
   options:["الامتثال والرقابة المالية والإدارية","دعم عملية اتخاذ القرار","التنسيق الداخلي والخارجي","التخطيط الاستراتيجي"],
   correct:0,
   why:"الاستعداد لجهة رقابية والتأكد من مطابقة المعاملات للتعليمات النافذة هو جوهر وظيفة الامتثال والرقابة."},
  {q:"توجد في كثير من المؤسسات الحكومية دائرة للتخطيط والدراسات تعاني من ضعف ملاكاتها الوظيفية. ما المعالجة الأنسب لتعزيز قدرتها؟",
   options:["دمجها مع الدائرة المالية لتقليل الكلفة","زيادة تخصيصاتها المالية التشغيلية","إصدار تشريع جديد يوسّع صلاحياتها","توظيف أدوات الذكاء الاصطناعي وذكاء الأعمال لتقليل اعتمادها على الجهد البشري المحدود"],
   correct:3,
   why:"حين يكون العجز في الكادر لا في الصلاحية، تكون الأتمتة وأدوات التحليل هي المضاعِف الحقيقي للقدرة الإنتاجية."},
  {q:"ما الفرق الجوهري بين الذكاء الاصطناعي التوليدي والذكاء الاصطناعي التنبؤي؟",
   options:["التوليدي لا يحتاج مراجعة بشرية بخلاف التنبؤي","التوليدي يعمل دون إنترنت والتنبؤي يحتاج اتصالاً دائماً","التوليدي يُنتج محتوى جديداً بناءً على الطلب، والتنبؤي يحلّل بيانات تاريخية لتوقّع نتائج مستقبلية","التوليدي مخصّص للبيانات المالية والتنبؤي للنصوص"],
   correct:2,
   why:"التوليدي مُخرَجه محتوى جديد (نص، تلخيص، عرض)، والتنبؤي مُخرَجه توقّع مبني على أنماط في بيانات سابقة. وكلاهما يحتاج مراجعة بشرية."},
  {q:"ضمن أي أنظمة يُستخدم الذكاء الاصطناعي التنبؤي غالباً؟",
   options:["أنظمة التذاكر","أنظمة ذكاء الأعمال (BI) ودعم اتخاذ القرار","أنظمة إدارة الوثائق الإلكترونية","أنظمة التوقيع الرقمي"],
   correct:1,
   why:"التنبؤ يقوم على تحليل بيانات تاريخية، وهذه وظيفة أنظمة ذكاء الأعمال؛ أما أنظمة الوثائق والتوقيع والتذاكر فوظيفتها تشغيلية لا تحليلية."},
  {q:"ما الوصف الدقيق للأتمتة التقليدية؟",
   options:["تنفيذ خطوات مبرمجة مسبقاً وثابتة (إن حدث كذا، نفّذ كذا) دون فهم أو تفكير","التنبؤ بالنتائج المستقبلية اعتماداً على البيانات التاريخية","إدارة صلاحيات الوصول إلى الوثائق الرسمية","تحليل السياق وتوليد نصوص وأفكار جديدة"],
   correct:0,
   why:"الأتمتة التقليدية تنفّذ قواعد ثابتة فقط؛ والفهم والتحليل والتوليد هي ما يضيفه الذكاء الاصطناعي فوقها."},
  {q:"ماذا يعني مصطلح «الأتمتة الذكية» أو «الوكلاء الذكيون (Agentic AI)»؟",
   options:["برمجة قواعد ثابتة أكثر تعقيداً داخل النظام","استبدال الأتمتة بالعمل اليدوي عند الضرورة","قصر الأتمتة على المهام المالية فقط","أن يتولّى الذكاء الاصطناعي نفسه إدارة وتشغيل عمليات الأتمتة بدل بقائها محدودة بقواعد ثابتة"],
   correct:3,
   why:"الجديد هنا هو انتقال القيادة: بدل أن تُدار الأتمتة بقواعد جامدة، يديرها نموذج يفهم السياق ويقرّر الخطوة التالية."},
  {q:"في معظم تطبيقات الذكاء الاصطناعي في العمل الإداري يتكرر نمط ثابت. ما هو؟",
   options:["طلب المواطن ← تذكرة ← إغلاق","بيانات مالية ← تدقيق ← تقرير رقابي","مدخل خام ← توجيه دقيق بالمطلوب ← مخرج جاهز للاستخدام أو المراجعة السريعة","قرار إداري ← تنفيذ آلي ← أرشفة"],
   correct:2,
   why:"القيمة تتولّد من ثلاث خطوات: مادة خام (نقاط، تقرير، جدول)، ثم توجيه واضح بالمطلوب، ثم مخرج يحتاج مراجعة سريعة فقط."},
  {q:"يستلم معاون مدير عام أكثر من ٦٠ رسالة بريد كل صباح. ما التوظيف الأمثل للذكاء الاصطناعي هنا؟",
   options:["حذف الرسائل غير المعنونة باسمه شخصياً","تلخيص الرسائل وترتيبها حسب الأولوية وصياغة مسودات ردود للرسائل الروتينية للمراجعة قبل الإرسال","تحويل كل الرسائل إلى قسم تقنية المعلومات لفرزها","الرد الآلي على جميع الرسائل دون مراجعة بشرية"],
   correct:1,
   why:"الفكرة اختصار زمن الفرز والصياغة (من ساعة إلى نحو ربع ساعة) مع بقاء قرار الإرسال بيد المسؤول، لا الرد الآلي غير المراجَع."},
  {q:"يستلم مدير عام تقريراً من أربعين صفحة قبل ساعة واحدة من اجتماع مجلس الإدارة. ما المعالجة العملية الأنسب؟",
   options:["تلخيصه إلى صفحة واحدة تُبرز أهم الإنجازات والتحديات والأرقام الرئيسية","توزيعه كاملاً على الأعضاء لقراءته أثناء الاجتماع","إحالته إلى دائرة التخطيط لإعداد ملخص","تأجيل مناقشته إلى الاجتماع القادم"],
   correct:0,
   why:"التلخيص الذكي يحوّل وثيقة طويلة إلى مادة قابلة للنقاش خلال دقائق، بينما الإحالة أو التأجيل يكلّفان وقتاً لا يتوفر."},
  {q:"رُفع ملف Excel يتضمن نفقات دائرة خلال ستة أشهر إلى أداة ذكاء اصطناعي. ما المخرجات المتوقعة؟",
   options:["احتساب الرواتب والمستحقات آلياً","إصدار تقرير امتثال جاهز لجهة الرقابة المالية","إعادة إدخال البيانات في نظام محاسبي جديد","تحديد الأشهر ذات الارتفاع غير المعتاد، واقتراح بنود تحتاج مراجعة، وتوليد رسم بياني للاتجاه العام"],
   correct:3,
   why:"قيمة تحليل البيانات هي استخراج الأنماط غير الظاهرة للعين المجردة؛ أما احتساب الرواتب فوظيفة نظام الموارد البشرية، وتقارير الامتثال وظيفة أنظمة الحوكمة."},
  {q:"ما العناصر التي ينبغي أن يتضمنها محضر اجتماع منظَّم ليكون قابلاً للمتابعة؟",
   options:["تقييم أداء المشاركين في الاجتماع","أسماء الحاضرين والغائبين فقط","نقاط النقاش والقرارات المتخذة والمهام الموزعة مع المدة الزمنية لتنفيذ كل مهمة","الموازنة المخصصة لكل دائرة مشاركة"],
   correct:2,
   why:"المحضر بلا مهام محدّدة ومُهَل زمنية يتحوّل إلى توثيق بلا متابعة؛ فالقرار والمسؤول والمدة هي ما يجعله أداة تنفيذ."},
  {q:"قبل توقيع عقد توريد، ما نوع البنود التي يُفترض كشفها ومراجعتها أولاً؟",

   why:"الرقم المرجعي هو جوهر الفكرة: يمنع ضياع الطلب بين رسائل بريد متناثرة أو مكالمات هاتفية غير موثقة."},

const LETTERS = ["أ","ب","ج","د"];
const AR_NUM = ["٠","١","٢","٣","٤","٥","٦","٧","٨","٩"];
function toArabicDigits(n){
  return String(n).split('').map(d => AR_NUM[d] ?? d).join('');
}

let current = 0;
let score = 0;
let answered = false;

const qPosition = document.getElementById('q-position');
const scoreLive = document.getElementById('score-live');
const progressBar = document.getElementById('progress-bar');
const qcard = document.getElementById('qcard');
const qnumLabel = document.getElementById('qnum-label');
const qtext = document.getElementById('qtext');
const optionsEl = document.getElementById('options');
const verdictEl = document.getElementById('verdict');
const explainEl = document.getElementById('explain');
const ansLine = document.getElementById('ansline');
const whyText = document.getElementById('whytext');
const nextBtn = document.getElementById('next-btn');
const resultCard = document.getElementById('result-card');
const finalScore = document.getElementById('final-score');
const finalNote = document.getElementById('final-note');
const restartBtn = document.getElementById('restart-btn');

const TOTAL_AR = toArabicDigits(QUESTIONS.length);

function renderQuestion(){
  answered = false;
  const item = QUESTIONS[current];
  qPosition.textContent = `سؤال ${toArabicDigits(current+1)} / ${TOTAL_AR}`;
  scoreLive.textContent = `النتيجة: ${toArabicDigits(score)}`;
  progressBar.style.width = `${(current/QUESTIONS.length)*100}%`;
  qnumLabel.textContent = `السؤال ${toArabicDigits(current+1)}`;
  qtext.textContent = item.q;

  optionsEl.innerHTML = '';
  item.options.forEach((optText, oi) => {
    const row = document.createElement('div');
    row.className = 'option';
    const letter = document.createElement('span');
    letter.className = 'letter';
    letter.textContent = LETTERS[oi] + ')';
    const body = document.createElement('span');
    body.textContent = optText;
    row.appendChild(letter);
    row.appendChild(body);
    row.addEventListener('click', () => selectOption(oi, item));
    optionsEl.appendChild(row);
  });

  verdictEl.style.display = 'none';
  verdictEl.className = '';
  explainEl.style.display = 'none';
  nextBtn.style.display = 'none';
  window.scrollTo({top:0, behavior:'smooth'});
}

function selectOption(oi, item){
  if(answered) return;
  answered = true;

  const rows = optionsEl.querySelectorAll('.option');
  rows.forEach((el, idx) => {
    el.classList.add('disabled');
    if(idx === item.correct){
      el.classList.add('correct');
      const m = document.createElement('span');
      m.className = 'mark'; m.textContent = '✔';
      el.appendChild(m);
    } else if(idx === oi){
      el.classList.add('wrong');
      const m = document.createElement('span');
      m.className = 'mark'; m.textContent = '✘';
      el.appendChild(m);
    }
  });

  const right = (oi === item.correct);
  if(right) score++;
  scoreLive.textContent = `النتيجة: ${toArabicDigits(score)}`;

  verdictEl.textContent = right ? '✔ إجابة صحيحة' : '✘ إجابة غير صحيحة';
  verdictEl.className = right ? 'ok' : 'no';
  verdictEl.style.display = 'block';

  ansLine.textContent = `الإجابة الصحيحة: ${LETTERS[item.correct]}) ${item.options[item.correct]}`;
  whyText.textContent = item.why;
  explainEl.style.display = 'block';

  nextBtn.textContent = (current === QUESTIONS.length - 1)
    ? 'عرض النتيجة النهائية ←' : 'السؤال التالي ←';
  nextBtn.style.display = 'block';
}

nextBtn.addEventListener('click', () => {
  if(current === QUESTIONS.length - 1){
    showResult();
  } else {
    current++;
    renderQuestion();
  }
});

function showResult(){
  progressBar.style.width = '100%';
  qcard.style.display = 'none';
  resultCard.style.display = 'block';
  finalScore.textContent = `${toArabicDigits(score)}/${TOTAL_AR}`;
  const pct = Math.round((score/QUESTIONS.length)*100);
  let note = '';
  if(pct >= 85) note = 'أداء ممتاز! 🌟';
  else if(pct >= 60) note = 'أداء جيد، يمكن تحسينه بمراجعة إضافية.';
  else note = 'يُنصح بإعادة الاختبار بعد مراجعة المادة العلمية.';
  finalNote.textContent = note;
  window.scrollTo({top:0, behavior:'smooth'});
}

restartBtn.addEventListener('click', () => {
  current = 0;
  score = 0;
  qcard.style.display = 'block';
  resultCard.style.display = 'none';
  renderQuestion();
});

renderQuestion();
</script>
