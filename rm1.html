<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a2a3d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>دورة قادة المستقبل</title>
<style>
  :root {
    --gold: #c39a63;
    --gold-dark: #8a6d42;
    --navy: #14212f;
    --navy-2: #1c2f42;
    --navy-3: #24405a;
    --bg: #f2efe8;
    --card: #ffffff;
    --text: #1e2a37;
    --muted: #7c8794;
    --border: #eae4d6;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);

    --r1: #1f8f6c; --r1-bg: #e3f3ec;
    --r2: #1d8ca0; --r2-bg: #e0f1f4;
    --r3: #3d5a9e; --r3-bg: #e6eaf6;
    --r4: #7d4fae; --r4-bg: #f0e8f8;
    --r5: #b8860b; --r5-bg: #f7f0dd;
    --r6: #c1502e; --r6-bg: #fbe9e2;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    height: 100%;
    overscroll-behavior-y: none;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== Header (brand only, compact) ===== */
  .app-header {
    background: linear-gradient(160deg, var(--navy) 0%, var(--navy-2) 55%, var(--navy-3) 100%);
    padding: calc(20px + var(--safe-top)) 20px 46px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .app-header::before {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(45deg, rgba(195,154,99,0.05) 0 2px, transparent 2px 38px);
    pointer-events: none;
  }
  .brand-text .t1 {
    position: relative;
    color: #fff;
    font-size: 17px;
    font-weight: 700;
    line-height: 1.3;
  }
  .brand-text .t2 {
    position: relative;
    color: #cdbfa0;
    font-size: 12.5px;
    margin-top: 3px;
  }

  /* ===== Floating big search card ===== */
  .search-card {
    max-width: 520px;
    margin: -30px auto 0;
    padding: 0 16px;
    position: relative;
    z-index: 10;
  }
  .search-box {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--card);
    border-radius: 20px;
    padding: 18px 20px;
    box-shadow: 0 10px 30px rgba(20,33,47,0.16);
    border: 1px solid rgba(255,255,255,0.6);
  }
  .search-box svg { flex-shrink: 0; color: var(--gold-dark); width: 24px; height: 24px; }
  .search-box input {
    border: none;
    outline: none;
    background: transparent;
    font-size: 18px;
    width: 100%;
    color: var(--text);
    font-family: inherit;
    font-weight: 500;
  }
  .search-box input::placeholder { color: #a3aab5; font-weight: 400; }
  .clear-btn {
    display: none;
    background: var(--border);
    color: var(--muted);
    border: none;
    width: 26px; height: 26px;
    border-radius: 50%;
    font-size: 13px;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  .clear-btn.show { display: flex; }

  /* filter chips */
  .chips-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 14px;
  }
  .chip {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    background: var(--card);
    color: var(--muted);
    border: 1px solid var(--border);
    cursor: pointer;
    transition: background .15s, color .15s, transform .1s, border-color .15s;
    white-space: nowrap;
    box-shadow: 0 2px 6px rgba(20,33,47,0.05);
  }
  .chip:active { transform: scale(0.96); }
  .chip .count {
    background: var(--bg);
    padding: 1px 7px;
    border-radius: 10px;
    font-size: 11px;
  }
  .chip.active .count {
    background: rgba(255,255,255,0.25);
    color: #fff;
  }

  /* ===== Content ===== */
  main {
    padding: 18px 16px calc(24px + var(--safe-bottom));
    max-width: 520px;
    margin: 0 auto;
  }

  /* ===== Empty prompt state ===== */
  .empty-state {
    text-align: center;
    padding: 46px 20px 20px;
    color: var(--muted);
  }
  .empty-state .icon {
    width: 64px; height: 64px;
    margin: 0 auto 16px;
    border-radius: 50%;
    background: rgba(195,154,99,0.12);
    display: flex; align-items: center; justify-content: center;
    color: var(--gold-dark);
  }
  .empty-state .title {
    font-size: 15.5px;
    font-weight: 700;
    color: var(--navy);
    margin-bottom: 6px;
  }
  .empty-state .desc {
    font-size: 13px;
    line-height: 1.7;
    max-width: 260px;
    margin: 0 auto;
  }

  .result-count {
    margin: 2px 4px 10px;
    font-size: 12.5px;
    color: var(--muted);
    display: none;
    align-items: center;
    justify-content: space-between;
  }
  .result-count b { color: var(--navy); }

  /* ===== Result list ===== */
  .results-list {
    display: flex;
    flex-direction: column;
    gap: 9px;
  }
  .stud-item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 2px 6px rgba(20,33,47,0.05);
    animation: fadeIn .22s ease;
    transition: transform .1s;
  }
  .stud-item:active { transform: scale(0.985); }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(3px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .stud-avatar {
    flex-shrink: 0;
    width: 42px; height: 42px;
    border-radius: 13px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    font-weight: 800;
    color: #fff;
  }

  .stud-info { flex: 1; min-width: 0; }
  .stud-name {
    font-size: 14.5px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 6px;
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .stud-meta {
    display: flex;
    align-items: center;
    gap: 7px;
    flex-wrap: wrap;
  }
  .code-badge {
    font-family: 'SF Mono', 'Consolas', monospace;
    font-weight: 700;
    letter-spacing: 0.5px;
    background: #fbf4e7;
    color: var(--gold-dark);
    border: 1px solid #ecd9b8;
    padding: 3px 9px;
    border-radius: 7px;
    font-size: 12px;
  }
  .room-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 9px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
    white-space: nowrap;
  }
  .room-badge::before {
    content: "";
    width: 6px; height: 6px;
    border-radius: 50%;
    background: currentColor;
  }

  mark {
    background: rgba(195,154,99,0.4);
    color: inherit;
    border-radius: 3px;
    padding: 0 1px;
  }

  .no-results {
    text-align: center;
    padding: 50px 20px;
    color: var(--muted);
    display: none;
  }
  .no-results.show { display: block; }
  .no-results .icon {
    width: 60px; height: 60px;
    margin: 0 auto 14px;
    border-radius: 50%;
    background: var(--card);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    color: var(--gold-dark);
  }
  .no-results .title { font-size: 14.5px; font-weight: 700; color: var(--navy); margin-bottom: 4px; }
  .no-results .desc { font-size: 12.5px; }

  @media (min-width: 560px) {
    .brand-text .t1 { font-size: 19px; }
  }
</style>
</head>

const ROOM_COLORS = {
  'قاعة الانتصار - 1': { c: '#1f8f6c', bg: '#e3f3ec' },
  'قاعة الانتصار - 2': { c: '#1d8ca0', bg: '#e0f1f4' },
  'قاعة الانتصار - 3': { c: '#3d5a9e', bg: '#e6eaf6' },
  'قاعة الانتصار - 4': { c: '#7d4fae', bg: '#f0e8f8' },
  'قاعة دجلة':          { c: '#b8860b', bg: '#f7f0dd' },
  'قاعة الفرات':        { c: '#c1502e', bg: '#fbe9e2' },
};
const ROOM_ORDER = Object.keys(ROOM_COLORS);

const searchInput = document.getElementById('searchInput');
const clearBtn = document.getElementById('clearBtn');
const resultsList = document.getElementById('resultsList');
const resultCount = document.getElementById('resultCount');
const noResults = document.getElementById('noResults');
const emptyState = document.getElementById('emptyState');
const chipsRow = document.getElementById('chipsRow');

let activeRoom = null;

function toArabicNum(num) {
  const arabicDigits = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
  return String(num).replace(/[0-9]/g, d => arabicDigits[d]);
}

// build chips
chipsRow.innerHTML = ROOM_ORDER.map(room => {
  const count = students.filter(s => s.room === room).length;
  const shortLabel = room.replace('قاعة الانتصار - ', 'الانتصار ').replace('قاعة ', '');
  return `<div class="chip" data-room="${room}" style="--c:${ROOM_COLORS[room].c}">${shortLabel} <span class="count">${toArabicNum(count)}</span></div>`;
}).join('');

function escapeHtml(str) {
  return str.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function highlight(text, query) {
  if (!query) return escapeHtml(text);
  const escaped = escapeHtml(text);
  const escapedQuery = escapeHtml(query).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const re = new RegExp('(' + escapedQuery + ')', 'gi');
  return escaped.replace(re, '<mark>$1</mark>');
}

function initials(name) {
  const parts = name.trim().split(/\s+/);
  return parts[0] ? parts[0][0] : 'ط';
}

function render() {
  const q = searchInput.value.trim().toLowerCase();
  clearBtn.classList.toggle('show', q.length > 0);

  const hasQuery = q.length > 0;
  const hasRoomFilter = activeRoom !== null;

  if (!hasQuery && !hasRoomFilter) {
    emptyState.style.display = 'block';
    resultCount.style.display = 'none';
    resultsList.innerHTML = '';
    resultsList.style.display = 'none';
    noResults.classList.remove('show');
    return;
  }

  emptyState.style.display = 'none';

  let filtered = students;
  if (hasRoomFilter) {
    filtered = filtered.filter(s => s.room === activeRoom);
  }
  if (hasQuery) {
    filtered = filtered.filter(s => s.name.toLowerCase().includes(q) || s.code.includes(q));
  }

  resultsList.innerHTML = filtered.map(s => {
    const rc = ROOM_COLORS[s.room] || { c: '#888', bg: '#eee' };
    return `
    <div class="stud-item">
      <div class="stud-avatar" style="background:${rc.c}">${initials(s.name)}</div>
      <div class="stud-info">
        <div class="stud-name">${highlight(s.name, searchInput.value.trim())}</div>
        <div class="stud-meta">
          <span class="code-badge">${highlight(s.code, searchInput.value.trim())}</span>
          <span class="room-badge" style="background:${rc.bg};color:${rc.c}">${s.room}</span>
        </div>
      </div>
    </div>
  `;
  }).join('');

  const isEmpty = filtered.length === 0;
  resultCount.innerHTML = `<span>تم العثور على <b>${toArabicNum(filtered.length)}</b> نتيجة</span>`;
  resultCount.style.display = isEmpty ? 'none' : 'flex';
  resultsList.style.display = isEmpty ? 'none' : 'flex';
  noResults.classList.toggle('show', isEmpty);
}

searchInput.addEventListener('input', render);
clearBtn.addEventListener('click', () => {
  searchInput.value = '';
  render();
  searchInput.focus();
});

chipsRow.addEventListener('click', (e) => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  const room = chip.dataset.room;
  if (chip.classList.contains('active')) {
    chip.classList.remove('active');
    chip.style.background = '';
    chip.style.color = '';
    chip.style.borderColor = '';
    activeRoom = null;
  } else {
    chipsRow.querySelectorAll('.chip').forEach(c => {
      c.classList.remove('active');
      c.style.background = '';
      c.style.color = '';
      c.style.borderColor = '';
    });
    chip.classList.add('active');
    const col = ROOM_COLORS[room].c;
    chip.style.background = col;
    chip.style.color = '#fff';
    chip.style.borderColor = col;
    activeRoom = room;
  }
  render();
});

render();
</script>
