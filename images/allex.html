<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختبار تفاعلي — برنامج القيادة الرقمية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink-navy:#0E1B33;
    --panel-navy:#152443;
    --panel-navy-light:#1C2E54;
    --gold:#C9A24B;
    --gold-soft:#E4C98A;
    --teal:#4FB3A9;
    --paper:#F3EFE6;
    --paper-dim:#C9C3B4;
    --line:rgba(201,162,75,0.28);
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    background:
      radial-gradient(circle at 12% 8%, rgba(79,179,169,0.10), transparent 45%),
      radial-gradient(circle at 88% 92%, rgba(201,162,75,0.10), transparent 45%),
      var(--ink-navy);
    color:var(--paper);
    font-family:'Tajawal', sans-serif;
    min-height:100vh;
  }

  .wrap{
    max-width:980px;
    margin:0 auto;
    padding:56px 24px 40px;
  }

  /* ===== Header ===== */
  header{
    text-align:center;
    margin-bottom:52px;
    position:relative;
  }

  .kicker{
    display:inline-flex;
    align-items:center;
    gap:10px;
    font-family:'Tajawal',sans-serif;
    font-size:14px;
    letter-spacing:.5px;
    color:var(--gold-soft);
    background:rgba(201,162,75,0.08);
    border:1px solid var(--line);
    padding:7px 18px;
    border-radius:999px;
    margin-bottom:24px;
  }

  .kicker::before, .kicker::after{
    content:"";
    width:5px;height:5px;
    border-radius:50%;
    background:var(--teal);
    display:inline-block;
  }

  h1{
    font-family:'Cairo', sans-serif;
    font-weight:900;
    font-size:clamp(32px, 5vw, 50px);
    margin:0 0 14px;
    line-height:1.25;
    background:linear-gradient(90deg, var(--gold-soft), #FFFFFF 45%, var(--teal));
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
  }

  .subtitle{
    font-family:'Cairo', sans-serif;
    font-weight:700;
    font-size:clamp(16px, 2.4vw, 20px);
    color:var(--paper);
    opacity:.92;
    margin:0 auto;
    letter-spacing:.3px;
  }

  .subtitle span{color:var(--teal);}

  .rule{
    width:120px;
    height:3px;
    margin:26px auto 0;
    background:linear-gradient(90deg, transparent, var(--gold), transparent);
    border-radius:3px;
  }

  /* ===== Cards grid ===== */
  .grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:22px;
    margin-bottom:16px;
  }

  @media (max-width:640px){
    .grid{grid-template-columns:1fr;}
  }

  .card{
    position:relative;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    background:linear-gradient(160deg, var(--panel-navy-light), var(--panel-navy));
    border:1px solid var(--line);
    border-radius:18px;
    padding:26px 26px 22px;
    text-decoration:none;
    color:inherit;
    overflow:hidden;
    transition:transform .25s ease, border-color .25s ease, box-shadow .25s ease;
    min-height:158px;
  }

  .card::after{
    content:"";
    position:absolute;
    inset:0;
    background:radial-gradient(circle at 100% 0%, rgba(201,162,75,0.16), transparent 55%);
    opacity:0;
    transition:opacity .3s ease;
  }

  .card:hover{
    transform:translateY(-4px);
    border-color:var(--gold);
    box-shadow:0 18px 34px -14px rgba(0,0,0,0.55);
  }

  .card:hover::after{opacity:1;}

  .card-top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:14px;
    position:relative;
    z-index:1;
  }

  .lecture-num{
    font-family:'Cairo', sans-serif;
    font-weight:900;
    font-size:38px;
    line-height:1;
    color:var(--gold);
    opacity:.85;
    min-width:52px;
  }

  .card-title{
    font-family:'Cairo', sans-serif;
    font-weight:700;
    font-size:19px;
    line-height:1.5;
    text-align:right;
    flex:1;
  }

  .card-foot{
    position:relative;
    z-index:1;
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:20px;
    padding-top:14px;
    border-top:1px dashed var(--line);
  }

  .go-label{
    font-family:'Tajawal', sans-serif;
    font-size:13px;
    color:var(--teal);
    font-weight:500;
  }

  .arrow{
    width:32px;height:32px;
    border-radius:50%;
    border:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--gold-soft);
    transition:background .25s ease, transform .25s ease;
    flex-shrink:0;
  }

  .card:hover .arrow{
    background:var(--gold);
    color:var(--ink-navy);
    transform:translateX(-4px);
  }

  /* ===== Footer ===== */
  footer{
    margin-top:56px;
    text-align:center;
    padding-top:26px;
    border-top:1px solid var(--line);
    color:var(--paper-dim);
    font-family:'Tajawal', sans-serif;
    font-size:14px;
    letter-spacing:.2px;
  }

  footer strong{
    color:var(--gold-soft);
    font-weight:700;
  }

  @media (prefers-reduced-motion: reduce){
    .card, .arrow{transition:none;}
  }
</style>
</head>
<body>

<div class="wrap">

  <header>
    <span class="kicker">القيادة الرقمية · اختبارات المحاضرات</span>
    <h1>مرشحات </h1>
    <p class="subtitle">برنامج القيادة الرقمية — <span>الدبلوم العالي</span></p>
    <div class="rule"></div>
  </header>

  <main class="grid">

    <a class="card" href="https://ameerkhadi.github.io/academic-cv-website/ex10" target="_blank" rel="noopener">
      <div class="card-top">
        <div class="lecture-num">١٠</div>
        <div class="card-title">مرشحات محاضرة ١٠</div>
      </div>
      <div class="card-foot">
        <span class="go-label">ابدأ الاختبار</span>
        <span class="arrow">←</span>
      </div>
    </a>

    <a class="card" href="https://ameerkhadi.github.io/academic-cv-website/ex7" target="_blank" rel="noopener">
      <div class="card-top">
        <div class="lecture-num">٧</div>
        <div class="card-title">مرشحات محاضرة ٧</div>
      </div>
      <div class="card-foot">
        <span class="go-label">ابدأ الاختبار</span>
        <span class="arrow">←</span>
      </div>
    </a>

    <a class="card" href="https://ameerkhadi.github.io/academic-cv-website/ex6" target="_blank" rel="noopener">
      <div class="card-top">
        <div class="lecture-num">٦</div>
        <div class="card-title">مرشحات محاضرة ٦</div>
      </div>
      <div class="card-foot">
        <span class="go-label">ابدأ الاختبار</span>
        <span class="arrow">←</span>
      </div>
    </a>

    <a class="card" href="https://ameerkhadi.github.io/academic-cv-website/ex4" target="_blank" rel="noopener">
      <div class="card-top">
        <div class="lecture-num">٤</div>
        <div class="card-title">مرشحات محاضرة ٤</div>
      </div>
      <div class="card-foot">
        <span class="go-label">ابدأ الاختبار</span>
        <span class="arrow">←</span>
      </div>
    </a>

  </main>

  <footer>
    <strong>المعهد العالي لإعداد وتأهيل القادة</strong> · إعداد: أ.م.د. أمير هادي
  </footer>

</div>

</body>
</html>
