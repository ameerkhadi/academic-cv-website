<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المحاضرة 3 — اختبار تفاعلي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1B1330;
    --panel:#241A42;
    --panel-light:#2E2153;
    --accent:#F0A83C;
    --accent-soft:#F6C578;
    --mint:#59D9B3;
    --paper:#F2EEF7;
    --paper-dim:#B9AFD1;
    --line:rgba(240,168,60,0.28);
    --good:#59D9B3;
    --bad:#E86A6A;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;
    background:
      radial-gradient(circle at 12% 8%, rgba(89,217,179,0.10), transparent 45%),
      radial-gradient(circle at 88% 92%, rgba(240,168,60,0.12), transparent 45%),
      var(--bg);
    color:var(--paper);
    font-family:'Tajawal', sans-serif;
    min-height:100vh;
  }
  .wrap{max-width:680px;margin:0 auto;padding:44px 20px 56px;}

  header{text-align:center;margin-bottom:34px;}
  .kicker{
    display:inline-flex;align-items:center;gap:10px;
    font-size:13px;letter-spacing:.5px;color:var(--accent-soft);
    background:rgba(240,168,60,0.08);border:1px solid var(--line);
    padding:6px 16px;border-radius:999px;margin-bottom:18px;
  }
  .kicker::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--mint);display:inline-block;}
  .lecture-tag{
    font-family:'Cairo',sans-serif;font-weight:900;font-size:15px;color:var(--mint);
    letter-spacing:.4px;margin-bottom:10px;
  }
  h1{
    font-family:'Cairo', sans-serif;font-weight:900;
    font-size:clamp(24px,4.6vw,34px);margin:0 0 10px;line-height:1.35;
    background:linear-gradient(90deg, var(--accent-soft), #FFFFFF 45%, var(--mint));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  }
  .subtitle{font-family:'Cairo',sans-serif;font-weight:700;font-size:15px;color:var(--paper);opacity:.85;}

  #status-bar{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:14px;font-family:'Cairo',sans-serif;font-weight:700;font-size:14px;color:var(--paper-dim);
  }
  #status-bar span.score{color:var(--accent-soft);}

  #progress-bar-bg{height:8px;border-radius:6px;background:var(--panel-light);overflow:hidden;border:1px solid var(--line);margin-bottom:30px;}
  #progress-bar{height:100%;width:0%;background:linear-gradient(90deg,var(--mint),var(--accent));transition:width .35s ease;border-radius:6px;}

  .qcard{
    background:linear-gradient(160deg, var(--panel-light), var(--panel));
    border:1px solid var(--line);border-radius:18px;
    padding:28px 26px 24px;
  }
  .qnum-label{
    font-family:'Cairo',sans-serif;font-weight:800;font-size:13px;color:var(--accent-soft);
    margin-bottom:12px;letter-spacing:.3px;
  }
  .qtext{font-family:'Cairo',sans-serif;font-weight:700;font-size:19px;line-height:1.7;margin-bottom:22px;}

  .options{display:flex;flex-direction:column;gap:12px;}
  .option{
    display:flex;align-items:center;gap:12px;
    background:rgba(255,255,255,0.03);border:1px solid var(--line);
    border-radius:12px;padding:14px 16px;cursor:pointer;
    transition:background .2s ease, border-color .2s ease, transform .15s ease;
    font-size:15.5px;line-height:1.6;
  }
  .option:hover{background:rgba(240,168,60,0.09);border-color:var(--accent);transform:translateX(-2px);}
  .option .letter{font-family:'Cairo',sans-serif;font-weight:800;color:var(--mint);min-width:20px;}
  .option.correct{background:rgba(89,217,179,0.16);border-color:var(--good);}
  .option.wrong{background:rgba(232,106,106,0.16);border-color:var(--bad);}
  .option.disabled{cursor:default;pointer-events:none;}

  #next-btn{
    display:none;width:100%;margin-top:22px;
    background:linear-gradient(90deg,var(--accent),var(--accent-soft));
    color:var(--bg);font-family:'Cairo',sans-serif;font-weight:800;font-size:16px;
    border:none;border-radius:14px;padding:15px;cursor:pointer;
    transition:transform .2s ease, box-shadow .2s ease;
  }
  #next-btn:hover{transform:translateY(-2px);box-shadow:0 14px 26px -10px rgba(240,168,60,0.5);}

  #result-card{
    display:none;text-align:center;
    background:linear-gradient(160deg, var(--panel-light), var(--panel));
    border:1px solid var(--accent);border-radius:18px;padding:40px 26px;
  }
  #result-card h2{font-family:'Cairo',sans-serif;font-weight:900;font-size:22px;color:var(--accent-soft);margin:0 0 6px;}
  #result-card .final-score{font-family:'Cairo',sans-serif;font-weight:900;font-size:50px;color:var(--mint);margin:12px 0;}
  #result-card p{color:var(--paper-dim);font-size:14px;margin:0 0 24px;}
  #restart-btn{
    background:transparent;border:1.5px solid var(--accent);color:var(--accent-soft);
    font-family:'Cairo',sans-serif;font-weight:800;font-size:15px;
    border-radius:12px;padding:12px 28px;cursor:pointer;transition:background .2s ease, color .2s ease;
  }
  #restart-btn:hover{background:var(--accent);color:var(--bg);}

  footer{
    margin-top:40px;text-align:center;padding-top:22px;border-top:1px solid var(--line);
    color:var(--paper-dim);font-size:13.5px;
  }
</style>
</head>
<body>

<div class="wrap">

  <header>
    <span class="kicker">اختبار تفاعلي</span>
    <div class="lecture-tag">المحاضرة 3</div>
    <h1>البنية التحتية الرقمية</h1>
    <p class="subtitle">برنامج القيادة الرقمية — الدبلوم العالي</p>
  </header>

  <div id="status-bar">
    <span id="q-position">سؤال ١ / 11</span>
    <span class="score" id="score-live">النتيجة: 0</span>
  </div>
  <div id="progress-bar-bg"><div id="progress-bar"></div></div>

  <div class="qcard" id="qcard">
    <div class="qnum-label" id="qnum-label">السؤال ١</div>
    <div class="qtext" id="qtext"></div>
    <div class="options" id="options"></div>
    <button id="next-btn" type="button">السؤال التالي ←</button>
  </div>

  <div id="result-card">
    <h2>نتيجتك النهائية</h2>
    <div class="final-score" id="final-score">0/0</div>
    <p id="final-note"></p>
    <button id="restart-btn" type="button">إعادة الاختبار</button>
  </div>

  <footer>المعهد العالي لإعداد وتأهيل القادة</footer>

</div>

<script>
const QUESTIONS = [
  {q:"وفقاً لتعريف الاتحاد الدولي للاتصالات (ITU)، ماذا تشمل البنية التحتية الرقمية؟",
   options:["الأنظمة والتجهيزات التقنية اللازمة للوصول إلى الخدمات الرقمية واستخدامها","الأصول المادية فقط دون البرمجيات","شبكات الكهرباء التقليدية فقط","المؤسسات الحكومية فقط"],
   correct:0},
  {q:"ما هي نسبة حركة البيانات العالمية التي تُنقل عبر الكابلات الضوئية البحرية؟",
   options:["50%","75%","أكثر من 97%","25%"],
   correct:2},
  {q:"ما هو معدّل التوافر لمركز بياناتٍ من الفئة Tier IV؟",
   options:["99.671%","99.741%","99.982%","99.995%"],
   correct:3},
  {q:"أيّ نموذج من نماذج الحوسبة السحابية يوفّر بيئة تطوير ونشر متكاملة للمطوّرين؟",
   options:["IaaS","PaaS","SaaS","DaaS"],
   correct:1},
  {q:"كم بلغ حجم السوق العالمي للحوسبة السحابية في عام 2024 بحسب Gartner؟",
   options:["300 مليار دولار","679 مليار دولار","1 تريليون دولار","1.6 تريليون دولار"],
   correct:1},
  {q:"ما هو المبدأ الذي يقوم عليه نموذج الثقة الصفرية (Zero Trust Architecture)؟",
   options:["الثقة الكاملة بالشبكة الداخلية","«لا تثق بأحد، تحقّق من الجميع»","الاعتماد على كلمة مرور واحدة فقط","إلغاء التشفير لتسريع الأداء"],
   correct:1},
  {q:"كم عدد أجهزة إنترنت الأشياء (IoT) المتصلة عالمياً المتوقّع بحلول عام 2030 بحسب Statista؟",
   options:["10 مليار جهاز","20 مليار جهاز","32 مليار جهاز","50 مليار جهاز"],
   correct:2},
  {q:"كم بلغت التكلفة المتوسطة لاختراق البيانات عالمياً في عام 2024 بحسب تقرير IBM؟",
   options:["2.5 مليون دولار","3.9 مليون دولار","4.88 مليون دولار","6 مليون دولار"],
   correct:2},
  {q:"أيّ من الخصائص التالية تُعدّ من المبادئ الأساسية لعمل تقنية البلوك تشين؟",
   options:["المركزية الكاملة للبيانات","اللامركزية وتوزيع نسخ السجل على جميع العُقد","الاعتماد الكامل على وسيط مالي","غياب الشفافية بين المشاركين"],
   correct:1},
  {q:"ما هي السرعة القصوى التقريبية لشبكات الجيل الخامس (5G) بحسب الجدول الوارد في النص؟",
   options:["1 Gbps","7.2 Mbps","20 Gbps","100 Gbps"],
   correct:2},
  {q:"كم تتوقّع مؤسسة McKinsey Global Institute أن تُسهم البنية التحتية الرقمية بخلقه من قيمةٍ اقتصاديةٍ عالميةٍ بحلول 2030؟",
   options:["10 تريليون دولار","15 تريليون دولار","25 تريليون دولار","40 تريليون دولار"],
   correct:2}
];

const LETTERS = ["أ","ب","ج","د"];
const AR_NUM = ["٠","١","٢","٣","٤","٥","٦","٧","٨","٩"];
function toArabicDigits(n){
  return String(n).split('').map(d => AR_NUM[d] ?? d).join('');
}

let current = 0;
let score = 0;
let answered = false;

const qPosition = document.getElementById('q-position');
const scoreLive = document.getElementById('score-live');
const progressBar = document.getElementById('progress-bar');
const qcard = document.getElementById('qcard');
const qnumLabel = document.getElementById('qnum-label');
const qtext = document.getElementById('qtext');
const optionsEl = document.getElementById('options');
const nextBtn = document.getElementById('next-btn');
const resultCard = document.getElementById('result-card');
const finalScore = document.getElementById('final-score');
const finalNote = document.getElementById('final-note');
const restartBtn = document.getElementById('restart-btn');

function renderQuestion(){
  answered = false;
  const item = QUESTIONS[current];
  qPosition.textContent = `سؤال ${toArabicDigits(current+1)} / ${QUESTIONS.length}`;
  scoreLive.textContent = `النتيجة: ${score}`;
  progressBar.style.width = `${(current/QUESTIONS.length)*100}%`;
  qnumLabel.textContent = `السؤال ${toArabicDigits(current+1)}`;
  qtext.textContent = item.q;

  optionsEl.innerHTML = '';
  item.options.forEach((optText, oi) => {
    const label = document.createElement('div');
    label.className = 'option';
    label.innerHTML = `<span class="letter">${LETTERS[oi]})</span><span>${optText}</span>`;
    label.addEventListener('click', () => selectOption(oi, label, item));
    optionsEl.appendChild(label);
  });

  nextBtn.style.display = 'none';
}

function selectOption(oi, label, item){
  if(answered) return;
  answered = true;

  const allOptions = optionsEl.querySelectorAll('.option');
  allOptions.forEach((el, idx) => {
    el.classList.add('disabled');
    if(idx === item.correct) el.classList.add('correct');
    else if(idx === oi) el.classList.add('wrong');
  });

  if(oi === item.correct) score++;
  scoreLive.textContent = `النتيجة: ${score}`;

  if(current === QUESTIONS.length - 1){
    nextBtn.textContent = 'عرض النتيجة النهائية ←';
  } else {
    nextBtn.textContent = 'السؤال التالي ←';
  }
  nextBtn.style.display = 'block';
}

nextBtn.addEventListener('click', () => {
  if(current === QUESTIONS.length - 1){
    showResult();
  } else {
    current++;
    renderQuestion();
  }
});

function showResult(){
  progressBar.style.width = '100%';
  qcard.style.display = 'none';
  resultCard.style.display = 'block';
  finalScore.textContent = `${score}/${QUESTIONS.length}`;
  const pct = Math.round((score/QUESTIONS.length)*100);
  let note = '';
  if(pct >= 85) note = 'أداء ممتاز! 🌟';
  else if(pct >= 60) note = 'أداء جيد، يمكن تحسينه بمراجعة إضافية.';
  else note = 'يُنصح بمراجعة محتوى المحاضرة مرة أخرى.';
  finalNote.textContent = note;
}

restartBtn.addEventListener('click', () => {
  current = 0;
  score = 0;
  qcard.style.display = 'block';
  resultCard.style.display = 'none';
  renderQuestion();
});

renderQuestion();
</script>

</body>
</html>
