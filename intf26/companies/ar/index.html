<title>دليل شركات INTF 2026 الذكي</title>
<style>
:root{--bg:#f4f5fa;--card:#fff;--ink:#1c2155;--mut:#6b7090;--line:#d8dbea;--acc:#c0962e;--chip:#e6e9f6;--ok:#1f9d6a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#0b0d24;--card:#141839;--ink:#e4e7f8;--mut:#a3a8d0;--line:#2a2f66;--chip:#1b2054;color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0d24;--card:#141839;--ink:#e4e7f8;--mut:#a3a8d0;--line:#2a2f66;--chip:#1b2054}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.6 "Segoe UI",Tahoma,"Noto Naskh Arabic",system-ui,sans-serif;max-width:760px;margin-inline:auto;padding:0 12px 84px;text-align:right}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:10px 0 6px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:21}
.tr{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:18px;margin:0}.sub{color:var(--mut);font-size:12.5px;margin:0}
.ib{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:4px 12px;font-size:14px}
.sr{display:flex;gap:8px;margin-top:8px}
.sin{flex:1;display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 10px;min-width:0}
.sin input{flex:1;background:none;border:0;outline:0;padding:10px 4px;min-width:0}
.fb{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 14px;font-weight:600}
.fb i{position:absolute;top:-6px;inset-inline-start:-6px;background:var(--acc);color:#111;border-radius:10px;font-style:normal;font-size:11px;min-width:18px;padding:0 5px;text-align:center}
.qs{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:5px 12px;font-size:13.5px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--sc,var(--mut));display:inline-block}
.meta{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:13px;margin:10px 2px 6px;gap:8px}
.meta select{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:2px 6px;font-size:13px}
.co{background:var(--card);border-radius:14px;padding:11px 14px;margin-bottom:9px;border-inline-start:5px solid var(--sc);cursor:pointer;position:relative}
.co:active{transform:scale(.985)}
.co h3{margin:0;font-size:16.5px;padding-inline-end:34px;direction:ltr;text-align:right;unicode-bidi:plaintext}
.tg{margin:2px 0 6px;color:var(--mut);font-size:14px}
.bd{display:flex;flex-wrap:wrap;gap:5px}
.b{background:var(--chip);border-radius:8px;padding:1px 8px;font-size:12.5px}
.b.s{background:color-mix(in srgb,var(--sc) 22%,transparent)}
.star{position:absolute;top:6px;inset-inline-end:8px;font-size:23px;line-height:1;padding:4px;color:var(--mut)}
.star[aria-pressed=true]{color:var(--acc)}
.hint{color:var(--mut);font-size:13px;margin:8px 2px}.hint a{color:var(--acc);cursor:pointer;margin-inline-end:8px;text-decoration:underline}
.more{display:block;margin:10px auto;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:7px 22px}
nav{position:fixed;bottom:0;inset-inline:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:25}
nav button{flex:1;max-width:250px;padding:9px 4px;font-size:13.5px;color:var(--mut)}nav button[aria-pressed=true]{color:var(--acc);font-weight:700}
nav b{display:block;font-size:19px;line-height:1.1}
.ov{position:fixed;inset:0;background:#000a;z-index:40;display:none}.ov.on{display:block}
.sh{position:absolute;bottom:0;inset-inline:0;max-width:760px;margin-inline:auto;background:var(--bg);border-radius:20px 20px 0 0;max-height:92%;overflow:auto;padding:14px 16px calc(24px + env(safe-area-inset-bottom,0px));animation:up .25s}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sh h2{margin:0;font-size:20px;direction:ltr;text-align:right;unicode-bidi:plaintext}
.x{position:sticky;top:0;float:inline-start;background:var(--card);border:1px solid var(--line);border-radius:50%;width:34px;height:34px;font-size:18px}
.sec{background:var(--card);border-radius:12px;padding:10px 12px;margin-top:10px}
.sec h4{margin:0 0 4px;font-size:13.5px;color:var(--acc)}
.sec p,.sec li{margin:2px 0;font-size:14.5px;direction:ltr;text-align:left;unicode-bidi:plaintext}
.sec ul{margin:0;padding-inline-start:0;list-style:none}.sec li:before{content:"• "}
.sec.ar p{direction:rtl;text-align:right}
.en{font-size:11.5px;color:var(--mut);font-weight:400;margin-inline-start:6px}
.act{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.btn{background:var(--ink);color:var(--bg);border-radius:12px;padding:7px 14px;font-size:14px;text-decoration:none;display:inline-block}
.btn.o{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.g{background:#1f9d6a;color:#fff}
textarea{width:100%;min-height:64px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px;direction:rtl}
.sim{display:grid;gap:7px}.sim .co{margin:0}
.fg{margin-top:12px}.fg h4{margin:0 0 6px;font-size:14px;color:var(--mut)}.fgc{display:flex;flex-wrap:wrap;gap:6px}
.bar{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:13.5px;cursor:pointer}.bar span:first-child{width:46%;flex:none}
.bar .t{flex:1;background:var(--chip);border-radius:6px;height:18px;overflow:hidden}.bar .t i{display:block;height:100%;background:var(--sc,var(--acc));border-radius:6px}
.bar em{width:30px;font-style:normal;color:var(--mut);text-align:start}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kpi div{background:var(--card);border-radius:12px;padding:10px;text-align:center}.kpi b{display:block;font-size:22px;color:var(--acc)}.kpi span{font-size:12.5px;color:var(--mut)}
.toast{position:fixed;bottom:76px;inset-inline:0;margin-inline:auto;width:max-content;max-width:90%;background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:20px;z-index:60;display:none;font-size:14px}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.v{display:none}.v.on{display:block}
</style>

ified plant-care guidance","smart-agriculture concepts under development"],"mk":"Baghdad / Iraqi home-gardening market.","cp":"","in":"Gardening suppliers, technical advisers, financing and strategic partners for smart-agriculture development.","fl":"ist","c":{"u":""},"pp":204,"pd":207},{"n":72,"nm":"Peak Elevator & Escalator Co.","te":"Elevator and escalator equipment distribution with after-sales services","ta":"توزيع معدات المصاعد والسلالم المتحركة مع خدمات ما بعد البيع","s":2,"l":"العراق (غير محدد)","le":"Iraq","f":0,"r":["موزّع"],"re":["Distributor"],"z":3,"h":0,"y":2013,"ov":"PEAK Elevator & Escalator Co. supplies elevators and escalators and provides after-sales service across Iraq. It identifies itself as KONE’s authorised distributor and describes a fifty-year local distribution legacy. The offer serves construction, healthcare, retail, residential and commercial developments through project supply and associated services. Established in 2013, the company reports a large workforce and seeks contractors and project customers for equipment supply and vertical-transport cooperation.","ft":[],"pr":["Vertical-transport equipment, project supply and aftersales service for construction, healthcare, retail, residential and commercial developments"],"mk":"All Iraq.","cp":"","in":"Contractors and project customers buying elevators, escalators and associated services.","fl":"bs","c":{"u":"peakiraq.com"},"pp":205,"pd":208},{"n":75,"nm":"Pearl of Mesopotamia Contracting and Investments","te":"Roof insulation and waterproofing for residential and commercial buildings","ta":"عزل الأسطح والعزل المائي للمباني السكنية والتجارية","s":2,"l":"بغداد","le":"Baghdad","f":0,"r":["مزوّد خدمات","مستثمر"],"re":["Service provider","Investor"],"z":2,"h":0,"y":2024,"ov":"Pearl of Mesopotamia implements combined thermal, water and acoustic roof insulation for residential, commercial and industrial buildings. Its system includes multi-layer waterproofing, a protective topcoat, drainage slopes and expansion joints, with leak-location and repair also described. The offer is presented as a lighter alternative to conventional roof finishes. It combines roof-protection products and installation methods for prospective construction, property and buildingimprovement discussions.","ft":["Thermal, water and acoustic roof insulation","Protective topcoat and drainage design"],"pr":["Roof thermal insulation","Multi-layer waterproofing & protective topcoat","Drainage slopes & expansion joints","Leak-location & repair approach"],"mk":"","cp":"Baghdad. Company reports installer guarantees of 10-25 years and 40% electricity savings.","in":"Imported roof-system materials, including epoxy and an ambiguously named 'poly-bait' material. customers, developers and joint-venture partners. Requires suitable technical properties, durability and warranty compatibility. Reported budget USD 20,000. within three months.","fl":"bis","c":{"u":""},"pp":206,"pd":209},{"n":203,"nm":"Pharmova","te":"Pharmaceutical training and healthcare business development","ta":"تدريب صيدلاني وتطوير أعمال الرعاية الصحية","s":6,"l":"بغداد","le":"Baghdad","f":0,"r":["مزوّد خدمات"],"re":["Service provider"],"z":1,"h":0,"y":2021,"ov":"Pharmova provides healthcare-sector training, events and pharmaceutical consultancy in Iraq. Its offer covers quality control and assurance, pharmacovigilance, regulatory affairs and healthcare events, alongside pharmaceutical and cosmetics franchise opportunities. Established in 2021, the Baghdad-based small enterprise reports coverage across Iraq. It seeks product, distribution, franchise and manufacturing partners, as well as quality-control technology and regulatory or training expertise, connecting professional services with wider pharmaceutical commercial cooperation.","ft":["Pharmaceutical training and consultancy","Regulatory affairs and pharmacovigilance"],"pr":["Pharmaceutical training, quality control/assurance and pharmacovigilance","Regulatory affairs, health port maps, alerts and data export. The business seeks industrial sensors, gateways, solar kits and precision-irrigation expertise.","ft":["Pilot-stage working prototype","Offline edge control","Multilingual dashboard"],"pr":["Rafid Node solar field sensors. Rafid Gemaal gateway/ pump controller","Soil moisture, salinity, level, flow and energy sensing. LoRa/GSM","Offline pump rules. Arabic/English/Dutch dashboard, maps, alerts and CSV/API export"],"mk":"","cp":"Babil pilot. targets: Karbala, Najaf, Diyala and central/southern Iraq. Up to 20 nodes/month. platform 100+ sites. Minimum 1 pilot site. hardware plus monthly subscription, price on request.","in":"Industrial farm sensors, LoRaWAN gateways, solar kits and precision-irrigation/greenhouse expertise. IP67, 50°C+, low power, LoRaWAN/NB-IoT, CE and open API requested. 50-100 sensors, 3-5 gateways for 3-5 farms. Netherlands/Germany/EU. 3-6 months.","fl":"t","c":{"n":"Dr. Ameer Kadhim Hadi","t":"Founder & CEO","e":"ameer.hadi@uobabylon.edu.iq","p":"+964 780 169 6272","w":"9647801696272","u":"ameer.itbabylon.org","so":[]},"pp":210,"pd":213},{"n":68,"nm":"Rdood Platform","te":"AI sales and customer service software for business messaging","ta":"برمجيات مبيعات وخدمة عملاء بالذكاء الاصطناعي لمراسلات الأعمال","s":1,"l":"بغداد","le":"Baghdad","f":0,"r":["مزوّد خدمات"],"re":["Service provider"],"z":1,"h":0,"y":2026,"ov":"Rdood is an Iraqi AI SaaS platform for sales and customer-service conversations across WhatsApp, Instagram, Facebook Messenger and website chat. It supports Iraqi Arabic, language understanding, lead qualification, CRM capture, automated follow-up and handover to human teams. The cloud-based offer brings several customer-contact channels into one business workflow, with twenty-four-hour operational support described. Its digital approach also reduces reliance on paper-based administration in customer communication.","ft":["WhatsApp, Instagram and web chat","AI follow-up and human handover"],"pr":["Cloud-ba const sv=()=>{try{localStorage.setItem('intfdir-fav',JSON.stringify([...S.fav]));localStorage.setItem('intfdir-notes',JSON.stringify(S.notes))}catch(e){}};
const toast=m=>{const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2200)};
const byN=n=>D.find(c=>c.n===n);
function fcount(){return S.sec.size+S.loc.size+S.role.size+S.size.size+S.reach.size+S.seek.size+S.typ.size}
function pass(c){return(!S.sec.size||S.sec.has(c.s))&&(!S.loc.size||S.loc.has(c.l))&&(!S.role.size||c.r.some(r=>S.role.has(r)))&&(!S.size.size||S.size.has(c.z))&&(!S.reach.size||S.reach.has(c.h))&&(!S.seek.size||[...S.seek].some(k=>c.fl.includes(k)))&&(!S.typ.size||S.typ.has(c.f))}
function run(){const toks=S.q.trim().split(/\s+/).filter(Boolean);let rows=D.filter(pass).map(c=>{let tot=0,all=true;toks.forEach(t=>{const v=scoreTok(c,t);if(v>0)tot+=v;else all=false});return{c,tot,all}});let relaxed=false;
 if(toks.length){let m=rows.filter(r=>r.all);if(!m.length){m=rows.filter(r=>r.tot>0);relaxed=m.length>0}rows=m}
 const so=S.sort==='rel'&&!toks.length?'name':S.sort;
 rows.sort((a,b)=>so==='rel'?b.tot-a.tot||a.c.nm.localeCompare(b.c.nm):so==='name'?a.c.nm.localeCompare(b.c.nm):so==='est'?(b.c.y||0)-(a.c.y||0):so==='size'?b.c.z-a.c.z||a.c.nm.localeCompare(b.c.nm):a.c.n-b.c.n);
 return{rows:rows.map(r=>r.c),relaxed,toks}}
/* ---------- render ---------- */
function card(c){return`<article class="co" data-n="${c.n}" style="--sc:${SECC[c.s]}"><button class="star" data-fav="${c.n}" aria-pressed="${S.fav.has(c.n)}" aria-label="حفظ">${S.fav.has(c.n)?'★':'☆'}</button><h3>${esc(c.nm)}</h3><p class="tg">${esc(c.ta||c.r.join(' · '))}</p><div class="bd"><span class="b s">${SECN[c.s]}</span><span class="b">📍 ${esc(c.l)}</span>${c.z>=0?`<span class="b">${SIZES[c.z]}</span>`:''}${c.f?'<span class="b">🌍 شركة أجنبية</span>':''}${c.h===1?'<span class="b">يصدّر</span>':''}</div></article>`}
function renderList(){const r=run();const{rows}=r;$('cnt').textContent=`النتائج: ${rows.length} من ${D.length}`+(r.relaxed?' · (عرض الأقرب)':'');
 const fb=$('fcnt');fb.hidden=!fcount();fb.textContent=fcount();
 $('list').innerHTML=rows.length?rows.slice(0,S.shown).map(card).join(''):'<div class="empty">لا توجد نتائج. جرّب كلمات أقل أو امسح الفلاتر.</div>';
 const m=$('more');m.hidden=rows.length<=S.shown;m.textContent=`عرض المزيد (${rows.length-S.shown})`;
 const qsl=$('qs').scrollLeft;$('qs').innerHTML=SECN.map((n,i)=>`<button class="chip" data-s="${i}" style="--sc:${SECC[i]}" aria-pressed="${S.sec.has(i)}"><span class="dot"></span>${n}</button>`).join('');
$('qs').scrollLeft=qsl;
 const ex=['دبسار','رافد','طاقة شمسية','موزعين أغذية','برمجيات بغداد','تصدير تمور','تدريب'];
 $('ex').innerHTML='جرّب: '+ex.map(e=>`<a data-ex="${e}">${e}</a>`).join('');
 const f=S.fav.size;$('favn').textContent=f?`قائمتي (${f})`:'قائمتي'}
function renderFav(){const l=[...S.fav].map(byN).filter(Boolean);
 $('fav').innerHTML=l.length?`<div class="act" style="margin:6px 0 10px"><button class="btn" id="fcopy">نسخ القائمة</button><a class="btn g" id="fwa" target="_blank" rel="noopener">مشاركة عبر واتساب</a><button class="btn o" id="fclear">مسح الكل</button></div><div class="sim">${l.map(c=>card(c)+(S.notes[c.n]?`<div class="hint" style="margin:-4px 8px 6px">📝 ${esc(S.notes[c.n])}</div>`:'')).join('')}</div>`:'<div class="empty">قائمتك فارغة.<br>اضغط ☆ على أي شركة لتحفظها هنا وتخطط لاجتماعاتك.</div>';
 if(l.length)$('fwa').href='https://wa.me/?text='+encodeURIComponent(favText())}
function favText(){return'شركات مختارة من منتدى INTF 2026:\n\n'+[...S.fav].map(byN).filter(Boolean).map((c,i)=>`${i+1}. ${c.nm} (${c.l})\n${c.ta||''}\n${[c.c.n,c.c.p,c.c.e,c.c.u].filter(Boolean).join(' | ')}${S.notes[c.n]?'\nملاحظة: '+S.notes[c.n]:''}`).join('\n\n')}
function bar(label,n,max,color,attrs){return`<div class="bar" ${attrs||''} style="--sc:${color||'var(--acc)'}"><span>${label}</span><div class="t"><i style="width:${Math.max(3,n/max*100)}%"></i></div><em>${n}</em></div>`}
function renderStats(){const cnt=(f)=>{const m={};D.forEach(c=>{const k=f(c);(Array.isArray(k)?k:[k]).forEach(x=>{if(x!==''&&x!==-1)m[x]=(m[x]||0)+1})});return Object.entries(m).sort((a,b)=>b[1]-a[1])};
 const sec=cnt(c=>c.s),loc=cnt(c=>c.l).slice(0,8),sz=cnt(c=>c.z),rch=cnt(c=>c.h),sk=cnt(c=>c.fl.split('')),ro=cnt(c=>c.r).slice(0,6);
 const iq=D.filter(c=>!c.f).length;
 $('stats').innerHTML=`<div class="kpi" style="margin-top:8px"><div><b>${D.length}</b><span>شركة</span></div><div><b>${iq}</b><span>عراقية</span></div><div><b>${D.length-iq}</b><span>أجنبية</span></div></div>
 <div class="sec ar"><h4>حسب القطاع (اضغط للتصفية)</h4>${sec.map(([k,n])=>bar(SECN[k],n,sec[0][1],SECC[k],`data-ssec="${k}"`)).join('')}</div>
 <div class="sec ar"><h4>أكثر المحافظات والدول حضورًا</h4>${loc.map(([k,n])=>bar(k,n,loc[0][1],null,`data-sloc="${esc(k)}"`)).join('')}</div>
 <div class="sec ar"><h4>حجم الشركة</h4>${sz.map(([k,n])=>bar(SIZEN[k],n,sz[0][1])).join('')}</div>
 <div class="sec ar"><h4>نطاق السوق</h4>${rch.map(([k,n])=>bar(REACHN[k],n,rch[0][1])).join('')}</div>
 <div class="sec ar"><h4>ماذا يبحثون عنه (مستخرَج آليًا من نصوص الملف)</h4>${sk.map(([k,n])=>bar(SEEKN[k],n,sk[0][1],null,`data-sseek="${k}"`)).join('')}</div>
 <div class="sec ar"><h4>أكثر الأدوار شيوعًا</h4>${ro.map(([k,n])=>bar(k,n,ro[0][1])).join('')}</div>`}
function renderF(){const grp=(t,items,set,key)=>`<div class="fg"><h4>${t}</h4><div class="fgc">${items.map(([v,l])=>`<button class="chip" data-g="${key}" data-v="${esc(v)}" aria-pressed="${S[key].has(typeof v==='string'&&/^\d+$/.test(v)?+v:v)}">${esc(l)}</button>`).join('')}</div></div>`;
 const locs=[...new Set(D.map(c=>c.l))].sort((a,b)=>D.filter(c=>c.l===b).length-D.filter(c=>c.l===a).length);
 const roles=[...new Set(D.flatMap(c=>c.r))].sort((a,b)=>D.filter(c=>c.r.includes(b)).length-D.filter(c=>c.r.includes(a)).length).slice(0,12);
 $('fgs').innerHTML=grp('القطاع',SECN.map((n,i)=>[String(i),n]),S.sec,'sec')+grp('المحافظة / الدولة',locs.map(l=>[l,l]),S.loc,'loc')+grp('الدور',roles.map(r=>[r,r]),S.role,'role')+grp('الحجم',SIZES.map((n,i)=>[String(i),n]),S.size,'size')+grp('نطاق السوق',REACHN.map((n,i)=>[String(i),n]),S.reach,'reach')+grp('يبحث عن (تقديري)',Object.entries(SEEKN),S.seek,'seek')+grp('النوع',[['0','شركة عراقية'],['1','شركة أجنبية']],S.typ,'typ')}
function detail(n){const c=byN(n);if(!c)return;const k=c.c;const li=a=>a&&a.length?`<ul>${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'';
 const web=k.u?(/^https?:/.test(k.u)?k.u:'https://'+k.u):'';
 const sim=D.filter(o=>o.n!==c.n).map(o=>{let s=(o.s===c.s?3:0)+(o.l===c.l?1:0);const w=new Set(c.te.toLowerCase().split(/\W+/).filter(x=>x.length>4));o.te.toLowerCase().split(/\W+/).forEach(x=>{if(w.has(x))s+=2});return[o,s]}).filter(x=>x[1]>=4).sort((a,b)=>b[1]-a[1]).slice(0,4).map(x=>x[0]);
 $('dsh').innerHTML=`<button class="x" data-close>✕</button><div style="--sc:${SECC[c.s]}"><h2>${esc(c.nm)}</h2><p class="tg" style="font-size:15px">${esc(c.ta||'')}</p><div class="bd"><span class="b s">${SECN[c.s]}</span><span class="b">📍 ${esc(c.l)}</span>${c.z>=0?`<span class="b">${SIZEN[c.z]}</span>`:''}${c.h>=0?`<span class="b">${REACHN[c.h]}</span>`:''}${c.y?`<span class="b">تأسست ${c.y}</span>`:''}<span class="b">INTF-${String(c.n).padStart(3,'0')}</span></div>${c.r.length?`<div class="bd" style="margin-top:6px">${c.r.map(r=>`<span class="b">${esc(r)}</span>`).join('')}</div>`:''}</div>
 <div class="act"><button class="btn${S.fav.has(c.n)?'':' o'}" data-fav="${c.n}" id="dfav">${S.fav.has(c.n)?'★ في قائمتي':'☆ أضف إلى قائمتي'}</button></div>
 ${c.ov?`<div class="sec"><h4>نبذة<span class="en">من دليل المنتدى (بالإنجليزية)</span></h4><p>${esc(c.ov)}</p></div>`:''}
 ${c.pr.length?`<div class="sec"><h4>المنتجات والخدمات<span class="en">English</span></h4>${li(c.pr)}</div>`:''}
 ${c.ft.length?`<div class="sec"><h4>أبرز المزايا<span class="en">English</span></h4>${li(c.ft)}</div>`:''}
 ${c.mk?`<div class="sec"><h4>الأسواق<span class="en">English</span></h4><p>${esc(c.mk)}</p></div>`:''}
 ${c.cp?`<div class="sec"><h4>الطاقة والشروط<span class="en">English</span></h4><p>${esc(c.cp)}</p></div>`:''}
 ${c.in?`<div class="sec"><h4>اهتماماتها التجارية / ما تبحث عنه<span class="en">English</span></h4><p>${esc(c.in)}</p></div>`:''}
 ${c.fl?`<div class="sec ar"><h4>يبدو أنها تبحث عن (تقدير آلي)</h4><div class="bd">${c.fl.split('').map(f=>`<span class="b">${SEEKN[f]}</span>`).join('')}</div></div>`:''}
 <div class="sec ar"><h4>جهة الاتصال</h4>${k.n||k.p||k.e||web?`<p style="direction:rtl;text-align:right">${esc(k.n)}${k.t?' — '+esc(k.t):''}</p><div class="act">${k.p?`<a class="btn" href="tel:${esc(k.p.replace(/\s/g,''))}">📞 اتصال</a>`:''}${k.w?`<a class="btn g" target="_blank" rel="noopener" href="https://wa.me/${esc(k.w)}">واتساب</a>`:''}${k.e?`<a class="btn o" href="mailto:${esc(k.e)}">✉ بريد</a>`:''}${web?`<a class="btn o" target="_blank" rel="noopener" href="${esc(web)}">🌐 الموقع</a>`:''}</div><p style="direction:ltr;text-align:left;font-size:13px;color:var(--mut)">${[k.p,k.e].filter(Boolean).map(esc).join(' · ')}${k.so&&k.so.length?' · '+k.so.map(esc).join(' · '):''}</p>`:'<p style="direction:rtl;text-align:right;color:var(--mut)">لا توجد بيانات اتصال في الدليل.</p>'}</div>
 <div class="sec ar"><h4>ملاحظاتي</h4><textarea id="note" placeholder="مثال: موعد اجتماع B2B، ما أريد سؤاله…">${esc(S.notes[c.n]||'')}</textarea></div>
 ${sim.length?`<div class="sec ar"><h4>شركات مشابهة</h4><div class="sim">${sim.map(card).join('')}</div></div>`:''}
 <p class="hint">المصدر: INTF_Company_Profiles_Final.pdf — صفحة ${c.pp||'—'} من الدليل (صفحة ${c.pd} في ملف PDF).</p>`;
 $('ovD').classList.add('on');$('dsh').scrollTop=0;detail.cur=n}
/* ---------- events ---------- */
document.addEventListener('click',e=>{const t=e.target;
 const fv=t.closest('[data-fav]');if(fv){e.stopPropagation();const n=+fv.dataset.fav;S.fav.has(n)?S.fav.delete(n):S.fav.add(n);sv();renderList();renderFav();if($('ovD').classList.contains('on'))detail(detail.cur);return}
 if(t.closest('[data-close]')){$('ovF').classList.remove('on');$('ovD').classList.remove('on');return}
 if(t.classList.contains('ov')){t.classList.remove('on');return}
 const co=t.closest('.co');if(co){detail(+co.dataset.n);return}
 const s=t.closest('[data-s]');if(s){const i=+s.dataset.s;S.sec.has(i)?S.sec.delete(i):S.sec.add(i);S.shown=40;renderList();return}
 const g=t.closest('[data-g]');if(g){const k=g.dataset.g;let v=g.dataset.v;if(['sec','size','reach','typ'].includes(k))v=+v;S[k].has(v)?S[k].delete(v):S[k].add(v);S.shown=40;renderF();renderList();return}
 const ex=t.closest('[data-ex]');if(ex){$('q').value=ex.dataset.ex;S.q=ex.dataset.ex;S.shown=40;renderList();return}
 const ss=t.closest('[data-ssec]');if(ss){S.sec=new Set([+ss.dataset.ssec]);goto('vDir');return}
 const sl=t.closest('[data-sloc]');if(sl){S.loc=new Set([sl.dataset.sloc]);goto('vDir');return}
 const sk=t.closest('[data-sseek]');if(sk){S.seek=new Set([sk.dataset.sseek]);goto('vDir');return}
 const nv=t.closest('nav button');if(nv){goto(nv.dataset.v);return}
 if(t.id==='fbtn'||t.closest('#fbtn')){renderF();$('ovF').classList.add('on');return}
 if(t.id==='fclr'){['sec','loc','role','size','reach','seek','typ'].forEach(k=>S[k].clear());renderF();renderList();return}
 if(t.id==='more'){S.shown+=40;renderList();return}
 if(t.id==='fcopy'){const x=favText();(navigator.clipboard?navigator.clipboard.writeText(x):Promise.reject()).then(()=>toast('تم نسخ القائمة')).catch(()=>{const a=document.createElement('textarea');a.value=x;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('تم نسخ القائمة')}catch(_){toast('تعذّر النسخ')}a.remove()});return}
 if(t.id==='fclear'){if(t.dataset.sure){S.fav.clear();sv();renderFav();renderList()}else{t.dataset.sure=1;t.textContent='اضغط للتأكيد';setTimeout(()=>{if(t.isConnected){delete t.dataset.sure;t.textContent='مسح الكل'}},2500)}return}
 if(t.id==='thm'){const r=document.documentElement,l=r.dataset.theme!=='light';r.dataset.theme=l?'light':'dark';t.textContent=l?'☾':'☀';try{localStorage.setItem('intfdir-theme',r.dataset.theme)}catch(_){}}
});
function goto(v){document.querySelectorAll('.v').forEach(x=>x.classList.toggle('on',x.id===v));document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v));if(v==='vFav')renderFav();if(v==='vStats')renderStats();if(v==='vDir')renderList();window.scrollTo(0,0)}
$('q').addEventListener('input',e=>{S.q=e.target.value;S.shown=40;renderList()});
$('sort').addEventListener('change',e=>{S.sort=e.target.value;renderList()});
document.addEventListener('input',e=>{if(e.target.id==='note'){S.notes[detail.cur]=e.target.value;sv()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('ovF').classList.remove('on');$('ovD').classList.remove('on')}});
$('thm').textContent=document.documentElement.dataset.theme==='light'?'☾':'☀';
$('sub').innerHTML=D.length+' شركة مشاركة · 28–29 أكتوبر 2026 · فندق بابل روتانا، بغداد · من <a href="https://ameer.itbabylon.org/dubsar/" target="_blank" rel="noopener" style="color:var(--acc);font-weight:700;text-decoration:underline">دُبسار</a>';
prep();renderList();
</script>
<script>/* visit counter: no personal data */(function(p){var n="0";try{if(!localStorage.getItem("intfv_"+p)){localStorage.setItem("intfv_"+p,"1");n="1"}}catch(e){}new Image().src="https://ameer.itbabylon.org/sensors-api/hit?p="+p+"&n="+n+"&t="+Date.now()})("intf-ar");</script>
</body>
</html>
