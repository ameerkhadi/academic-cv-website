.now .big{font-size:18px;font-weight:700;margin:3px 0}
.now .row{margin-top:8px;padding-top:8px;border-top:1px solid #ffffff30;font-size:13.5px}

.tabs,.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.tab,.chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:7px 13px;font-size:13.5px}
.tab[aria-pressed=true],.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.warn{background:#fff3cd;color:#5c4400;border-radius:12px;padding:9px 12px;font-size:13px;margin:6px 0}
.tl{position:relative;margin-top:6px}
.slot{display:flex;gap:10px;position:relative;padding-bottom:12px}
.tm{width:52px;flex:none;text-align:end;font-weight:700;font-size:14px;padding-top:9px}
.tm small{display:block;font-weight:400;color:var(--mut);font-size:11px}
.rail{width:18px;flex:none;position:relative}
.rail:before{content:"";position:absolute;inset-block:0;inset-inline-start:8px;width:2px;background:var(--line)}
.slot.done .rail:before{background:var(--ink)}
.dot{position:absolute;top:12px;inset-inline-start:3px;width:12px;height:12px;border-radius:50%;background:var(--card);border:2px solid var(--line)}
.slot.done .dot{background:var(--ink);border-color:var(--ink)}
.slot.live .dot{background:var(--live);border-color:var(--live);box-shadow:0 0 0 0 #1fa97166;animation:p 1.6s infinite}
@keyframes p{70%{box-shadow:0 0 0 9px #1fa97100}}
.cards{flex:1;display:grid;gap:7px;min-width:0}
.card{background:var(--sess);border-radius:12px;padding:10px 12px;position:relative;border-inline-start:4px solid transparent}
.card.plen{background:var(--card);border-inline-start-color:var(--acc);box-shadow:0 1px 3px #0001}
.card.b2b{background:var(--b2b);color:var(--b2bt)}
.card.lunch,.card.social{background:transparent;border:1px dashed var(--line)}
.card.corner{background:var(--card);border-inline-start-color:#2aa3a3}
.card.past{opacity:.5}.card.live{border-inline-start-color:var(--live);outline:2px solid var(--live)}
.ti{font-weight:600;padding-inline-end:34px}.meta{font-size:12px;opacity:.8;margin-top:3px}
.sp{font-size:12px;opacity:.75}
.badge{display:inline-block;font-size:10.5px;font-weight:700;background:var(--live);color:#fff;border-radius:6px;padding:1px 6px;margin-inline-end:6px}

.star[aria-pressed=true]{color:var(--acc);opacity:1}
.nowline{display:flex;align-items:center;gap:6px;color:var(--live);font-weight:700;font-size:12px;margin:0 0 10px 62px}
.nowline:after{content:"";flex:1;height:2px;background:var(--live)}
.empty{color:var(--mut);text-align:center;padding:30px 10px}
.sim{position:fixed;bottom:0;inset-inline:0;background:var(--card);border-top:1px solid var(--line);padding:8px 14px calc(8px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center;justify-content:center;font-size:12.5px;flex-wrap:wrap}

.hall{background:var(--card);border-radius:14px;padding:12px;border-top:5px solid var(--line);box-shadow:0 1px 3px #0001}
.hall.on{border-top-color:var(--live);box-shadow:0 0 0 2px var(--live)}
.hh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.hh b{font-size:15.5px}

.hall.on .hs{background:var(--live);color:#fff}
.lb{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:8px 0 3px;font-weight:700}

.hall.on .hn{border-inline-start:4px solid var(--live)}
.hx{font-size:12px;color:var(--mut);font-weight:400;margin-top:2px}

.hall .hs{background:color-mix(in srgb,var(--hc) 22%,var(--card));color:var(--ink)}

.hall.open .sum{display:none}

.hall.open{grid-column:1/-1;box-shadow:0 6px 18px #0003;animation:pop .3s}

it:["Registrazione e visita all'esposizione","Cerimonia ufficiale di apertura","Plenaria: il ruolo dell'Iraq nel commercio e negli investimenti globali","Pausa pranzo","Finanziare le imprese irachene: dalla riduzione del rischio a investimenti finanziabili","Collegare l'Iraq ai mercati regionali e globali","Incontri B2B: colloqui individuali (in parallelo alle sessioni)","Rafforzare la fiducia degli investitori in Iraq","L'Iraq è pronto per il commercio digitale?","Ricevimento serale (solo su invito)","Innovazione guidata dalla domanda","Digitalizzare il commercio dei prodotti freschi in Iraq","E-commerce B2B e digitalizzazione delle catene di fornitura","Da un problema locale a un'azienda tech scalabile","Occupabilità e talenti iracheni","Entrare nel mercato iracheno con i dati","Guidare la transizione verde dell'Iraq attraverso commercio e investimenti","L'Iraq a un bivio: priorità strategiche degli investimenti pubblici","Costruire settori iracheni competitivi: l'agroalimentare come modello","Cerimonia di chiusura e premi del forum","Innovazioni locali per case a risparmio energetico","AuditMyBEIT: dall'audit energetico alle case verdi","Competenze digitali per decisioni aziendali migliori","Anbar: talenti, incubatori e investimenti","L'IA e il futuro del marketing in Iraq"],
nl:["Registratie en bezoek aan de beurs","Officiële openingsceremonie","Plenaire sessie: de plaats van Irak in wereldwijde handel en investeringen","Lunchpauze","Iraakse bedrijven financieren: van risicovermindering naar financierbare investeringen","Irak verbinden met regionale en wereldwijde markten","B2B-ontmoetingen: één-op-één (parallel aan de sessies)","Het vertrouwen van investeerders in Irak versterken","Is Irak klaar voor digitale handel?","Avondreceptie (alleen op uitnodiging)","Vraaggestuurde innovatie","Digitalisering van de handel in verse producten in Irak","B2B-e-commerce en digitalisering van toeleveringsketens","Van lokaal probleem naar schaalbaar techbedrijf","Inzetbaarheid en Iraaks talent","De Iraakse markt betreden met data","De groene transitie van Irak stimuleren via handel en investeringen","Irak op een kruispunt: strategische prioriteiten voor publieke investeringen","Concurrerende Iraakse sectoren opbouwen: agrovoeding als model","Sluitingsceremonie en forumprijzen","Lokale innovaties voor energiezuinige woningen","AuditMyBEIT: van energie-audit naar groene woningen","Digitale vaardigheden voor betere zakelijke beslissingen","Anbar: talent, incubators en investeringen","AI en de toekomst van marketing in Irak"]};
const S={lang:"en",day:28,filter:"all",view:"tl",plan:new Set(),off:null};
try{const p=localStorage.getItem("intf26plan");if(p)S.plan=new Set(JSON.parse(p));const l=localStorage.getItem("intf26lang");if(l)S.lang=l}catch(e){}
const TC={plen:"#d4a017",sess:"#3b82f6",b2b:"#1c2155",corner:"#14b8a6",social:"#ef6c3a",lunch:"#9aa0b5"};
const HC={k:"#7b4fd6",i:"#e0457b",e:"#1d8fe0",c:"#14a3a3",m:"#e08a1e",l:"#6b7a8f"};
const $=id=>document.getElementById(id);
const L=()=>({...T.en,...T[S.lang]});
const base=d=>Date.UTC(2026,9,d);
const abs=(x,m)=>base(x.d)+m*6e4;
const bgNow=()=>S.off!==null?S.off:Date.now()+3*36e5;
const fmt=m=>String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
const st=x=>{const n=bgNow();return n>=abs(x,x.e)?"past":n>=abs(x,x.s)?"live":"up"};
const K=[...new Set(E.map(x=>x.en))];const title=x=>S.lang==="ar"?x.ar:(TR[S.lang]?TR[S.lang][K.indexOf(x.en)]||x.en:x.en);
function save(){try{localStorage.setItem("intf26plan",JSON.stringify([...S.plan]));localStorage.setItem("intf26lang",S.lang)}catch(e){}}
function renderNow(){
 const l=L(),n=bgNow(),el=$("now");
 const live=E.filter(x=>st(x)==="live"&&x.t!=="corner");
 const ups=E.filter(x=>abs(x,x.s)>n&&x.t!=="lunch").sort((a,b)=>abs(a,a.s)-abs(b,b.s));
 let h="";
 if(n<abs(E[0],E[0].s)){
  let ms=abs(E[0],E[0].s)-n,d=Math.floor(ms/864e5),hh=Math.floor(ms%864e5/36e5),mm=Math.floor(ms%36e5/6e4);
  h=`<small>${l.starts}</small><div class="cd"><div><b>${d}</b><span>${l.d}</span></div><div><b>${hh}</b><span>${l.h}</span></div><div><b>${mm}</b><span>${l.m}</span></div></div>`;
 }else if(!ups.length&&!live.length){h=`<div class="big">${l.after}</div>`}
 else{
  h=`<small>${l.now}</small>`;
  h+=live.length?live.map(x=>`<div class="big">${title(x)}</div><div class="sp">${x.r?l.hall[x.r]:""} · ${fmt(x.s)}–${fmt(x.e)}</div>`).join(""):`<div class="big" style="font-size:15px;opacity:.85">${l.nothing}</div>`;
  if(ups.length){const t=ups[0].s,d=ups[0].d,g=ups.filter(x=>x.s===t&&x.d===d);
   h+=`<div class="row"><small>${l.next} · ${fmt(t)}</small>${g.map(x=>`<div>${title(x)} <span class="sp">— ${x.r?l.hall[x.r]:""}</span></div>`).join("")}</div>`}
 }
 el.innerHTML=h;
}
function conflicts(){
 const a=E.filter(x=>S.plan.has(x.id)&&x.t!=="lunch").sort((p,q)=>abs(p,p.s)-abs(q,q.s)),out=[];
 for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length;j++)if(a[i].d===a[j].d&&a[j].s<a[i].e)out.push([a[i],a[j]]);
 return out;
}
function card(x){
 const l=L(),s=st(x),r=x.r?l.hall[x.r]:"";
 const star=x.t==="lunch"?"":`<button class="star" data-id="${x.id}" aria-pressed="${S.plan.has(x.id)}" aria-label="plan">${S.plan.has(x.id)?"★":"☆"}</button>`;
 return `<div class="card ${x.t} ${s==="past"?"past":""} ${s==="live"?"live":""}" style="--hc:${HC[x.r]||"transparent"}">${star}
 <div class="ti">${s==="live"?`<span class="badge">${l.livebadge}</span>`:""}${title(x)}</div>
 <div class="meta">${fmt(x.s)}–${fmt(x.e)}${r?" · "+r:""}${x.t==="corner"?" · "+l.ar:""}</div>${x.sp?`<div class="sp">${x.sp}</div>`:""}</div>`;
}
function renderTL(){
 const l=L();let list;
 if(S.filter==="plan")list=E.filter(x=>S.plan.has(x.id));
 else list=E.filter(x=>x.d===S.day&&(S.filter==="all"||x.t===S.filter||(S.filter==="plen"&&x.t==="plen")));
 if(S.filter==="plan")list=list.filter(x=>x.d===S.day);
 list.sort((a,b)=>a.s-b.s||"plen,sess,b2b,corner,social,lunch".indexOf(a.t)-"plen,sess,b2b,corner,social,lunch".indexOf(b.t));
 if(!list.length){$("tl").innerHTML=`<div class="empty">${S.filter==="plan"?l.empty:"—"}</div>`;return}
 const slots=[];list.forEach(x=>{let s=slots.find(q=>q.s===x.s);if(!s){s={s:x.s,items:[]};slots.push(s)}s.items.push(x)});
 const n=bgNow();let h="",nl=false;
 slots.forEach(sl=>{
  const status=sl.items.some(x=>st(x)==="live")?"live":sl.items.every(x=>st(x)==="past")?"done":"";
  if(!nl&&n>=base(S.day)&&n<base(S.day+1)&&n<abs({d:S.day},sl.s)&&slots.indexOf(sl)>0&&status===""){h+=`<div class="nowline">${l.nowl} ${fmt(Math.floor((n-base(S.day))/6e4))}</div>`;nl=true}
  h+=`<div class="slot ${status}"><div class="tm">${fmt(sl.s)}</div><div class="rail"><span class="dot"></span></div><div class="cards">${sl.items.map(card).join("")}</div></div>`;
 });
 $("tl").innerHTML=h;
}
function renderWarn(){
 const c=conflicts(),l=L();
 $("warn").innerHTML=c.length?c.map(([a,b])=>`<div class="warn">⚠️ ${l.conf} <b>${title(a)}</b> ↔ <b>${title(b)}</b> (${fmt(b.s)})</div>`).join(""):"";
}
function renderCtl(){
 const l=L();
 $("tabs").innerHTML=`<button class="tab" data-view="halls" aria-pressed="${S.view==="halls"}">${l.halls}</button>`+[28,29].map(d=>`<button class="tab" data-day="${d}" aria-pressed="${S.view==="tl"&&S.day===d}">${l["d"+d]}</button>`).join("");
 $("chips").style.display=S.view==="halls"?"none":"flex";
 const f=[["all",l.all],["plan",l.plan+" ("+S.plan.size+")"],["plen",l.plen],["sess",l.sess],["b2b",l.b2b],["corner",l.corner]];
 $("chips").innerHTML=f.map(([k,v])=>`<button class="chip" data-f="${k}" aria-pressed="${S.filter===k}">${v}</button>`).join("");
 document.querySelectorAll("[data-t]").forEach(e=>e.textContent=l[e.dataset.t]);
 $("go").textContent=l.go;$("live").textContent=l.live;
 document.documentElement.lang=S.lang;document.documentElement.dir=S.lang==="ar"?"rtl":"ltr";
 $("lang").value=S.lang;
}
function rel(x){const l=L(),m=Math.max(0,Math.round((abs(x,x.s)-bgNow())/6e4));if(m<60)return m+" "+l.m;if(m<1440)return Math.floor(m/60)+" "+l.h+" "+(m%60)+" "+l.m;return Math.floor(m/1440)+" "+l.d+" "+Math.floor(m%1440/60)+" "+l.h}
function renderHalls(){
 const l=L(),on=S.view==="halls",n=bgNow(),today=new Date(n).getUTCDate();
 $("halls").style.display=on?"grid":"none";$("tl").style.display=on?"none":"";$("warn").style.display=on?"none":"";
 if(!on)return;
 const tag=x=>x.d===today?"":l["d"+x.d]+" · ";
 $("halls").innerHTML=`<div class="lg">${["plen","sess","b2b","corner"].map(k=>`<span><i style="background:${TC[k]}"></i>${l[k]}</span>`).join("")}</div>`+["k","i","e","c","m","l"].map(k=>{
  const it=E.filter(x=>x.r===k&&st(x)!=="past").sort((a,b)=>abs(a,a.s)-abs(b,b.s));
  const now=it.filter(x=>st(x)==="live"),up=it.filter(x=>st(x)==="up"),nx=up[0],lt=up.slice(1);
  let h=`<div class="hall ${now.length?"on":""} ${S.open===k?"open":""}" data-hall="${k}" style="--hc:${HC[k]}"><div class="hh"><b>${l.hall[k]}</b><span class="hs">${now.length?l.livebadge:it.length?l.free:"—"}</span></div>`;
  if(!it.length)return h+`<div class="hdone">${l.done}</div></div>`;
  h+=`<div class="sum" style="--ec:${TC[(now[0]||nx||{}).t]||"transparent"}">${now.length?`<b>${title(now[0])}</b><span>${fmt(now[0].s)}–${fmt(now[0].e)}</span>`:nx?`${l.nxt}: ${title(nx)}<span>${tag(nx)}${fmt(nx.s)} · ${l.inn} ${rel(nx)}</span>`:""}</div><div class="det"><div>`;
  if(now.length)h+=`<div class="lb">${l.now}</div>`+now.map(x=>`<div class="hn" style="--ec:${TC[x.t]}">${title(x)}<div class="hx">${fmt(x.s)}–${fmt(x.e)}</div></div>`).join("");
  if(nx)h+=`<div class="lb">${l.nxt}</div><div class="hn" style="font-weight:500;--ec:${TC[nx.t]}">${title(nx)}<div class="hx">${tag(nx)}${fmt(nx.s)} · ${l.inn} ${rel(nx)}</div></div>`;
  if(lt.length)h+=`<div class="lb">${l.ltr}</div>`+lt.slice(0,4).map(x=>`<div class="hl" style="--ec:${TC[x.t]}"><b>${tag(x)}${fmt(x.s)}</b><span>${title(x)}</span></div>`).join("")+(lt.length>4?`<div class="hx">+${lt.length-4} ${l.more}</div>`:"");
  return h+"</div></div></div>";
 }).join("");
}
function all(){renderCtl();renderNow();renderWarn();renderTL();renderHalls()}
document.addEventListener("click",e=>{
 const t=e.target.closest("button");if(!t)return;
 if(t.dataset.day){S.day=+t.dataset.day;S.view="tl";all()}
 else if(t.dataset.view){S.view=t.dataset.view;all()}
 else if(t.dataset.f){S.filter=t.dataset.f;all()}
 else if(t.dataset.id){S.plan.has(t.dataset.id)?S.plan.delete(t.dataset.id):S.plan.add(t.dataset.id);save();all()}
});
document.addEventListener("click",e=>{const c=e.target.closest(".hall");if(!c)return;const was=c.classList.contains("open");document.querySelectorAll(".hall.open").forEach(x=>x.classList.remove("open"));if(!was){c.classList.add("open");setTimeout(()=>c.scrollIntoView({behavior:"smooth",block:"nearest"}),50)}S.open=was?null:c.dataset.hall});
$("thm").onclick=()=>{const r=document.documentElement,d=r.dataset.theme!=="light";r.dataset.theme=d?"light":"dark";$("thm").textContent=d?"☾":"☀";try{localStorage.setItem("intf26theme",r.dataset.theme)}catch(e){}};
try{const t=localStorage.getItem("intf26theme");if(t)document.documentElement.dataset.theme=t}catch(e){}
$("thm").textContent=document.documentElement.dataset.theme==="light"?"☾":"☀";
$("lang").onchange=e=>{S.lang=e.target.value;save();all()};
$("go").onclick=()=>{const v=$("simt").value;if(v){const d=new Date(v+"Z");S.off=d.getTime();S.day=Math.min(29,Math.max(28,d.getUTCDate()));all()}};
$("live").onclick=()=>{S.off=null;all()};
// auto-open the right day
(()=>{const d=new Date(bgNow()).getUTCDate();if(d===29&&new Date(bgNow()).getUTCMonth()===9)S.day=29})();
all();setInterval(()=>{renderNow();renderTL();renderHalls()},30000);
</script>
