<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>الذكاء الاصطناعي بإدارة العمل</title>
  <meta name="description" content="محاضرة جامعية عن استخدام الذكاء الاصطناعي بإدارة العمل." />
  <style>
    :root{--paper:#f7f5ef;--ink:#173b70;--soft:#687587;--red:#a63b32;--line:rgba(23,59,112,.15)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Segoe UI",Tahoma,Arial,sans-serif;color:var(--ink)}body{background:radial-gradient(circle at 12% 8%,#fff,transparent 32%),linear-gradient(135deg,#f7f5ef,#eeece4);background-attachment:fixed}.app{min-height:100vh;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,rgba(23,59,112,.035) 32px,transparent 33px)}
    header{height:92px;padding:0 5vw;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(23,59,112,.1)}.brand{display:flex;align-items:center;gap:14px}.mark{width:54px;height:54px;background:#fffdf7;border:1px solid rgba(23,59,112,.15);box-shadow:0 8px 18px rgba(30,47,68,.1);display:grid;place-items:center;transform:rotate(-3deg);position:relative;font-size:25px}.mark:after{content:"";position:absolute;right:5px;left:5px;bottom:-7px;height:3px;background:var(--red);transform:rotate(-2deg)}.eyebrow{margin:0 0 4px;color:var(--red);letter-spacing:.1em;font-size:10px;font-weight:800}.brand h1{margin:0;font-size:21px}.status{display:flex;align-items:center;gap:8px;color:var(--soft);font-size:12px;font-weight:700}.dot{width:7px;height:7px;border-radius:50%;background:var(--red)}
    .layout{width:min(1480px,92vw);min-height:calc(100vh - 160px);margin:auto;display:grid;grid-template-columns:240px minmax(0,1fr);gap:clamp(28px,5vw,76px);align-items:center}.rail{border-right:1px solid var(--line);padding:18px 20px 18px 0;min-height:520px}.rail h2{font-size:15px;margin:0 0 18px}.item{display:grid;grid-template-columns:1fr 28px;gap:10px;align-items:center;text-align:right;width:100%;padding:12px 10px;border:0;border-right:2px solid transparent;background:transparent;color:var(--soft);cursor:pointer;font:inherit}.item:hover{background:rgba(255,255,255,.55);color:var(--ink)}.item.active{background:rgba(255,255,255,.75);border-right-color:var(--red);color:var(--ink);font-weight:800;position:relative}.item.active:after{content:"";position:absolute;right:7px;bottom:5px;width:42px;height:2px;background:var(--red);transform:rotate(-1deg)}.num{font:11px monospace;opacity:.7;grid-column:2}.title{font-size:12px;line-height:1.5;grid-column:1;grid-row:1}
    main{padding:28px 0 24px}.meta{display:flex;justify-content:space-between;margin-bottom:14px;color:var(--soft);font-size:12px}.chapter{color:var(--red);font-weight:900}.stage{position:relative;aspect-ratio:16/9;background:#fffdf7;padding:8px;border:1px solid rgba(23,59,112,.12);box-shadow:0 22px 70px rgba(40,44,49,.16);transform:rotate(.15deg)}.stage img{width:100%;height:100%;object-fit:contain;display:block}.corner{position:absolute;bottom:16px;left:18px;background:rgba(255,253,247,.9);padding:5px 8px;color:var(--red);font:700 11px monospace;direction:ltr}.controls{display:flex;gap:10px;align-items:center;margin-top:22px}.button{border:1px solid rgba(23,59,112,.19);background:rgba(255,255,255,.65);color:var(--ink);border-radius:4px;padding:10px 14px;font-weight:800;cursor:pointer}.button:hover{background:#fff;transform:translateY(-1px)}.button.primary{background:var(--ink);color:#fff;box-shadow:3px 3px 0 rgba(166,59,50,.42)}.button:disabled{opacity:.35;cursor:not-allowed}.spacer{flex:1}.progress{height:5px;margin-top:18px;background:repeating-linear-gradient(to right,rgba(23,59,112,.1) 0,rgba(23,59,112,.1) 2px,transparent 2px,transparent 7px);direction:ltr}.progress span{display:block;height:100%;background:var(--red);transition:width .2s}.caption{text-align:center;color:var(--soft);font-size:11px}.footer{text-align:center;color:var(--soft);font-size:10px;padding:16px 5vw 24px}.footer kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:2px 6px;font:10px monospace}
    @media(max-width:900px){header{height:auto;padding:18px 5vw}.brand h1{font-size:17px}.status{display:none}.layout{display:block;width:92vw;min-height:auto}.rail{min-height:auto;border-right:0;border-bottom:1px solid var(--line);padding:14px 0}.rail h2{margin:0}.rail-list{display:flex;overflow-x:auto;gap:5px;margin-top:12px}.item{min-width:130px;border-right:0;border-bottom:2px solid transparent;padding:9px}.item.active{border-bottom-color:var(--red)}.main{padding-top:24px}.meta .note{display:none}}
    @media(max-width:560px){.mark{width:38px;height:38px;font-size:18px}.brand h1{font-size:15px}.eyebrow{font-size:8px}.stage{padding:4px}.controls{flex-wrap:wrap;justify-content:center}.spacer{display:none}.button{padding:9px 10px;font-size:11px}}
  </style>
</head>
<body><div class="app">
<header><div class="brand"><div class="mark">⌁</div><div><p class="eyebrow">دفتر المحاضرة · AI / MANAGEMENT</p><h1>الذكاء الاصطناعي بإدارة العمل</h1></div></div><div class="status"><span class="dot"></span>عرض المحاضرة</div></header>
<div class="layout"><aside class="rail"><h2>الفهرس</h2><div id="rail"></div></aside><main><div class="meta"><span class="chapter" id="chapter"></span><span class="note" id="note"></span></div><div class="stage"><img id="slide" alt="" /><div class="corner" id="counter"></div></div><div class="controls"><button class="button primary" id="next">التالي ›</button><button class="button" id="prev">‹ السابق</button><div class="spacer"></div><button class="button" id="auto">▶ تشغيل تلقائي</button><button class="button" id="start">↻ البداية</button></div><div class="progress"><span id="bar"></span></div><p class="caption">اضغط التالي أو استخدم سهمي اليمين واليسار</p></main></div>
<footer class="footer">محاضرة جامعية · نسخة العرض · استخدم <kbd>Space</kbd> للتشغيل أو الإيقاف</footer></div>
<script>
const slides=[
 ['manus_lecture_01_what_is_ai.png','شنو هو الذكاء الاصطناعي؟','01 / الأساسيات','نبدأ من الفكرة الأساسية قبل التطبيق.'],
 ['manus_lecture_02_who_am_i.png','منو آني؟','02 / التعريف','مانوس كمساعد ووكيل ذكاء اصطناعي.'],
 ['manus_lecture_03_how_to_ask.png','شلون نسأل الذكاء الاصطناعي؟','03 / السؤال','السؤال الواضح يعطي نتيجة أفضل.'],
 ['manus_lecture_04_what_i_can_do.png','شنو أگدر أساعدكم بيه؟','04 / الإمكانات','نحوّل الأفكار إلى خطوات قابلة للعمل.'],
 ['manus_lecture_05_limits_ethics.png','الحدود والمسؤولية','05 / التحقق','المساعدة لا تلغي الحكم البشري.'],
 ['manus_lecture_06_example_dialogue.png','مثال عملي: من سؤال إلى تعلّم','06 / تطبيق','كل سؤال جديد يخلّي الفهم أعمق.'],
 ['manus_lecture_07_good_student_use.png','شلون تستخدموني بطريقة صحيحة؟','07 / الممارسة','الفهم أولاً، السرعة ثانياً.'],
 ['manus_lecture_08_final_summary.png','الخلاصة','08 / النقاش','مانوس يساعد — الإنسان يوجّه.']
];
let index=0, timer=null;const $=id=>document.getElementById(id);function render(){const s=slides[index];$('slide').src='assets/'+s[0];$('slide').alt=s[1];$('chapter').textContent=s[2];$('note').textContent=s[3];$('counter').textContent=String(index+1).padStart(2,'0')+' / '+String(slides.length).padStart(2,'0');$('bar').style.width=((index+1)/slides.length*100)+'%';$('prev').disabled=index===0;$('next').disabled=index===slides.length-1;document.querySelectorAll('.item').forEach((el,i)=>el.classList.toggle('active',i===index));}function go(n){index=Math.max(0,Math.min(slides.length-1,n));render()}function toggle(){if(timer){clearInterval(timer);timer=null;$('auto').textContent='▶ تشغيل تلقائي'}else{timer=setInterval(()=>go(index<slides.length-1?index+1:0),8000);$('auto').textContent='Ⅱ إيقاف تلقائي'}}slides.forEach((s,i)=>{const b=document.createElement('button');b.className='item';b.innerHTML='<span class="num">'+String(i+1).padStart(2,'0')+'</span><span class="title">'+s[1]+'</span>';b.onclick=()=>go(i);$('rail').appendChild(b)});$('next').onclick=()=>go(index+1);$('prev').onclick=()=>go(index-1);$('start').onclick=()=>go(0);$('auto').onclick=toggle;document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='PageDown')go(index+1);if(e.key==='ArrowRight'||e.key==='PageUp')go(index-1);if(e.key==='Home')go(0);if(e.key==='End')go(slides.length-1);if(e.key===' ') {e.preventDefault();toggle()}});render();
</script></body></html>
